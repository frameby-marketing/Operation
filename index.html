    function getInventoryAnalysis() {
      const stockRows = state.raw.inventoryStock || [];
      const stockHeaders = stockRows[0] || [];
      const dataRows = stockRows.slice(1).filter(r => (r || []).some(c => String(c || '').trim() !== ''));

      // 재고관리_재고 탭은 품목별 블록이 가로로 반복될 수 있으므로,
      // 1행에서 '제품' 헤더가 나오는 위치를 기준으로 각 블록을 자동 감지한다.
      // 예: A~I = CLASSIC, J~R = 다른 품목, S~AA = 또 다른 품목...
      function norm(v) { return String(v || '').replaceAll(' ', '').toLowerCase(); }
      function headerIs(h, names) { return names.some(n => norm(h) === norm(n)); }
      function headerIncludes(h, names, exclude = []) {
        const text = norm(h);
        return names.some(n => text.includes(norm(n))) && !exclude.some(n => text.includes(norm(n)));
      }
      function findInRange(start, end, names, exclude = []) {
        for (let i = start; i < end; i++) {
          if (headerIncludes(stockHeaders[i], names, exclude)) return i;
        }
        return -1;
      }

      const productStarts = stockHeaders
        .map((h, i) => headerIs(h, ['제품','제품명','상품명','품목명','품목']) ? i : -1)
        .filter(i => i >= 0);

      const blocks = productStarts.map((start, idx) => {
        const end = productStarts[idx + 1] ?? stockHeaders.length;
        return {
          start,
          end,
          productIdx: start,
          modelIdx: findInRange(start, end, ['기종','모델']),
          caseColorIdx: findInRange(start, end, ['케이스색상','케이스 색상']),
          frameColorIdx: findInRange(start, end, ['프레임색상','프레임 색상']),
          cardSlotIdx: findInRange(start, end, ['카드수납','카드 수납']),
          optionIdx: findInRange(start, end, ['옵션','상세','상세품목','품목상세','구분','타입','종류','사양','규격']),
          colorIdx: findInRange(start, end, ['색상','컬러','칼라','color','제품색상','제품 색상','옵션색상','옵션 색상','DW색상','DW 색상'], ['케이스','프레임']),
          stockIdx: findInRange(start, end, ['재고','현재고','현재 재고','재고수량']),
          monthsIdx: findInRange(start, end, ['소진기간(월)','소진기간','소진 기간','소진개월']),
          selloutIdx: findInRange(start, end, ['소진시점','소진 시점','품절예상일','예상소진일']),
          soldoutIdx: findInRange(start, end, ['품절여부','품절 여부','품절','상태']),
          restockIdx: findInRange(start, end, ['재입고일정','재입고 일정','입고예정','입고 예정','재입고일'])
        };
      });

      function read(row, idx) { return idx >= 0 ? String(row[idx] || '').trim() : ''; }
      function num(row, idx) { return idx >= 0 ? toNum(row[idx]) : 0; }
      function firstMetricIndex(b) {
        const indexes = [b.stockIdx, b.monthsIdx, b.selloutIdx, b.soldoutIdx, b.restockIdx].filter(i => i >= 0);
        return indexes.length ? Math.min(...indexes) : b.end;
      }
      function collectExtraOptionParts(row, b, usedIdx) {
        const metricStart = firstMetricIndex(b);
        const metricNames = ['재고','현재고','수량','소진','품절','재입고','입고','일정','상태','기간','시점'];
        const parts = [];
        for (let i = b.start + 1; i < Math.min(metricStart, b.end); i++) {
          if (usedIdx.has(i)) continue;
          const header = String(stockHeaders[i] || '').trim();
          const value = read(row, i);
          if (!value) continue;
          const headerText = norm(header);
          if (metricNames.some(k => headerText.includes(norm(k)))) continue;
          parts.push({ label: header || '옵션', value });
        }
        return parts;
      }
      function statusBy(q, m, s) {
        if (String(s).includes('품절') || q <= 0 || (m > 0 && m <= 1)) return { label:'위험', tone:'danger', cls:'inventory-risk', score:0 };
        if ((m > 1 && m <= 2) || String(s).includes('주의') || String(s).includes('부족')) return { label:'주의', tone:'warn', cls:'inventory-warn', score:1 };
        return { label:'정상', tone:'good', cls:'inventory-ok', score:2 };
      }

      const enriched = [];
      dataRows.forEach(row => {
        blocks.forEach((b, blockIndex) => {
          const product = read(row, b.productIdx) || '제품 미지정';
          const usedOptionIdx = new Set([b.modelIdx, b.caseColorIdx, b.frameColorIdx, b.cardSlotIdx, b.optionIdx, b.colorIdx].filter(i => i >= 0));
          const baseVariantParts = [
            b.modelIdx >= 0 ? { label:'기종', value: read(row, b.modelIdx) } : null,
            b.caseColorIdx >= 0 ? { label:'케이스색상', value: read(row, b.caseColorIdx) } : null,
            b.frameColorIdx >= 0 ? { label:'프레임색상', value: read(row, b.frameColorIdx) } : null,
            b.cardSlotIdx >= 0 ? { label:'카드수납', value: read(row, b.cardSlotIdx) } : null,
            b.optionIdx >= 0 ? { label:'옵션', value: read(row, b.optionIdx) } : null,
            b.colorIdx >= 0 ? { label:'색상', value: read(row, b.colorIdx) } : null
          ].filter(x => x && x.value);
          const extraVariantParts = collectExtraOptionParts(row, b, usedOptionIdx);
          const variantParts = [...baseVariantParts, ...extraVariantParts];
          const variant = variantParts.length ? variantParts.map(x => x.value).join(' / ') : '-';
          const qty = num(row, b.stockIdx);
          const months = num(row, b.monthsIdx);
          const sellout = read(row, b.selloutIdx) || '-';
          const soldout = read(row, b.soldoutIdx);
          const restock = read(row, b.restockIdx) || '-';

          const hasData = product !== '제품 미지정' || variant !== '-' || qty > 0 || soldout || restock !== '-';
          if (!hasData) return;

          enriched.push({
            raw: row,
            blockIndex,
            product,
            variant,
            variantParts,
            qty,
            months,
            sellout,
            soldout,
            restock,
            status: statusBy(qty, months, soldout)
          });
        });
      });

      enriched.sort((a,b) => a.status.score - b.status.score || a.months - b.months || a.product.localeCompare(b.product, 'ko'));

      const riskRows = enriched.filter(r => r.status.label === '위험');
      const warnRows = enriched.filter(r => r.status.label === '주의');
      const okRows = enriched.filter(r => r.status.label === '정상');
      const totalQty = enriched.reduce((s,r)=>s+r.qty,0);

      const detected = blocks.map((b, i) => `블록${i + 1}: ${stockHeaders[b.productIdx] || '-'}~${stockHeaders[b.end - 1] || '-'}`).join(' / ');

      return {
        stockHeaders, stockObjects: [], enriched, riskRows, warnRows, okRows, totalQty,
        blocks, detected,
        productKey: detected || '제품 블록 없음',
        modelKey: blocks.map(b=>stockHeaders[b.modelIdx]).filter(Boolean).join(', ') || '없음',
        caseColorKey: blocks.map(b=>stockHeaders[b.caseColorIdx]).filter(Boolean).join(', ') || '없음',
        frameColorKey: blocks.map(b=>stockHeaders[b.frameColorIdx]).filter(Boolean).join(', ') || '없음',
        cardSlotKey: blocks.map(b=>stockHeaders[b.cardSlotIdx]).filter(Boolean).join(', ') || '없음',
        colorKey: blocks.map(b=>stockHeaders[b.colorIdx]).filter(Boolean).join(', ') || '없음',
        optionKey: blocks.map(b=>stockHeaders[b.optionIdx]).filter(Boolean).join(', ') || '없음',
        stockKey: blocks.map(b=>stockHeaders[b.stockIdx]).filter(Boolean).join(', ') || '없음',
        monthsKey: blocks.map(b=>stockHeaders[b.monthsIdx]).filter(Boolean).join(', ') || '없음',
        selloutKey: blocks.map(b=>stockHeaders[b.selloutIdx]).filter(Boolean).join(', ') || '없음',
        soldoutKey: blocks.map(b=>stockHeaders[b.soldoutIdx]).filter(Boolean).join(', ') || '없음',
        restockKey: blocks.map(b=>stockHeaders[b.restockIdx]).filter(Boolean).join(', ') || '없음'
      };
    }

    function normalizeInventoryProductName(productName) {
      return String(productName || '').trim().replaceAll('  ', ' ').toUpperCase();
    }

    function inventoryCategory(productName) {
      const raw = String(productName || '').trim();
      const name = normalizeInventoryProductName(raw);
      const compact = name.replaceAll(' ', '');

      const exactMap = {
        '맥세이프 케이스 에어': '휴대폰 케이스',
        '맥세이프 케이스 범퍼': '휴대폰 케이스',
        '프레임 케이스 범퍼': '휴대폰 케이스',
        '프레임 케이스 에어': '휴대폰 케이스',
        '매트블랙': '휴대폰 케이스',
        '베이직 케이스': '휴대폰 케이스',
        '프레임 케이스 실리콘': '휴대폰 케이스',
        '맥세이프 케이스 실리콘': '휴대폰 케이스',
        '울트라(NC)': '휴대폰 케이스',
        '울트라(완제품)': '휴대폰 케이스',
        '클래식': '휴대폰 케이스',
        '클래식(완제품)': '휴대폰 케이스',
        '스탠드 케이스': '에어팟 액세서리',
        '액정보호필름': '휴대폰 액세서리',
        'MAGSAFE FRAME': '휴대폰 액세서리',
        'MAGSAFE KICK FRAME': '휴대폰 액세서리',
        'MAGSAFE KICK FRAME ME': '휴대폰 액세서리',
        'MAGSAFE KICK FRAME METAL VERSION': '휴대폰 액세서리',
        'MAGSAFE ARC TOK': '휴대폰 액세서리',
        'MAGSAFE GRIP': '휴대폰 액세서리',
        'DW STAND BASIC': '노트북 거치대',
        'DW STAND PLUS': '노트북 거치대',
        'DW STAND PRO': '노트북 거치대',
        'PH STAND': '노트북 거치대',
        'FRAME TIP SHORT': '애플펜슬 팁',
        'FRAME TIP LONG': '애플펜슬 팁'
      };

      const direct = exactMap[raw] || exactMap[name];
      if (direct) return direct;
      if (compact.includes('DWSTAND') || compact.includes('PHSTAND') || compact.includes('노트북') || compact.includes('맥북') || compact.includes('LAPTOP')) return '노트북 거치대';
      if (compact.includes('FRAMETIP')) return '애플펜슬 팁';
      if (compact.includes('스탠드케이스')) return '에어팟 액세서리';
      if (compact.includes('케이스') || compact.includes('CASE') || compact.includes('CLASSIC') || compact.includes('클래식') || compact.includes('울트라') || compact.includes('매트블랙')) return '휴대폰 케이스';
      if (compact.includes('MAGSAFE') || compact.includes('맥세이프') || compact.includes('TOK') || compact.includes('GRIP') || compact.includes('필름') || compact.includes('액정보호')) return '휴대폰 액세서리';
      if (compact.includes('파우치') || compact.includes('POUCH')) return '파우치';
      return '기타';
    }

    function setInventoryCategory(category) {
      state.inventory.selectedCategory = category;
      state.inventory.selectedProduct = '';
      renderInventory();
    }

    function toggleInventoryRisk() {
      state.inventory.riskOpen = !state.inventory.riskOpen;
      renderInventory();
    }

    function setInventorySort(key) {
      if (state.inventory.sortKey === key) {
        state.inventory.sortDir = state.inventory.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.inventory.sortKey = key;
        state.inventory.sortDir = key === 'months' ? 'asc' : 'desc';
      }
      renderInventory();
    }

    let inventorySearchComposing = false;

    function setInventorySearch(value) {
      // 입력 중에는 값만 저장하고, 화면 전체 재렌더링은 하지 않는다.
      // 이렇게 해야 한글 자음/모음 조합이 깨지지 않고 입력 속도도 느려지지 않는다.
      state.inventory.search = value;
    }

    function submitInventorySearch(value) {
      state.inventory.search = value;
      renderInventory();
    }

    function clearInventorySearch() {
      state.inventory.search = '';
      renderInventory();
    }

    function startInventorySearchComposition() {
      inventorySearchComposing = true;
    }

    function endInventorySearchComposition(value) {
      inventorySearchComposing = false;
      setInventorySearch(value);
    }

    function handleInventorySearchKeydown(event, value) {
      if (event.key === 'Enter' && !inventorySearchComposing) {
        event.preventDefault();
        submitInventorySearch(value);
      }
    }

    function toggleInventoryOptionColumns(button) {
      const modal = button.closest('.inventory-modal');
      if (!modal) return;
      const isOpen = modal.classList.toggle('show-options');
      button.textContent = isOpen ? '옵션 컬럼 접기' : '옵션 컬럼 펼치기';
    }

    function openInventoryProduct(product) {
      state.inventory.selectedProduct = product;
      renderInventory();
    }

    function closeInventoryProduct() {
      state.inventory.selectedProduct = '';
      renderInventory();
    }

    function inventoryBadge(status) {
      const cls = status.tone === 'danger' ? 'danger' : status.tone === 'warn' ? 'warn' : '';
      return `<span class="badge ${cls}">${status.label}</span>`;
    }

    function renderInventoryCard(r) {
      const optionHtml = r.variantParts?.length
        ? r.variantParts.map(p => `<div>${p.label} <strong>${p.value}</strong></div>`).join('')
        : '<div>옵션 <strong>-</strong></div>';
      return `<div class="inventory-card ${r.status.cls}">
        <div class="inventory-name">${r.product}</div>
        <div class="inventory-meta">
          ${optionHtml}
          <div>재고 <strong>${fmt(r.qty)}개</strong></div>
          <div>소진기간 <strong>${r.months ? `${r.months}개월` : '-'}</strong></div>
          <div>소진시점 <strong>${r.sellout || '-'}</strong></div>
          <div>품절여부 <strong>${r.soldout || '-'}</strong></div>
          <div>재입고일정 <strong>${r.restock || '-'}</strong></div>
          <div>${inventoryBadge(r.status)}</div>
        </div>
      </div>`;
    }

    function renderInventory() {
      const a = getInventoryAnalysis();
      if (!a.stockHeaders.length || !a.enriched.length) {
        grid(`<article class="card full"><div class="card-head"><div><div class="card-title">재고 관리</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">재고관리_재고 시트 데이터를 불러오지 못했습니다. 시트 탭명과 공유 권한을 확인해 주세요.</div></article>`);
        return;
      }

      const q = (state.inventory.search || '').trim().toLowerCase();
      const searchFilteredRows = a.enriched.filter(r => `${r.product} ${r.variant} ${r.qty} ${r.months} ${r.sellout} ${r.soldout} ${r.restock}`.toLowerCase().includes(q));
      const categoryCounts = searchFilteredRows.reduce((map, r) => {
        const category = inventoryCategory(r.product);
        if (!map[category]) map[category] = { name: category, sku: 0, qty: 0, risk: 0 };
        map[category].sku += 1;
        map[category].qty += r.qty;
        if (r.status.label === '위험') map[category].risk += 1;
        return map;
      }, {});
      const categoryOrder = ['전체', '휴대폰 케이스', '휴대폰 액세서리', '노트북 거치대', '애플펜슬 팁', '에어팟 액세서리', '파우치', '기타'];
      const selectedCategory = state.inventory.selectedCategory || 'all';
      const filteredRows = selectedCategory === 'all' ? searchFilteredRows : searchFilteredRows.filter(r => inventoryCategory(r.product) === selectedCategory);

      const productMap = {};
      filteredRows.forEach(r => {
        const productName = String(r.product || '').trim() || '제품 미지정';
        if (!productMap[productName]) productMap[productName] = { name:productName, rows:[], qty:0, risk:0, warn:0, ok:0, minMonths:Infinity, nearestSellout:'-' };
        const g = productMap[productName];
        g.rows.push(r);
        g.qty += r.qty;
        if (r.status.label === '위험') g.risk += 1;
        else if (r.status.label === '주의') g.warn += 1;
        else g.ok += 1;
        if (r.months > 0) g.minMonths = Math.min(g.minMonths, r.months);
      });

      Object.values(productMap).forEach(g => {
        const nearest = g.rows
          .filter(r => r.sellout && r.sellout !== '-')
          .sort((x,y)=>(toDate(x.sellout)?.getTime() || 9999999999999) - (toDate(y.sellout)?.getTime() || 9999999999999))[0];
        g.nearestSellout = nearest?.sellout || '-';
      });

      const products = Object.values(productMap).sort((a,b) => b.risk - a.risk || b.warn - a.warn || a.minMonths - b.minMonths || a.name.localeCompare(b.name, 'ko'));
      const riskRows = filteredRows.filter(r => r.status.label !== '정상').slice(0, 20);
      const selectedProduct = state.inventory.selectedProduct;
      const selectedRows = selectedProduct ? filteredRows.filter(r => r.product === selectedProduct) : [];
      const selectedRowsSorted = [...selectedRows].sort((a,b) => {
        const dir = state.inventory.sortDir === 'asc' ? 1 : -1;
        const key = state.inventory.sortKey;
        if (key === 'product') return a.product.localeCompare(b.product, 'ko') * dir;
        return ((a[key] || 0) - (b[key] || 0)) * dir;
      });
      const selectedModal = selectedProduct ? `
        <div class="modal-backdrop" onclick="closeInventoryProduct()">
          <div class="modal-card inventory-modal" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div><div class="card-title">${selectedProduct} 재고 상세</div><div class="card-sub">기종 / 색상 / 재고 / 소진기간 / 재입고일정 상세</div></div>
              <button class="modal-close" onclick="closeInventoryProduct()">닫기</button>
            </div>
            <div class="flow-summary" style="margin-bottom:18px;">
              <div class="pill">SKU ${fmt(selectedRows.length)}개</div>
              <div class="pill">총 재고 ${fmt(selectedRows.reduce((s,r)=>s+r.qty,0))}개</div>
              <div class="pill">위험 ${fmt(selectedRows.filter(r=>r.status.label==='위험').length)}개</div>
              <div class="pill">주의 ${fmt(selectedRows.filter(r=>r.status.label==='주의').length)}개</div>
            </div>
            <div class="table-tools" style="margin-bottom:12px;">
              <div class="tool-left">
                <button onclick="setInventorySort('product')" class="${state.inventory.sortKey === 'product' ? 'active-mode' : ''}">제품명 ${state.inventory.sortKey === 'product' ? (state.inventory.sortDir === 'asc' ? '↑' : '↓') : ''}</button>
                <button onclick="setInventorySort('qty')" class="${state.inventory.sortKey === 'qty' ? 'active-mode' : ''}">재고 ${state.inventory.sortKey === 'qty' ? (state.inventory.sortDir === 'asc' ? '↑' : '↓') : ''}</button>
                <button onclick="setInventorySort('months')" class="${state.inventory.sortKey === 'months' ? 'active-mode' : ''}">소진기간 ${state.inventory.sortKey === 'months' ? (state.inventory.sortDir === 'asc' ? '↑' : '↓') : ''}</button>
                <button onclick="toggleInventoryOptionColumns(this)">옵션 컬럼 펼치기</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>제품</th><th>기종</th><th class="inventory-extra-col">케이스색상</th><th class="inventory-extra-col">프레임색상</th><th class="inventory-extra-col">카드수납</th><th class="inventory-extra-col">옵션</th><th>색상</th><th class="right">재고</th><th class="right">소진기간</th><th>소진시점</th><th>품절여부</th><th>재입고일정</th><th>상태</th></tr></thead>
                <tbody>${selectedRowsSorted.map(r=>`
                  <tr>
                    <td>${r.product}</td>
                    <td>${r.variantParts.find(p=>p.label==='기종')?.value || '-'}</td>
                    <td class="inventory-extra-col">${r.variantParts.find(p=>p.label==='케이스색상')?.value || '-'}</td>
                    <td class="inventory-extra-col">${r.variantParts.find(p=>p.label==='프레임색상')?.value || '-'}</td>
                    <td class="inventory-extra-col">${r.variantParts.find(p=>p.label==='카드수납')?.value || '-'}</td>
                    <td class="inventory-extra-col">${r.variantParts.find(p=>p.label==='옵션')?.value || r.variantParts.filter(p=>!['기종','케이스색상','프레임색상','카드수납','색상'].includes(p.label)).map(p=>`${p.label}: ${p.value}`).join(' / ') || '-'}</td>
                    <td>${r.variantParts.find(p=>p.label==='색상')?.value || r.variantParts.find(p=>p.label==='옵션')?.value || '-'}</td>
                    <td class="right">${fmt(r.qty)}</td>
                    <td class="right">${r.months ? `${r.months}개월` : '-'}</td>
                    <td>${r.sellout || '-'}</td>
                    <td>${r.soldout || '-'}</td>
                    <td>${r.restock || '-'}</td>
                    <td>${inventoryBadge(r.status)}</td>
                  </tr>
                `).join('')}</tbody>
              </table>
            </div>
          </div>
        </div>
      ` : '';

      grid(`
        ${metricCard('총 SKU','헤더명 기준',fmt(filteredRows.length),`전체 ${fmt(a.enriched.length)}개 중 표시`,'good',[filteredRows.length])}
        ${metricCard('재고 합계','재고 열 기준',fmt(filteredRows.reduce((s,r)=>s+r.qty,0)),`제품 ${fmt(products.length)}개 그룹`,'good',[filteredRows.reduce((s,r)=>s+r.qty,0)])}

        ${metricCard('주의 재고','소진기간 1~2개월',fmt(filteredRows.filter(r=>r.status.label==='주의').length),`발주 검토 대상`,filteredRows.some(r=>r.status.label==='주의') ? 'warn' : 'good',[filteredRows.filter(r=>r.status.label==='주의').length])}

    // ════════════════════════════════════════════════════════════
    // 발주관리 (Purchase Order) 탭
    // 별도 구글시트(발주 타임라인 / 재고 TOP) 기준. 기존 대시보드의
    // grid()/metricCard()/renderBarChart()/money()/fmt()/parseCSV() 를
    // 그대로 재사용하고, 이름 충돌을 피하기 위해 새 식별자는 po 접두사를 사용한다.
    // ════════════════════════════════════════════════════════════
    const PO_SHEET_ID = '1p-ko7c4--yUwYOYE2fL8X6Z1U3O1lWoJ36AZuBanGmQ';
    const PO_STOCK_SHEET_ID = '1najWl30V40gEHacr6LaNYDIaEgLHGAcxdLDqneW6MxE';
    const PO_TYPE_COLOR = { '신': 'var(--blue)', '추': 'var(--yellow)', '요': 'var(--green)', '기': 'var(--red)' };
    const PO_TYPE_LABEL = { '신': '신규 생산 발주', '추': '추가 입고', '요': '입고 요청', '기': '기존 생산물량 잔금' };
    const PO_MONTHS = [
      { m: 6, label: '6월', year: 2026, days: 30 },
      { m: 7, label: '7월', year: 2026, days: 31 },
      { m: 8, label: '8월', year: 2026, days: 31 },
      { m: 9, label: '9월', year: 2026, days: 30 },
      { m: 10, label: '10월', year: 2026, days: 31 },
      { m: 11, label: '11월', year: 2026, days: 30 },
      { m: 12, label: '12월', year: 2026, days: 31 }
    ];
    const PO_PRODUCT_ORDER = ['킥프레임','PH - 실버','PH - 블랙','DW프로 - 실버','DW프로 - 블랙','DW플러스 - 실버','DW플러스 - 블랙','DW플러스 - 그린'];
    const PO_LEAD_TIMES = { '킥프레임': 30, 'PH - 실버': 50, 'PH - 블랙': 50, 'DW프로 - 실버': 50, 'DW프로 - 블랙': 50, 'DW플러스 - 실버': 50, 'DW플러스 - 블랙': 50, 'DW플러스 - 그린': 50 };
    const PO_SALES_COL_MAP = { '킥프레임': 4, 'PH - 실버': 12, 'PH - 블랙': 16, 'DW프로 - 실버': 20, 'DW프로 - 블랙': 24, 'DW플러스 - 실버': 28, 'DW플러스 - 블랙': 32, 'DW플러스 - 그린': 36 };

    const poState = {
      loading: false, loaded: false, error: '',
      data: [], month: null, subTab: 'sim',
      stockItems: [], stockError: '', stockUpdatedAt: '',
      stockDetailOpen: false
    };

    function poParseRow(row) {
      if (!row.date || !row.type || !row.product) return null;
      const parts = String(row.date).split('/');
      if (parts.length < 2) return null;
      const month = parseInt(parts[0]), day = parseInt(parts[1]);
      if (isNaN(month) || isNaN(day)) return null;
      const type = String(row.type).trim();
      if (!['신', '추', '요', '기'].includes(type)) return null;
      return {
        month, day, type,
        product: String(row.product).trim(),
        qty: row.qty ? parseInt(row.qty) : null,
        amount: row.amount ? parseInt(String(row.amount).replace(/[₩,]/g, '')) : null,
        note: row.note || '',
        memo: row.memo || ''
      };
    }

    function poGetSupplier(product) { return product.includes('PH') ? '리디안' : '타이루'; }

    function poDefaultMonth() {
      const today = new Date();
      const y = today.getFullYear(), m = today.getMonth() + 1;
      const hit = PO_MONTHS.find(x => x.year === y && x.m === m);
      if (hit) return hit.m;
      const first = PO_MONTHS[0], last = PO_MONTHS[PO_MONTHS.length - 1];
      if (y < first.year || (y === first.year && m < first.m)) return first.m;
      return last.m;
    }

    async function poLoadTimeline() {
      const url = `https://docs.google.com/spreadsheets/d/${PO_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('타임라인')}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`응답 오류 ${res.status}`);
      const rows = parseCSV(await res.text());
      if (rows.length < 2) throw new Error('데이터가 없습니다.');
      const header = rows[0].map(h => String(h).trim().toLowerCase());
      const data = rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, i) => { obj[h] = r[i] || ''; });
        return {
          date: obj['날짜'] || obj['date'] || '',
          type: obj['유형'] || obj['type'] || '',
          product: obj['제품명'] || obj['product'] || '',
          qty: obj['수량'] || obj['qty'] || '',
          amount: obj['금액'] || obj['amount'] || '',
          note: obj['비고'] || obj['note'] || '',
          memo: obj['협의사항'] || obj['memo'] || ''
        };
      });
      const parsed = data.map(poParseRow).filter(Boolean);
      if (!parsed.length) throw new Error('파싱 가능한 데이터가 없습니다.');
      return parsed;
    }

    function poParseKoreanDate(str) {
      if (!str || str === '재입고 예정 없음' || str === '-' || str === '품절') return null;
      let m = str.match(/(\d+)년\s*(\d+)월\s*(\d+)일/);
      if (m) return new Date(2000 + parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
      m = str.match(/(\d+)월\s*(\d+)일/);
      if (m) return new Date(2026, parseInt(m[1]) - 1, parseInt(m[2]));
      return null;
    }

    function poIsDiscontinued(item) { return /단종\s*\/\s*리뉴얼\s*예정/.test(String(item.restockAt || '').trim()); }

    function poGetStockStatus(item) {
      if (item.preorderStartAt && poParseKoreanDate(item.preorderStartAt)) return 'preorder';
      if (item.soldOutAt === '품절') return 'soldOut';
      const dl = parseInt(String(item.daysLeft || '').replace(/[^\d]/g, ''));
      if (!isNaN(dl) && dl === 0) return 'soldOut';
      if (poIsDiscontinued(item)) return 'ok';
      const leadTime = PO_LEAD_TIMES[item.name] || 50;
      const daysLeftNum = isNaN(dl) ? 9999 : dl;
      const restockDate = poParseKoreanDate(item.restockAt);
      const soldOutDate = poParseKoreanDate(item.soldOutAt);
      if (!restockDate) return daysLeftNum > leadTime + 14 ? 'ok' : 'out';
      if (!soldOutDate) return 'ok';
      const diffDays = Math.round((soldOutDate - restockDate) / 86400000);
      return diffDays >= 0 ? 'ok' : 'out';
    }

    function poDaysLeftText(item) {
      if (item.soldOutAt === '품절') return { text: '—', color: 'var(--muted)' };
      const dl = String(item.daysLeft || '').trim();
      if (!dl) return { text: '—', color: 'var(--muted)' };
      const num = parseInt(dl.replace(/[^\d]/g, ''));
      if (isNaN(num)) return { text: dl, color: 'var(--muted)' };
      const color = num <= 3 ? 'var(--red)' : num <= 14 ? 'var(--yellow)' : 'var(--green)';
      return { text: `${num}일`, color };
    }

    function poOrderDeadline(item) {
      if (poGetStockStatus(item) !== 'ok') return null;
      if (poIsDiscontinued(item)) return null;
      if (poParseKoreanDate(item.restockAt)) return null;
      const dl = parseInt(String(item.daysLeft || '').replace(/[^\d]/g, ''));
      if (isNaN(dl)) return null;
      const leadTime = PO_LEAD_TIMES[item.name] || 50;
      const d = new Date();
      d.setDate(d.getDate() + (dl - leadTime));
      return `${d.getMonth() + 1}월 ${d.getDate()}일까지 발주 필요`;
    }

    function poCalcPreorder(item) {
      const startDate = poParseKoreanDate(item.preorderStartAt);
      if (!startDate) return null;
      const restockDate = poParseKoreanDate(item.restockAt);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const elapsedDays = Math.max(1, Math.round((today - startDate) / 86400000));
      const inboundQty = parseInt(String(item.restockQty || '').replace(/[^0-9,]/g, '').replace(/,/g, '')) || 0;
      const soldQty = parseInt(String(item.preorderSoldQty || '').replace(/[^0-9,]/g, '').replace(/,/g, '')) || null;
      if (!soldQty) return { soldQty: null, remaining: null, projectedTotal: null, elapsedDays, inboundQty };
      const dailyAvg = soldQty / elapsedDays;
      const daysToRestock = restockDate ? Math.max(0, Math.round((restockDate - today) / 86400000)) : 0;
      const projectedTotal = Math.round(soldQty + dailyAvg * daysToRestock);
      return { soldQty, remaining: inboundQty - soldQty, projectedTotal, projectedRemaining: inboundQty - projectedTotal, elapsedDays, dailyAvg: Math.round(dailyAvg), inboundQty };
    }

    async function poLoadSalesData(items) {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${PO_STOCK_SHEET_ID}/gviz/tq?tqx=out:csv&gid=2048532673`;
        const res = await fetch(url);
        if (!res.ok) return;
        const rows = parseCSV(await res.text());
        items.forEach(item => {
          if (!item.preorderStartAt) return;
          const startDate = poParseKoreanDate(item.preorderStartAt);
          if (!startDate) return;
          const colIdx = PO_SALES_COL_MAP[item.name];
          if (colIdx === undefined) return;
          let total = 0;
          rows.forEach(row => {
            const rowDate = poParseKoreanDate(String(row[0] || '').trim());
            if (!rowDate || rowDate < startDate) return;
            const val = parseInt(String(row[colIdx] || '').replace(/[^0-9]/g, ''));
            if (!isNaN(val)) total += val;
          });
          item.preorderSoldQty = total > 0 ? String(total) : '';
        });
      } catch (e) { /* 실패해도 재고 카드는 유지 */ }
    }

    async function poLoadStock() {
      const url = `https://docs.google.com/spreadsheets/d/${PO_STOCK_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=TOP`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = parseCSV(await res.text());
      const headerIdx = rows.findIndex(r => r.some(c => String(c).trim() === '제품명'));
      if (headerIdx === -1) throw new Error('헤더(제품명)를 찾지 못했습니다');
      const header = rows[headerIdx];
      let nameCol = header.findIndex(c => String(c).trim() === '제품명');
      if (nameCol === -1) nameCol = 0;
      const items = [];
      for (let i = headerIdx + 1; i < rows.length && items.length < 8; i++) {
        const row = rows[i];
        const name = String(row[nameCol] || '').trim();
        if (!PO_PRODUCT_ORDER.includes(name)) continue;
        items.push({
          name,
          soldOutAt: (row[nameCol + 1] || '').trim(),
          daysLeft: (row[nameCol + 2] || '').trim(),
          restockAt: (row[nameCol + 3] || '').trim(),
          restockQty: (row[nameCol + 4] || '').trim(),
          preorderStartAt: (row[nameCol + 5] || '').trim(),
          preorderSoldQty: ''
        });
      }
      if (!items.length) throw new Error('제품 데이터 행을 찾지 못했습니다');
      if (items.some(i => i.preorderStartAt && poParseKoreanDate(i.preorderStartAt))) await poLoadSalesData(items);
      return items;
    }

    async function poReload() {
      poState.loading = true;
      poState.error = ''; poState.stockError = '';
      grid(`<article class="card full"><div class="empty">발주 데이터를 불러오는 중입니다.</div></article>`);
      const [timelineResult, stockResult] = await Promise.allSettled([poLoadTimeline(), poLoadStock()]);
      if (timelineResult.status === 'fulfilled') {
        poState.data = timelineResult.value;
        poState.month = poState.month || poDefaultMonth();
      } else {
        poState.error = timelineResult.reason?.message || '발주 타임라인을 불러오지 못했습니다.';
      }
      if (stockResult.status === 'fulfilled') {
        poState.stockItems = stockResult.value;
        const now = new Date();
        poState.stockUpdatedAt = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')} 기준`;
      } else {
        poState.stockError = stockResult.reason?.message || '재고 데이터를 불러오지 못했습니다.';
      }
      poState.loading = false;
      poState.loaded = true;
      if (state.tab === 'reorder') grid(poRender());
    }

    function poToggleDrawer(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const open = el.style.display !== 'none';
      el.style.display = open ? 'none' : 'block';
      const arrow = document.getElementById(id + '-arrow');
      if (arrow) arrow.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
      const label = btn.querySelector('span');
      if (label) label.textContent = open ? '사전예약 자세히 보기' : '접기';
    }

    function poToolbar() {
      return `<article class="card full"><div class="po-toolbar">
        <div class="po-subtabs">
          <button class="${poState.subTab === 'sim' ? 'active-mode' : ''}" onclick="poSetSubTab('sim')">발주 시뮬레이션</button>
          <button class="${poState.subTab === 'overview' ? 'active-mode' : ''}" onclick="poSetSubTab('overview')">전체 현황</button>
        </div>
        <div class="po-status">
          <span class="po-dot ${poState.error ? 'err' : (poState.loaded ? 'ok' : '')}"></span>
          <span>${poState.loading ? '연결 중…' : poState.error ? poState.error : poState.loaded ? `연결됨 · 타임라인 ${fmt(poState.data.length)}건` : '대기 중'}</span>
          <button onclick="poReload()">🔄 새로고침</button>
        </div>
      </div></article>`;
    }

    function renderReorder() {
      if (!poState.loaded && !poState.loading) { poReload(); return; }
      grid(poRender());
    }

    function poRender() {
      const toolbar = poToolbar();
      if (poState.error && !poState.data.length) {
        return toolbar + `<article class="card full"><div class="card-head"><div><div class="card-title">발주 시뮬레이션</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">${poState.error} · 스프레드시트 공유 설정(링크가 있는 모든 사용자에게 공개)을 확인해 주세요.</div></article>`;
      }
      return toolbar + (poState.subTab === 'overview' ? poRenderOverviewTable() : poRenderSimulation());
    }

    function poMetricCard(title, sub, value, caption, tone = 'good') {
      const cls = tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : '';
      return `<article class="card kpi po-kpi"><div class="card-head"><div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div><span class="badge ${cls}">${tone === 'danger' ? '즉시 확인' : tone === 'warn' ? '관리 필요' : '운영 KPI'}</span></div><div class="kpi-value">${value}</div><div class="kpi-caption">${caption}</div></article>`;
    }

    function poRenderSimulation() {
      const months = PO_MONTHS.map(mo => {
        const rows = poState.data.filter(r => r.month === mo.m);
        return { ...mo, total: rows.reduce((s, r) => s + (r.amount || 0), 0) };
      });
      const total = months.reduce((s, m) => s + m.total, 0);
      const avg = Math.round(total / (PO_MONTHS.length || 1));
      const byType = t => poState.data.filter(r => r.type === t);
      const sum = arr => arr.reduce((s, r) => s + (r.amount || 0), 0);
      const 신 = byType('신'), 추 = byType('추'), 기 = byType('기');

      const kpis = [
        poMetricCard('총 지출 (6~12월)', '신규 발주 + 추가입고 + 기존 잔금', money(total), `월평균 ${money(avg)}`, 'good'),
        poMetricCard('신규 생산 발주', '발주 시점 기준 금액', money(sum(신)), `${fmt(신.length)}건`, 'good'),
        poMetricCard('추가 입고', '생산완료 후 입고 기준', money(sum(추)), `${fmt(추.length)}건`, 'warn'),
        poMetricCard('기존 잔금', '기존 생산물량 잔금', money(sum(기)), `${fmt(기.length)}건`, 'danger')
      ].join('');

      const barData = months.map(m => ({ label: m.label, total: Math.round(m.total / 10000) }));
      const avgBar = Math.round(avg / 10000);
      const barChart = `<article class="card full"><div class="card-head"><div><div class="card-title">월별 지출 금액</div><div class="card-sub">신규 · 추가입고 · 기존 잔금 합계 / 단위: 만원 · 3,500만원 초과 시 빨간색</div></div><span class="badge">AVG ${fmt(avgBar)}만원</span></div>${renderBarChart(barData, 'total', 'label', { dangerThreshold: 3500 })}</article>`;

      return kpis + barChart + poRenderStockSection() + poRenderCalendar() + poRenderSupplierTable();
    }

    function poRenderStockSection() {
      if (poState.stockError && !poState.stockItems.length) {
        return `<article class="card full"><div class="card-head"><div><div class="card-title">주력 제품 재고 현황</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">${poState.stockError}</div></article>`;
      }
      const map = {};
      poState.stockItems.forEach(i => { map[i.name] = i; });
      const groups = { ok: [], out: [], preorder: [], soldOut: [] };
      PO_PRODUCT_ORDER.forEach(name => {
        const item = map[name];
        if (!item) return;
        const status = poGetStockStatus(item);
        groups[status === 'ok' ? 'ok' : status === 'out' ? 'out' : status === 'preorder' ? 'preorder' : 'soldOut'].push(item);
      });

      const badge = (label, cls, count, muted) => {
        if (!count) return '';
        if (muted) return `<span style="display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--ov06);color:var(--muted);border:1px solid var(--ov08);font-size:12px;font-weight:700;">${label} <strong>${count}개</strong></span>`;
        return `<span class="badge ${cls}" style="font-size:12px;">${label} <strong>${count}개</strong></span>`;
      };
      const badges = [
        badge('✔ 정상', '', groups.ok.length),
        badge('✖ 위험', 'danger', groups.out.length),
        badge('★ 사전예약', 'warn', groups.preorder.length),
        badge('◼ 품절', '', groups.soldOut.length, true)
      ].join('');

      const cols = [
        { key: 'ok', title: '정상', items: groups.ok },
        { key: 'out', title: '위험', items: groups.out },
        { key: 'preorder', title: '사전예약', items: groups.preorder },
        { key: 'soldOut', title: '품절', items: groups.soldOut }
      ];
      const detail = poState.stockDetailOpen ? `<div class="po-stock-grid">${cols.map(c => `
        <div class="po-stock-col">
          <div class="po-stock-col-head">${c.title}</div>
          ${c.items.length ? c.items.map(i => poMakeStockCard(i)).join('') : '<div class="empty" style="padding:12px;font-size:12px;">없음</div>'}
        </div>
      `).join('')}</div>` : '';

      return `<article class="card full">
        <div class="card-head"><div><div class="card-title">주력 제품 재고 현황</div><div class="card-sub">재고 TOP 시트 기준 · 사전예약 포함 최대 8개 품목</div></div><span class="badge">${poState.stockUpdatedAt || '실시간'}</span></div>
        <div class="po-stock-summary" onclick="poToggleStockDetail()">
          <div class="po-stock-badges">${badges || '<span class="muted">데이터 없음</span>'}</div>
          <div class="muted" style="font-size:12px;">${poState.stockDetailOpen ? '접기 ▲' : '상세보기 ▼'}</div>
        </div>
        ${detail}
      </article>`;
    }

    function poMakeStockCard(item) {
      const status = poGetStockStatus(item);
      const cls = status === 'ok' ? 'inventory-ok' : status === 'out' ? 'inventory-risk' : status === 'preorder' ? 'inventory-preorder' : 'inventory-soldout';
      const badgeTxt = status === 'ok' ? '정상' : status === 'out' ? '위험' : status === 'preorder' ? '사전예약' : '품절';
      const badgeHtml = status === 'soldOut'
        ? `<span style="padding:2px 8px;border-radius:999px;background:var(--ov06);color:var(--muted);font-size:11px;font-weight:700;">${badgeTxt}</span>`
        : `<span class="badge ${status === 'out' ? 'danger' : status === 'preorder' ? 'warn' : ''}" style="font-size:11px;padding:3px 8px;">${badgeTxt}</span>`;
      const dl = poDaysLeftText(item);
      const restockAt = (item.restockAt || '').trim();
      const restockTxt = (!restockAt || restockAt === '-') ? '재입고 예정 없음' : restockAt;
      const inboundQty = parseInt(String(item.restockQty || '').replace(/[^0-9,]/g, '').replace(/,/g, '')) || 0;
      const orderDeadline = poOrderDeadline(item);
      const drawerId = `po-preorder-${item.name.replace(/[\s\-]/g, '_')}`;
      const pre = status === 'preorder' ? poCalcPreorder(item) : null;

      let drawer = '';
      if (status === 'preorder') {
        const soldQ = pre?.soldQty != null ? fmt(pre.soldQty) + '개' : '—';
        const remainQ = pre?.remaining != null ? (pre.remaining >= 0 ? fmt(pre.remaining) + '개' : `${fmt(Math.abs(pre.remaining))}개 초과`) : '—';
        const projQ = pre?.projectedTotal != null ? fmt(pre.projectedTotal) + '개' : '—';
        const projRemainQ = pre?.projectedRemaining != null ? (pre.projectedRemaining >= 0 ? fmt(pre.projectedRemaining) + '개' : `${fmt(Math.abs(pre.projectedRemaining))}개 초과`) : '—';
        drawer = `<div id="${drawerId}" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--panel-line);">
          <div class="po-stock-row"><span>사전예약 시작일</span><span>${item.preorderStartAt || '—'}</span></div>
          <div class="po-stock-row"><span>누적 판매수량</span><span>${soldQ}</span></div>
          <div class="po-stock-row"><span>현재 잔여수량</span><span>${remainQ}</span></div>
          <div class="po-stock-row"><span>입고시 예상 누적</span><span>${projQ}</span></div>
          <div class="po-stock-row"><span>입고시 예상 잔여</span><span>${projRemainQ}</span></div>
        </div>`;
      }
      const btn = status === 'preorder'
        ? `<button class="po-stock-drawer-btn" onclick="poToggleDrawer('${drawerId}', this)"><span>사전예약 자세히 보기</span> <span id="${drawerId}-arrow" style="display:inline-block;transition:transform .2s;">▼</span></button>${drawer}`
        : '';

      return `<div class="inventory-card ${cls}">
        <div class="inventory-name" style="display:flex;justify-content:space-between;gap:6px;align-items:center;">
          <span>${item.name}</span>${badgeHtml}
        </div>
        <div class="inventory-meta">
          <div>품절 예상일 <strong>${item.soldOutAt || '—'}</strong></div>
          <div>남은 기간 <strong style="color:${dl.color}">${status === 'soldOut' ? '—' : dl.text}</strong></div>
          <div>재입고 일자 <strong>${restockTxt}</strong></div>
          <div>입고 수량 <strong>${inboundQty ? fmt(inboundQty) + '개' : '—'}</strong></div>
          ${orderDeadline ? `<div>발주 시점 <strong style="color:var(--yellow)">${orderDeadline}</strong></div>` : ''}
        </div>
        ${btn}
      </div>`;
    }

    async function poDownloadExcel() {
      const data = poState.data;
      if (!data || !data.length) { alert('데이터가 없습니다. 먼저 데이터를 불러와주세요.'); return; }
      if (!window.XLSX) { alert('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }

      const XLSX = window.XLSX;
      const wb = XLSX.utils.book_new();

      // ── 스타일 정의 ─────────────────────────────
      const border = {
        top:    { style: 'thin', color: { rgb: 'CCCCCC' } },
        bottom: { style: 'thin', color: { rgb: 'CCCCCC' } },
        left:   { style: 'thin', color: { rgb: 'CCCCCC' } },
        right:  { style: 'thin', color: { rgb: 'CCCCCC' } },
      };
      const borderBold = {
        top:    { style: 'medium', color: { rgb: '999999' } },
        bottom: { style: 'medium', color: { rgb: '999999' } },
        left:   { style: 'medium', color: { rgb: '999999' } },
        right:  { style: 'medium', color: { rgb: '999999' } },
      };

      const S = {
        // 제목
        title: { font: { bold: true, sz: 16, color: { rgb: '1A1A2E' } }, fill: { fgColor: { rgb: 'E8F4FD' } }, alignment: { horizontal: 'center', vertical: 'center' }, border },
        // 요일 헤더
        dowHeader: (isSun, isSat) => ({
          font: { bold: true, sz: 11, color: { rgb: isSun ? 'E53E3E' : isSat ? '3182CE' : '2D3748' } },
          fill: { fgColor: { rgb: isSun ? 'FFF5F5' : isSat ? 'EBF8FF' : 'F7FAFC' } },
          alignment: { horizontal: 'center', vertical: 'center' },
          border: borderBold,
        }),
        // 주간합계 헤더
        weekSumHeader: { font: { bold: true, sz: 11, color: { rgb: '2B6CB0' } }, fill: { fgColor: { rgb: 'EBF8FF' } }, alignment: { horizontal: 'center', vertical: 'center' }, border: borderBold },
        // 날짜 숫자 셀
        dateNum: (isSun, isSat, isToday) => ({
          font: { bold: true, sz: 12, color: { rgb: isToday ? 'FFFFFF' : isSun ? 'E53E3E' : isSat ? '3182CE' : '2D3748' } },
          fill: { fgColor: { rgb: isToday ? '4299E1' : isSun ? 'FFF5F5' : isSat ? 'EBF8FF' : 'FFFFFF' } },
          alignment: { horizontal: 'left', vertical: 'top', indent: 1 },
          border,
        }),
        // 빈 날짜 셀
        emptyCell: { fill: { fgColor: { rgb: 'F7FAFC' } }, border },
        // 이벤트 셀 (유형별 배경)
        eventCell: (type) => {
          const bg = { '신': 'EBF8FF', '추': 'FFFFF0', '요': 'F0FFF4', '기': 'FFF5F5' }[type] || 'FAFAFA';
          const fc = { '신': '2B6CB0', '추': '744210', '요': '276749', '기': '9B2C2C' }[type] || '333333';
          return {
            font: { sz: 9, color: { rgb: fc } },
            fill: { fgColor: { rgb: bg } },
            alignment: { horizontal: 'left', vertical: 'top', wrapText: true },
            border,
          };
        },
        // 주간합계 셀
        weekSum: { font: { bold: true, sz: 10, color: { rgb: '2B6CB0' } }, fill: { fgColor: { rgb: 'EBF8FF' } }, alignment: { horizontal: 'right', vertical: 'center', indent: 1 }, border },
        weekSumEmpty: { fill: { fgColor: { rgb: 'EBF8FF' } }, border },
        // 월합산
        monthTotal: { font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '2B6CB0' } }, alignment: { horizontal: 'right', vertical: 'center', indent: 1 }, border: borderBold },
        monthTotalLabel: { font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '2B6CB0' } }, alignment: { horizontal: 'left', vertical: 'center', indent: 1 }, border: borderBold },
        // 빈 행 구분
        separator: { fill: { fgColor: { rgb: 'EDF2F7' } }, border },
      };

      // 셀 쓰기 헬퍼
      function setCell(ws, r, c, value, style) {
        const addr = XLSX.utils.encode_cell({ r, c });
        ws[addr] = { v: value ?? '', t: typeof value === 'number' ? 'n' : 's', s: style };
      }

      const DOW_KR   = ['일', '월', '화', '수', '목', '금', '토'];
      const TYPE_LBL = PO_TYPE_LABEL;
      const today    = new Date();

      PO_MONTHS.forEach(moInfo => {
        const monthData = data.filter(r => r.month === moInfo.m);
        const byDay = {};
        monthData.forEach(r => { (byDay[r.day] ||= []).push(r); });

        const firstDow = new Date(moInfo.year, moInfo.m - 1, 1).getDay();
        const days     = moInfo.days;
        const numWeeks = Math.ceil((firstDow + days) / 7);
        const ws       = {};
        const merges   = [];
        let rowIdx     = 0;

        // ── 제목 행 ──
        for (let c = 0; c < 8; c++) setCell(ws, rowIdx, c, c === 0 ? `${moInfo.year}년 ${moInfo.label} 발주 캘린더` : '', S.title);
        merges.push({ s: { r: rowIdx, c: 0 }, e: { r: rowIdx, c: 7 } });
        rowIdx++;

        // ── 요일 헤더 행 ──
        DOW_KR.forEach((d, c) => setCell(ws, rowIdx, c, d, S.dowHeader(c === 0, c === 6)));
        setCell(ws, rowIdx, 7, '주간 합계', S.weekSumHeader);
        rowIdx++;

        // ── 주차별 달력 ──
        for (let week = 0; week < numWeeks; week++) {
          const weekDateRow = rowIdx;
          let weekCost = 0;
          let maxEvents = 0;

          // 날짜 숫자 행
          for (let dow = 0; dow < 7; dow++) {
            const dayNum = week * 7 + dow - firstDow + 1;
            if (dayNum < 1 || dayNum > days) {
              setCell(ws, rowIdx, dow, '', S.emptyCell);
            } else {
              const isToday = moInfo.year === today.getFullYear() && moInfo.m === today.getMonth() + 1 && dayNum === today.getDate();
              setCell(ws, rowIdx, dow, dayNum, S.dateNum(dow === 0, dow === 6, isToday));
              const events = byDay[dayNum] || [];
              maxEvents = Math.max(maxEvents, events.length);
              events.forEach(e => { weekCost += (e.amount || 0); });
            }
          }
          setCell(ws, rowIdx, 7, '', S.weekSumEmpty);
          rowIdx++;

          // 이벤트 행들
          const eventRows = Math.max(maxEvents, 1);
          for (let ei = 0; ei < eventRows; ei++) {
            for (let dow = 0; dow < 7; dow++) {
              const dayNum = week * 7 + dow - firstDow + 1;
              if (dayNum < 1 || dayNum > days) {
                setCell(ws, rowIdx, dow, '', S.emptyCell);
                continue;
              }
              const events = byDay[dayNum] || [];
              const e = events[ei];
              if (!e) {
                setCell(ws, rowIdx, dow, '', { fill: { fgColor: { rgb: 'FFFFFF' } }, border });
                continue;
              }
              let txt = `[${TYPE_LBL[e.type]||e.type}] ${e.product}`;
              if (e.qty)    txt += `\n수량: ${e.qty.toLocaleString()}개`;
              if (e.amount) txt += `\n금액: ${e.amount.toLocaleString()}원`;
              if (e.memo)   txt += `\n※ ${e.memo}`;
              setCell(ws, rowIdx, dow, txt, S.eventCell(e.type));
            }
            // 주간합계: 마지막 이벤트 행에만
            if (ei === eventRows - 1) {
              setCell(ws, rowIdx, 7, weekCost ? `${weekCost.toLocaleString()}원` : '—', S.weekSum);
            } else {
              setCell(ws, rowIdx, 7, '', S.weekSumEmpty);
            }
            rowIdx++;
          }

          // 날짜행 + 이벤트행 세로 병합 (주간합계 열)
          if (eventRows > 1) {
            merges.push({ s: { r: weekDateRow, c: 7 }, e: { r: rowIdx - 1, c: 7 } });
          }

          // 주차 구분선 행
          for (let c = 0; c < 8; c++) setCell(ws, rowIdx, c, '', S.separator);
          rowIdx++;
        }

        // ── 월 합산 행 ──
        const monthTotal = monthData.reduce((s, r) => s + (r.amount || 0), 0);
        setCell(ws, rowIdx, 0, `${moInfo.label} 합산 지출`, S.monthTotalLabel);
        for (let c = 1; c < 7; c++) setCell(ws, rowIdx, c, '', S.monthTotal);
        setCell(ws, rowIdx, 7, monthTotal ? `${monthTotal.toLocaleString()}원` : '—', S.monthTotal);
        merges.push({ s: { r: rowIdx, c: 0 }, e: { r: rowIdx, c: 6 } });
        rowIdx++;

        // 시트 범위 설정
        ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rowIdx - 1, c: 7 } });
        ws['!merges'] = merges;
        ws['!cols'] = [
          { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 },
          { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 16 },
        ];

        // 행 높이
        ws['!rows'] = [];
        for (let r = 0; r < rowIdx; r++) {
          // 날짜 숫자 행: 20pt, 이벤트 행: 50pt, 구분행: 6pt, 제목행: 30pt
          ws['!rows'][r] = { hpt: 18 };
        }
        ws['!rows'][0] = { hpt: 30 }; // 제목
        ws['!rows'][1] = { hpt: 22 }; // 요일 헤더

        XLSX.utils.book_append_sheet(wb, ws, `${moInfo.m}월`);
      });

      const fname = `발주캘린더_2026_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob  = new Blob([wbout], { type: 'application/octet-stream' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function poRenderCalendar() {
      const month = poState.month || poDefaultMonth();
      const moInfo = PO_MONTHS.find(x => x.m === month) || PO_MONTHS[0];
      const monthData = poState.data.filter(r => r.month === moInfo.m);
      const monthTotal = monthData.reduce((s, r) => s + (r.amount || 0), 0);
      const byDay = {};
      monthData.forEach(r => { (byDay[r.day] ||= []).push(r); });

      const firstDow = new Date(moInfo.year, moInfo.m - 1, 1).getDay();
      const days = moInfo.days;

    function poRenderOverviewTable() {
      if (!poState.data.length) {
        return `<article class="card full"><div class="empty">표시할 데이터가 없습니다.</div></article>`;

        const numWeeks = Math.ceil((firstDow + mo.days) / 7);
        let monthTotal = 0;
        const monthRows = [];
        for (let week = 0; week < numWeeks; week++) {
          const startDay = week * 7 - firstDow + 1;
          const endDay = startDay + 6;
          const clampedStart = Math.max(1, startDay);
          const clampedEnd = Math.min(mo.days, endDay);

          const 추 = weekData.filter(r => r.type === '추').reduce((s, r) => s + (r.amount || 0), 0);

          monthTotal += total;
          monthRows.push({ week: week + 1, range: `${clampedStart}일 – ${clampedEnd}일`, 기, 신, 추, total });

        return weekTrs + totalTr;

      return `<article class="card full">

    }

      const c=curCum[currentMonthCount-1]||0,p=prevCum[currentMonthCount-1]||0, delta=p?((c/p-1)*100):null;
      const productRows=products.map(x=>`<tr><td>${safeHtml(x.name)}</td><td class="right"><strong>${fmt(x.qty)}개</strong></td><td class="right">${money(x.amount)}</td><td class="right muted">${fmt(x.count)}건</td></tr>`).join('');
      const clientCards=companies.map(x=>`<div class="b2b-client"><strong>${safeHtml(x.name)}</strong><span>${fmt(x.count)}건 · ${fmt(x.qty)}개 · ${money(x.amount)}</span></div>`).join('');
      const productOptions=['all',...products.map(x=>x.name)];
      let tableRows=yr.filter(r=>state.b2b.productFilter==='all'||r.product===state.b2b.productFilter);
      const key=state.b2b.sortKey, dir=state.b2b.sortDir==='asc'?1:-1;
      tableRows=[...tableRows].sort((a,b)=>{ let av,bv; if(key==='date'){av=a.date;bv=b.date;} else if(key==='qty'){av=a.qty;bv=b.qty;} else if(key==='amount'){av=a.amount;bv=b.amount;} else {av=String(a[key]||'');bv=String(b[key]||'');} return av>bv?dir:av<bv?-dir:0; });
      const recent=tableRows.map(r=>{ const unit=r.qty?r.amount/r.qty:0; const pending=String(r.settlement||'').trim()==='대기중'; return `<tr><td>${dateStr(r.date)}</td><td>${safeHtml(r.company)}</td><td>${safeHtml(r.product)}</td><td>${safeHtml(r.use||'-')}</td><td class="right">${fmt(r.qty)}개</td><td class="right">${money(unit)}</td><td class="right">${money(r.amount)}</td><td>${safeHtml(r.production||'-')}</td><td>${safeHtml(r.delivery||'-')}</td><td class="${pending?'settlement-pending':''}">${safeHtml(r.settlement||'-')}</td></tr>`; }).join('');
      const sortArrow=k=>state.b2b.sortKey===k?(state.b2b.sortDir==='asc'?'▲':'▼'):'↕';
      let modal=''; if(state.b2b.modal==='qty') modal=b2bDonutModal(yr,y); else if(state.b2b.modal==='clients') modal=b2bClientsModal(all); else if(state.b2b.modal==='trend') modal=b2bCompareModal(all);
      grid(`
        <article class="card full"><div class="card-head"><div><div class="card-title">B2B 연도</div><div class="card-sub">고객사 컨펌현황 = 확정 기준</div></div><div class="b2b-year-tabs">${[2026,2025,...years].filter((v,i,a)=>a.indexOf(v)===i).filter(v=>v===2025||v===2026).map(v=>`<button class="b2b-year-tab ${v===y?'active':''}" onclick="b2bSetYear(${v})">${String(v).slice(2)}년</button>`).join('')}</div></div></article>
        ${renderSummaryKpiCard({title:`${y} B2B 매출`,sub:'확정 프로젝트 견적금액',value:money(totalAmount),caption:y===2026?`${cutoffLabel} · ${b2bChangeText(totalAmount,prevSameAmount)}`:cutoffLabel,badge:`${String(y).slice(2)}년`,extraClass:'b2b-kpi'})}
        ${renderSummaryKpiCard({title:`${y} B2B 수량`,sub:'확정 프로젝트 수량 합계',value:fmt(totalQty),unit:'개',caption:y===2026?`${cutoffLabel} · ${b2bQtyChangeText(totalQty,prevSameQty)}`:`${cutoffLabel} · 제품 ${fmt(products.length)}종`,badge:`${String(y).slice(2)}년`,extraClass:'b2b-kpi',onclick:"b2bOpenModal('qty')"})}
        ${renderSummaryKpiCard({title:`${y} 고객사`,sub:'확정 프로젝트 기업 수',value:fmt(clients.size),unit:'개사',caption:`확정 ${fmt(yr.length)}건 · 진행중 ${fmt(yr.filter(r=>r.delivery!=='납품완료').length)}건`,badge:'확정만',extraClass:'b2b-kpi',onclick:"b2bOpenModal('clients')"})}
        <article class="card full b2b-trend-card" onclick="b2bOpenModal('trend')" role="button" tabindex="0"><div class="card-head"><div><div class="card-title">전년도 동월 대비 누적 B2B 매출</div><div class="card-sub">${y===2025?'2025년 월별 누적 견적금액(VAT 포함)':`월별 누적 견적금액(VAT 포함) · ${y} vs ${y-1}`}</div></div><span class="badge ${delta!==null&&delta<0?'danger':''}">${y===2025?'2025 누적':delta===null?'비교 기준 없음':`${delta>=0?'+':''}${delta.toFixed(1)}%`}</span></div>${b2bLineChart(curCum,prevCum,y,currentMonthCount)}</article>
        <article class="card half"><div class="card-head"><div><div class="card-title">제품별 누적 B2B</div><div class="card-sub">${y} 확정 기준 · 수량과 매출</div></div></div><div class="table-wrap"><table><thead><tr><th>제품명</th><th class="right">누적 수량</th><th class="right">누적 매출</th><th class="right">건수</th></tr></thead><tbody>${productRows||'<tr><td colspan="4" class="empty">데이터 없음</td></tr>'}</tbody></table></div></article>
        <article class="card half"><div class="card-head"><div><div class="card-title">기업 리스트</div><div class="card-sub">${y} 확정 고객사 · 매출 순</div></div></div><div class="b2b-client-grid">${clientCards||'<div class="empty">데이터 없음</div>'}</div></article>
        <article class="card full"><div class="card-head"><div><div class="card-title">최근 확정 B2B 프로젝트</div><div class="card-sub">제작·납품·정산 진행상태 · 견적금액/수량 기준 VAT 포함 개당 공급단가</div></div></div><div class="b2b-filterbar"><select onchange="b2bSetProductFilter(this.value)">${productOptions.map(v=>`<option value="${safeHtml(v)}" ${state.b2b.productFilter===v?'selected':''}>${v==='all'?'전체 제품':safeHtml(v)}</option>`).join('')}</select><button class="b2b-sort-btn" onclick="b2bSetSort('date')">일자 ${sortArrow('date')}</button><button class="b2b-sort-btn" onclick="b2bSetSort('qty')">수량 ${sortArrow('qty')}</button><button class="b2b-sort-btn" onclick="b2bSetSort('amount')">견적금액 ${sortArrow('amount')}</button></div><div class="table-wrap"><table class="b2b-project-table"><thead><tr><th>일자</th><th>기업명</th><th>제품명</th><th>활용방안</th><th class="right">수량</th><th class="right">개당 공급단가</th><th class="right">견적금액</th><th>제작</th><th>납품</th><th>정산</th></tr></thead><tbody>${recent||'<tr><td colspan="10" class="empty">데이터 없음</td></tr>'}</tbody></table></div></article>${modal}`);
    }

    function renderCurrentTab() {
      // 좌측 통합 사이드바(nav.js)가 이 페이지 밖에서 관리되므로, 현재 탭을
      // location.hash에 반영해 새로고침/공유 링크/사이드바 활성 표시가 맞도록 한다.
      try { history.replaceState(null, '', '#' + state.tab); } catch (e) { location.hash = state.tab; }
      ensureInspectionNavItem();
      syncOperationNavActive();
      const [title, desc] = titles[state.tab];
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageDesc').textContent = desc;
      if (!state.loaded) return;
      if (state.tab === 'overview') renderOverview();
      else if (state.tab === 'shipping') renderShipping();
      else if (state.tab === 'coupang') renderCoupang();
      else if (state.tab === 'production') renderProduction();
      else if (state.tab === 'inspection') renderInspection();
      else if (state.tab === 'payment') renderPayment();
      else if (state.tab === 'inbound') renderInbound();
      else if (state.tab === 'inboundManage') renderInboundManage();
      else if (state.tab === 'inventory') renderInventory();
      else if (state.tab === 'reorder') renderReorder();
      else if (state.tab === 'b2b') renderB2B();
      else renderGeneric(state.tab);
    }

    async function refreshDashboard() {
      const errorEl = document.getElementById('loadError');
      errorEl.textContent = '';
      grid(`<article class="card full"><div class="empty">구글시트 데이터를 불러오는 중입니다.</div></article>`);
      try {
        const entries = await Promise.allSettled(Object.entries(SHEETS).map(async ([key, sheet]) => [key, await loadSheet(sheet)]));
        entries.forEach(result => { if (result.status === 'fulfilled') state.raw[result.value[0]] = result.value[1]; });
        if (!state.raw.shipping) throw new Error('택배_일별 시트를 불러오지 못했습니다. 공유 권한 또는 웹 게시 설정을 확인해 주세요.');
        state.shipping = getShippingData(state.raw.shipping);
        state.filteredShipping = filterByPeriod(state.shipping);
        state.loaded = true;
        document.getElementById('lastSync').textContent = `동기화 ${new Date().toLocaleString('ko-KR')}`;
        renderCurrentTab();
      } catch (err) {
        errorEl.textContent = err.message || '데이터 로드 중 오류가 발생했습니다.';
        grid(`<article class="card full"><div class="empty">데이터를 불러오지 못했습니다.</div></article>`);
      }
    }

    // 좌측 통합 사이드바(nav.js)의 Operation 항목 클릭을 페이지 새로고침 없이 받는 훅.
    // nav.js가 이 페이지 위에서 Operation 하위 탭을 클릭하면 이 함수를 호출한다.
    window.__fbOperationSetTab = function (tab) {
      if (!titles[tab]) return;
      state.tab = tab;
      renderCurrentTab();
    };

    function ensureInspectionNavItem() {
      if (document.querySelector?.('a.fb-item[data-dept="operation"][data-item="inspection"]')) { ensureB2BNavItem(); return; }
      const productionLink = document.querySelector?.('a.fb-item[data-dept="operation"][data-item="production"]');
      if (!productionLink || !document.createElement) return;
      const link = document.createElement('a');
      link.className = 'fb-item';
      link.dataset.dept = 'operation';
      link.dataset.item = 'inspection';
      link.setAttribute('href', '#inspection');
      link.innerHTML = '<span class="fb-item-dot"></span><span>생산 입고·검수</span>';
      productionLink.after(link);
      ensureB2BNavItem();
    }

    function ensureB2BNavItem() {
      if (document.querySelector?.('a.fb-item[data-dept="operation"][data-item="b2b"]')) return;
      const reorderLink = document.querySelector?.('a.fb-item[data-dept="operation"][data-item="reorder"]');
      if (!reorderLink || !document.createElement) return;
      const link = document.createElement('a');
      link.className = 'fb-item';
      link.dataset.dept = 'operation';
      link.dataset.item = 'b2b';
      link.setAttribute('href', '#b2b');
      link.innerHTML = '<span class="fb-item-dot"></span><span>B2B</span>';
      reorderLink.after(link);
    }

    function syncOperationNavActive() {
      document.querySelectorAll?.('a.fb-item[data-dept="operation"][data-item]').forEach(link => {
        link.classList.toggle('active', link.dataset.item === state.tab);
      });
    }

    // 로컬 HTML 미리보기에서도 Operation 메뉴가 배포 사이트로 이동하지 않도록
    // 공통 사이드바의 절대주소를 현재 파일 내부 해시 링크로 바꿉니다.
    function keepOperationLinksLocal(root = document) {
      ensureInspectionNavItem();
      root.querySelectorAll?.('a.fb-item[data-dept="operation"][data-item]').forEach(link => {
        const tab = link.dataset.item;
        if (!titles[tab]) return;
        link.setAttribute('href', `#${tab}`);
        link.removeAttribute('target');
      });
      syncOperationNavActive();
    }

    document.addEventListener('click', event => {
      const link = event.target.closest?.('a.fb-item[data-dept="operation"][data-item]');
      const tab = link?.dataset?.item;
      if (!tab || !titles[tab]) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      keepOperationLinksLocal();
      if ((location.hash || '').replace('#', '') === tab) {
        window.__fbOperationSetTab(tab);
      } else {
        location.hash = tab;
      }
    }, true);

    const operationLinkObserver = new MutationObserver(() => keepOperationLinksLocal());
    operationLinkObserver.observe(document.body, { childList: true, subtree: true });
    keepOperationLinksLocal();

    window.addEventListener('hashchange', () => {
      const hashTab = (location.hash || '').replace('#', '');
      if (hashTab && titles[hashTab]) window.__fbOperationSetTab(hashTab);
    });

    // 다른 대시보드에서 '#reorder' 같은 해시를 달고 넘어온 경우, 처음부터 해당 탭으로 연다.
    (function applyInitialHashTab() {
      const hashTab = (location.hash || '').replace('#', '');
      if (hashTab && titles[hashTab]) state.tab = hashTab;
    })();

    document.getElementById('periodSelect').addEventListener('change', () => {
      const isCustom = document.getElementById('periodSelect').value === 'custom';
      document.getElementById('customDateBox').classList.toggle('show', isCustom);
      if (!state.shipping.length) return;
      if (!isCustom) applyPeriodAndRender();
    });

    document.getElementById('startDateInput').addEventListener('change', applyPeriodAndRender);
    document.getElementById('endDateInput').addEventListener('change', applyPeriodAndRender);

    refreshDashboard();
  </script>
</body>
</html>
