<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRAMEBY 주간 운영 대시보드</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-line: rgba(255,255,255,.08);
      --text: #eef3ff;
      --text2: #dce5ff;
      --muted: #8f9bb7;
      --blue: #5b7cfa;
      --cyan: #22d3ee;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #fb7185;
      --radius: 22px;
      --modal-bg: #10172a;
      --bar-top: #65e4ff;
      --scheme: dark;
      --ov02: rgba(255,255,255,.02);
      --ov025: rgba(255,255,255,.025);
      --ov03: rgba(255,255,255,.03);
      --ov035: rgba(255,255,255,.035);
      --ov04: rgba(255,255,255,.04);
      --ov045: rgba(255,255,255,.045);
      --ov05: rgba(255,255,255,.05);
      --ov055: rgba(255,255,255,.055);
      --ov06: rgba(255,255,255,.06);
      --ov07: rgba(255,255,255,.07);
      --ov08: rgba(255,255,255,.08);
      --ov12: rgba(255,255,255,.12);
    }

    html[data-theme="light"] {
      --bg: #eef1f8;
      --panel: #ffffff;
      --panel-line: rgba(15,23,42,.12);
      --text: #10162a;
      --text2: #1f2a44;
      --muted: #667089;
      --blue: #3357d6;
      --cyan: #0891b2;
      --green: #15803d;
      --yellow: #a15c00;
      --red: #c02b3c;
      --modal-bg: #ffffff;
      --bar-top: #0ea5c0;
      --scheme: light;
      --ov02: rgba(15,23,42,.025);
      --ov025: rgba(15,23,42,.03);
      --ov03: rgba(15,23,42,.035);
      --ov035: rgba(15,23,42,.04);
      --ov04: rgba(15,23,42,.045);
      --ov045: rgba(15,23,42,.05);
      --ov05: rgba(15,23,42,.055);
      --ov055: rgba(15,23,42,.06);
      --ov06: rgba(15,23,42,.07);
      --ov07: rgba(15,23,42,.08);
      --ov08: rgba(15,23,42,.10);
      --ov12: rgba(15,23,42,.16);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); overflow-x: hidden; transition: background .2s ease; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background .2s ease, color .2s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 0%, rgba(91,124,250,.16), transparent 30%),
        radial-gradient(circle at 85% 5%, rgba(34,211,238,.10), transparent 25%),
        linear-gradient(180deg, var(--bg), var(--bg));
    }

    .app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; position: relative; z-index: 1; overflow-x: hidden; }
    .sidebar { padding: 28px 20px; border-right: 1px solid var(--panel-line); background: rgba(9,14,28,.84); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: grid; place-items: center; font-weight: 900; }
    .brand strong { display:block; font-size: 18px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .nav-title { font-size: 11px; color: var(--muted); letter-spacing: .12em; margin: 22px 12px 10px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; color: var(--text2); border-radius: 15px; margin-bottom: 8px; font-size: 14px; cursor: pointer; transition: .18s; }
    .nav-item:hover { background: var(--ov05); }
    .nav-item.active { background: linear-gradient(135deg, rgba(91,124,250,.24), rgba(34,211,238,.12)); border: 1px solid rgba(91,124,250,.42); color: #fff; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .active .dot { background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }

    main { padding: 28px; min-width: 0; overflow-x: hidden; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
    .title h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.04em; }
    .title p { margin: 0; color: var(--muted); font-size: 14px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .dashboard-actions { flex: 0 0 100%; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .pill, select, button, input[type="date"] { border: 1px solid var(--panel-line); background: var(--ov05); color: var(--text2); padding: 10px 14px; border-radius: 999px; font-size: 13px; }
    select, input[type="date"] { outline: none; color-scheme: var(--scheme); }
    .custom-date { display: none; gap: 8px; align-items: center; }
    .custom-date.show { display: flex; }
    button { cursor: pointer; background: linear-gradient(135deg, rgba(91,124,250,.55), rgba(34,211,238,.28)); }
    button.active-mode { background: linear-gradient(135deg, rgba(34,211,238,.45), rgba(52,211,153,.25)); border-color: rgba(52,211,153,.45); color: #fff; font-weight: 800; }

    .icon-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; font-size: 13px; background: var(--ov05); border: 1px solid var(--panel-line); color: var(--text2); flex-shrink: 0; white-space: nowrap; }
    .icon-btn:hover { background: var(--ov08); }
    .sheet-link { position: relative; flex-shrink: 0; }
    .sheet-menu-arrow { display: inline-block; font-size: 10px; transition: transform .18s ease; }
    .sheet-menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 280px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 6px; box-shadow: 0 20px 45px rgba(0,0,0,.35); z-index: 200; display: flex; flex-direction: column; gap: 2px; }
    .sheet-menu a { display: block; padding: 10px 12px; border-radius: 9px; color: var(--text2); font-size: 13px; text-decoration: none; white-space: nowrap; }
    .sheet-menu a:hover { background: var(--ov08); color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
    .card { background: linear-gradient(180deg, var(--ov055), var(--ov025)); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.22); position: relative; overflow: hidden; min-width: 0; }
    .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, var(--ov08), transparent 28%); pointer-events: none; }
    .kpi { grid-column: span 3; min-height: 146px; }
    .kpi.double { grid-column: span 6; }
    .kpi.third-kpi { grid-column: span 4; }
    .wide { grid-column: span 8; min-height: 370px; }
    .side { grid-column: span 4; min-height: 370px; }
    .half { grid-column: span 6; min-height: 300px; }
    .third { grid-column: span 4; min-height: 280px; }
    .full { grid-column: span 12; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; z-index: 1; }
    .card-title { font-size: 14px; color: var(--text2); font-weight: 700; }
    .card-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .badge { font-size: 12px; padding: 7px 10px; border-radius: 999px; background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.24); white-space: nowrap; }
    .badge.warn { background: rgba(251,191,36,.12); color: var(--yellow); border-color: rgba(251,191,36,.24); }
    .badge.danger { background: rgba(251,113,133,.12); color: var(--red); border-color: rgba(251,113,133,.24); }
    .kpi-value { font-size: 34px; font-weight: 900; letter-spacing: -0.05em; margin: 10px 0 8px; position: relative; z-index: 1; }
    .kpi-caption { color: var(--muted); font-size: 13px; position: relative; z-index: 1; }
    .spark { display: flex; align-items: end; gap: 5px; height: 42px; margin-top: 18px; position: relative; z-index: 1; }
    .bar { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--cyan), var(--blue)); opacity: .8; min-height: 2px; }

    .chart-area { display: grid; grid-template-columns: 46px repeat(7, 1fr); grid-template-rows: repeat(5, 42px) 38px; gap: 0 10px; position: relative; z-index: 1; margin-top: 22px; }
    .y-label { color: var(--muted); font-size: 11px; text-align: right; padding-right: 8px; }
    .grid-line { border-top: 1px dashed var(--ov08); grid-column: 2 / -1; }
    .vbar-wrap { grid-row: 1 / 6; align-self: end; display: flex; align-items: end; height: 210px; background: var(--ov03); border-radius: 14px; overflow: hidden; }
    .vbar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, var(--bar-top), var(--blue)); min-height: 3px; }
    .x-label { color: var(--muted); font-size: 11px; text-align: center; align-self: center; line-height: 1.35; }

    .simple-bar-scroll { position: relative; z-index: 1; width: 100%; overflow-x: auto; padding-bottom: 4px; }
    .simple-bar-scroll::-webkit-scrollbar { height: 8px; }
    .simple-bar-scroll::-webkit-scrollbar-thumb { background: var(--ov12); border-radius: 999px; }
    .simple-bar-chart { position: relative; display: flex; align-items: end; gap: 14px; height: 280px; padding: 18px 0 58px; border-bottom: 1px dashed var(--ov08); min-width: 100%; }
    .simple-bar-chart.many { gap: 10px; min-width: max-content; }
    .simple-bar-col { flex: 1; min-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 8px; position: relative; }
    .simple-bar-chart.many .simple-bar-col { flex: 0 0 58px; min-width: 58px; }
    .simple-bar-wrap { width: 100%; height: 210px; display: flex; align-items: end; background: var(--ov03); border-radius: 14px; overflow: hidden; }
    .simple-bar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, var(--bar-top), var(--blue)); min-height: 4px; }
    .simple-bar.danger-threshold { background: linear-gradient(180deg, #fb7185, #dc2626); box-shadow: 0 8px 24px rgba(220,38,38,.24); }
    .simple-bar-wrap.has-issue { border: 1px solid rgba(251,191,36,.38); box-shadow: inset 0 0 0 1px rgba(251,191,36,.12); }
    .issue-marker { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(251,191,36,.18); color: var(--yellow); border: 1px solid rgba(251,191,36,.42); font-weight: 900; font-size: 12px; z-index: 2; }
    .simple-bar-issue { color: var(--yellow); font-size: 11px; font-weight: 800; margin-top: -4px; }
    .simple-bar-label { position: absolute; bottom: -46px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .simple-bar-value { color: var(--text2); font-size: 12px; font-weight: 800; }
    .period-compare { position: relative; z-index: 1; display: grid; gap: 16px; margin-top: 18px; }
    .period-compare-legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .period-compare-dot { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 6px; vertical-align: -1px; }
    .period-compare-dot.current { background: var(--cyan); }
    .period-compare-dot.previous { background: var(--yellow); }
    .period-compare-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 190px; gap: 14px; align-items: center; }
    .period-compare-label { color: var(--text2); font-size: 13px; font-weight: 800; }
    .period-compare-bars { display: grid; gap: 7px; min-width: 0; }
    .period-compare-track { height: 18px; border-radius: 999px; background: var(--ov06); overflow: hidden; }
    .period-compare-bar { height: 100%; border-radius: inherit; }
    .period-compare-bar.current { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .period-compare-bar.previous { background: linear-gradient(90deg, rgba(251,191,36,.48), rgba(251,191,36,.9)); }
    .period-compare-value { color: var(--text); font-size: 13px; font-weight: 900; text-align: right; }
    .period-compare-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .period-compare-delta { font-size: 11px; margin-top: 4px; font-weight: 800; }
    .period-compare-delta.good { color: var(--green); }
    .period-compare-delta.warn { color: var(--yellow); }
    .period-compare-delta.neutral { color: var(--muted); }

    .period-vertical { position: relative; z-index: 1; margin-top: 18px; }
    .period-vertical-legend { display:flex; align-items:center; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:18px; }
    .period-vertical-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:22px; }
    .period-vertical-facet { min-width:0; }
    .period-vertical-title { text-align:center; color:var(--text2); font-size:13px; font-weight:800; }
    .period-vertical-delta { min-height:32px; margin:5px 0 10px; text-align:center; font-size:11px; font-weight:800; line-height:1.35; }
    .period-vertical-delta.good { color:var(--green); }
    .period-vertical-delta.warn { color:var(--yellow); }
    .period-vertical-delta.neutral { color:var(--muted); }
    .period-vertical-plot { height:230px; display:grid; grid-template-columns:repeat(2,minmax(46px,74px)); justify-content:center; align-items:end; gap:14px; border-bottom:1px solid var(--panel-line); background:repeating-linear-gradient(to top, var(--ov055) 0, var(--ov055) 1px, transparent 1px, transparent 25%); }
    .period-vertical-column { height:100%; display:flex; flex-direction:column; justify-content:end; align-items:stretch; gap:7px; }
    .period-vertical-value { text-align:center; color:var(--text); font-size:12px; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .period-vertical-bar { min-height:4px; border-radius:9px 9px 0 0; background:linear-gradient(180deg,var(--cyan),var(--blue)); }
    .period-vertical-bar.previous { background:linear-gradient(180deg,rgba(251,191,36,.9),rgba(251,191,36,.48)); }
    .period-vertical-axis { display:grid; grid-template-columns:repeat(2,minmax(46px,74px)); justify-content:center; gap:14px; margin-top:8px; color:var(--muted); font-size:11px; text-align:center; }
    .period-vertical-context { color:var(--muted); font-size:11px; text-align:center; margin-top:7px; min-height:15px; }

    .issue-list { display: grid; gap: 12px; position: relative; z-index: 1; }
    .issue { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 13px; border-radius: 16px; background: var(--ov04); border: 1px solid var(--ov06); }
    .issue-icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: rgba(91,124,250,.14); }
    .issue strong { display: block; font-size: 14px; margin-bottom: 3px; }
    .issue span { color: var(--muted); font-size: 12px; }
    .issue-num { font-weight: 800; font-size: 18px; }
    .progress-block { position: relative; z-index: 1; display: grid; gap: 16px; }
    .progress-row { display: grid; gap: 8px; }
    .progress-top { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); }
    .track { height: 10px; border-radius: 999px; background: var(--ov08); overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }

    table { width: 100%; border-collapse: collapse; position: relative; z-index: 1; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 12px 10px; border-bottom: 1px solid var(--panel-line); }
    td { padding: 14px 10px; border-bottom: 1px solid var(--ov05); color: var(--text2); }
    .right { text-align: right; }
    .muted { color: var(--muted); }
    .error { color: var(--red); font-size: 13px; margin-top: 8px; }
    .empty { color: var(--muted); padding: 24px 0; position: relative; z-index: 1; }
    .table-wrap { position: relative; z-index: 1; overflow-x: auto; }
    .table-tools { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .tool-left, .tool-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 14px; position: relative; z-index: 1; }
    .page-info { color: var(--muted); font-size: 13px; padding: 0 6px; }
    .rank-chart { display: grid; gap: 12px; position: relative; z-index: 1; }
    .rank-row { display: grid; grid-template-columns: minmax(240px, 1.4fr) 2.4fr 120px 80px; gap: 12px; align-items: center; }
    .rank-name {
      font-size: 13px;
      color: var(--text2);
      line-height: 1.35;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }
    .rank-track { height: 16px; border-radius: 999px; background: var(--ov08); overflow: hidden; }
    .rank-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .rank-value { text-align: right; font-size: 13px; color: var(--text2); font-weight: 700; }
    .rank-qty { text-align: right; font-size: 13px; color: var(--yellow); font-weight: 800; }
    .flow-wrap { position: relative; z-index: 1; margin-top: 20px; }
    .flow-grid {
      position: absolute;
      inset: 0 0 34px 0;
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      pointer-events: none;
    }
    .flow-grid div {
      border-top: 1px dashed var(--ov07);
    }
    .flow-chart {
      height: 360px;
      display: flex;
      align-items: end;
      gap: 16px;
      padding: 18px 0 34px;
      position: relative;
    }
    .flow-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      gap: 10px;
      min-width: 72px;
    }
    .flow-bar-wrap {
      width: 100%;
      height: 280px;
      display: flex;
      align-items: end;
      position: relative;
    }
    .flow-bar {
      width: 100%;
      border-radius: 18px 18px 8px 8px;
      background: linear-gradient(180deg, var(--bar-top) 0%, var(--blue) 100%);
      box-shadow: 0 10px 30px rgba(91,124,250,.28);
      min-height: 6px;
      transition: .2s;
      position: relative;
    }
    .flow-bar:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }
    .flow-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .flow-summary .pill {
      background: var(--ov04);
    }

    .flow-money {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-top: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .flow-qty {
      font-size: 12px;
      font-weight: 800;
      color: var(--yellow);
      margin-top: 2px;
    }

    .flow-label {
      font-size: 13px;
      color: var(--text2);
      margin-top: 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .flow-money.compact {
      font-size: 13px;
      opacity: .95;
    }

    .flow-label.compact {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .inventory-list { display:grid; gap:12px; position:relative; z-index:1; }
    .inventory-group { border:1px solid var(--ov08); border-radius:18px; background:var(--ov035); overflow:hidden; }
    .inventory-group summary { cursor:pointer; padding:16px 18px; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .inventory-group summary::-webkit-details-marker { display:none; }
    .inventory-group-title { font-weight:900; color:var(--text); font-size:15px; }
    .inventory-group-sub { color:var(--muted); font-size:12px; margin-top:4px; }
    .inventory-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; padding:0 16px 16px; }
    .inventory-card { border:1px solid var(--ov07); border-radius:16px; padding:14px; background:var(--ov04); }
    .inventory-name { font-weight:800; color:var(--text); font-size:13px; line-height:1.35; margin-bottom:8px; }
    .inventory-meta { display:grid; gap:6px; color:var(--muted); font-size:12px; }
    .inventory-meta strong { color:var(--text2); }
    .inventory-risk { border-color:rgba(251,113,133,.45); background:rgba(251,113,133,.08); }
    .inventory-warn { border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.07); }
    .inventory-ok { border-color:rgba(52,211,153,.22); }
    .inventory-product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; position:relative; z-index:1; }
    .inventory-product-card { cursor:pointer; border:1px solid var(--ov08); border-radius:20px; padding:16px; background:var(--ov04); transition:.18s; }
    .inventory-product-card:hover { transform:translateY(-2px); border-color:rgba(34,211,238,.35); background:rgba(34,211,238,.06); }
    .inventory-product-title { font-size:16px; font-weight:900; color:var(--text); margin-bottom:10px; line-height:1.35; }
    .inventory-product-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
    .inventory-stat { padding:10px; border-radius:14px; background:var(--ov04); border:1px solid var(--ov06); }

  <script>

    const state = { tab: 'overview', loaded: false, raw: {}, shipping: [], filteredShipping: [], generic: {}, viewMode: { shipping: 'summary', production: 'summary', coupang: 'summary' }, production: { selectedProduct: 'all' }, coupang: { page: 1, pageSize: 30, basis: 'supply', date: '', flowMode: 'daily', selectedMonthDetail: '' }, shippingView: { mode: 'daily', month: '' }, payment: { vendorPeriod: 'monthly', selectedVendor: 'all', startMonth: '', endMonth: '', selectedFlowPeriod: '', overviewDetail: '', poDetail: '', vendorFlowOpen: false }, inventory: { selectedProduct: '', selectedCategory: 'all', riskOpen: false, sortKey: 'qty', sortDir: 'desc', search: '' } };

    const titles = {

      payment: ['결제 관리', '결제 예정 및 완료, PO 관련 금액 흐름을 확인합니다.'],
      inbound: ['입고 예정', '입고 예정 건과 지연 가능 항목을 확인합니다.'],
      inboundManage: ['입고 관리', '실제 입고 처리, 검수, 수량 차이, 상태를 관리합니다.'],
      inventory: ['재고 관리', '재고관리_재고 탭 기준으로 전체 품목 재고, 소진기간, 소진시점, 품절 여부를 확인합니다.'],
      coupang: ['쿠팡 판매', '쿠팡 판매수량, 매출, 출고 흐름을 확인합니다.'],
      reorder: ['발주관리', '발주 시뮬레이션과 주력 제품 재고/발주 캘린더를 확인합니다.']
    };

    // ── 일반모드 / 다크모드 (나머지 대시보드와 동일한 방식: 메모리에만 유지, 기본값 다크) ──
    let currentTheme = 'dark';
    function applyTheme(theme) {
      currentTheme = theme;
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        if (icon) icon.textContent = '☀️';
        if (label) label.textContent = '라이트모드';
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (icon) icon.textContent = '🌙';
        if (label) label.textContent = '다크모드';
      }
    }
    function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

    // ── 연동된 스프레드시트 바로가기 (2개 이상이면 목록을 펼쳐서 선택) ──
    const SHEET_LINKS = [
      { name: '메인 시트 (택배·제작·결제·입고·재고·쿠팡)', url: 'https://docs.google.com/spreadsheets/d/1aAr8wNaNbO8Ts3lQivHxnpBy8aY9IKPB1HokkO7mYq0/edit' },
      { name: '발주관리 · 타임라인', url: 'https://docs.google.com/spreadsheets/d/1p-ko7c4--yUwYOYE2fL8X6Z1U3O1lWoJ36AZuBanGmQ/edit' },
      { name: '발주관리 · 재고 TOP', url: 'https://docs.google.com/spreadsheets/d/1najWl30V40gEHacr6LaNYDIaEgLHGAcxdLDqneW6MxE/edit' },
    ];

    function renderSheetMenu() {
      const menu = document.getElementById('sheetMenu');
      if (!menu) return;
      menu.innerHTML = SHEET_LINKS.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('');
    }

    function setSheetMenuOpen(open) {
      const menu = document.getElementById('sheetMenu');
      const arrow = document.getElementById('sheetMenuArrow');
      if (menu) menu.style.display = open ? 'flex' : 'none';
      if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function onSheetButtonClick(ev) {
      if (SHEET_LINKS.length <= 1) {
        if (SHEET_LINKS.length === 1) window.open(SHEET_LINKS[0].url, '_blank', 'noopener');
        return;
      }
      ev.stopPropagation();
      const menu = document.getElementById('sheetMenu');
      const isOpen = menu && menu.style.display !== 'none';
      setSheetMenuOpen(!isOpen);
    }

    document.addEventListener('click', (ev) => {
      const wrap = document.getElementById('sheetLinkWrap');
      if (!wrap || wrap.contains(ev.target)) return;
      setSheetMenuOpen(false);
    });

    renderSheetMenu();

    function csvUrl(gid) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }
    function csvUrlByName(sheetName) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`; }

    function parseCSV(text) {
      const rows = [];
      let row = [], value = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i], next = text[i + 1];
        if (char === '"' && inQuotes && next === '"') { value += '"'; i++; }
        else if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { row.push(value); value = ''; }
        else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (value || row.length) { row.push(value); rows.push(row); row = []; value = ''; }
          if (char === '\r' && next === '\n') i++;
        } else value += char;
      }
      if (value || row.length) { row.push(value); rows.push(row); }
      return rows.filter(r => r.some(c => String(c).trim() !== ''));
    }

    async function loadSheet(sheet) {
      const urls = typeof sheet === 'object'
        ? [
            ...(sheet.gid && /^[0-9]+$/.test(String(sheet.gid)) ? [csvUrl(sheet.gid)] : []),
            csvUrlByName(sheet.name)
          ]
        : [csvUrl(sheet)];

      let lastError = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`시트 로드 실패: ${res.status}`);
          const rows = parseCSV(await res.text());
          if (rows.length) return rows;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('시트 데이터를 불러오지 못했습니다.');
    }

    function toNum(v) {
      if (v === undefined || v === null || v === '') return 0;
      return Number(String(v).replace(/,/g, '').replace(/[^0-9.-]/g, '')) || 0;
    }

    function toDate(v) {
      if (v === undefined || v === null || v === '') return null;
      const raw = String(v).trim();

      const gvDate = raw.match(/Date[(]([0-9]{4}),[ ]*([0-9]{1,2}),[ ]*([0-9]{1,2})[)]/);
      if (gvDate) {
        return new Date(Number(gvDate[1]), Number(gvDate[2]), Number(gvDate[3]));
      }

      const krDate = raw.match(/([0-9]{4})[ ]*년[ ]*([0-9]{1,2})[ ]*월[ ]*([0-9]{1,2})[ ]*일/);
      if (krDate) {
        return new Date(Number(krDate[1]), Number(krDate[2]) - 1, Number(krDate[3]));
      }

      const normal = raw.split(' ')[0].replaceAll('.', '-').replaceAll('/', '-');
      const direct = normal.match(/^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})$/);
      if (direct) {
        return new Date(Number(direct[1]), Number(direct[2]) - 1, Number(direct[3]));
      }

      if (/^[0-9]+([.][0-9]+)?$/.test(raw)) {
        const serial = Number(raw);
        if (serial > 20000 && serial < 80000) {
          const base = new Date(Date.UTC(1899, 11, 30));
          base.setUTCDate(base.getUTCDate() + Math.floor(serial));
          return new Date(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate());
        }
      }

      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
    function money(n) { return `${fmt(n)}원`; }
    function safeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function usd(n) { return `$${fmt(Math.round(Number(n || 0)))}`; }
    function usdToKrw(n) { return Math.round(Number(n || 0) * 1500); }
    function pct(num, den) { return den ? `${((num / den) * 100).toFixed(2)}%` : '0.00%'; }
    function dateStr(d) {
      if (!d) return '-';
      const date = new Date(d);
      if (Number.isNaN(date.getTime())) return '-';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function todayDate() {
      const d = new Date();
      d.setHours(0,0,0,0);
      return d;
    }

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23,59,59,999);
      return x;
    }

    function endOfMonth(d) {
      return endOfDay(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    }

    function grid(html) { document.getElementById('dashboardGrid').innerHTML = html; }

    function rowsToObjects(rows) {
      const header = rows[0] || [];
      return rows.slice(1).map(r => {
        const obj = Object.fromEntries(header.map((h, i) => [h || `col${i}`, r[i] || '']));
        obj._row = r;
        return obj;
      });
    }

    function getCurrentPeriodRange() {
      const option = document.getElementById('periodSelect').value;
      const allDates = state.shipping.map(r => r.date).filter(Boolean);
      const minDate = allDates.length
        ? new Date(Math.min(...allDates.map(d => d.getTime())))
        : todayDate();
      let start;
      let end = endOfDay(todayDate());

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? endOfDay(new Date(endValue + 'T00:00:00')) : endOfDay(todayDate());
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        const today = todayDate();
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = endOfMonth(today);
      } else {
        start = todayDate();
        start.setDate(start.getDate() - Number(option) + 1);
      }

      return { start, end };
    }

    function filterObjectsByDate(objects, dateKey) {
      if (!dateKey) return objects;
      const { start, end } = getCurrentPeriodRange();
      if (!start || !end) return objects;

      return objects.filter(o => {
        const raw = o[dateKey];
        const d = toDate(raw);

        if (!d) return false;

        const compare = new Date(d);
        compare.setHours(0,0,0,0);

        const startDate = new Date(start);
        startDate.setHours(0,0,0,0);

        const endDate = new Date(end);
        endDate.setHours(23,59,59,999);

        return compare >= startDate && compare <= endDate;
      });
    }

    function getShippingData(rows) {
      const header = rows[0] || [];
      const idx = {
        date: header.indexOf('날짜'),
        ship: header.indexOf('출고수량'),
        missing: header.indexOf('누락건수'),
        misdelivery: header.indexOf('오배송건수')
      };
      return rows.slice(1).map(r => ({
        date: toDate(r[idx.date]),
        dateText: r[idx.date],
        shipments: toNum(r[idx.ship]),
        missing: toNum(r[idx.missing]),
        misdelivery: toNum(r[idx.misdelivery])
      })).filter(r => r.date);
    }

    function getLatestDate(data) {
      const dates = data.map(r => r.date).filter(Boolean);
      return dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : new Date();
    }

    function sameMonthData(data, baseDate, offset = 0) {
      const target = new Date(baseDate.getFullYear(), baseDate.getMonth() + offset, 1);
      return data.filter(r => r.date && r.date.getFullYear() === target.getFullYear() && r.date.getMonth() === target.getMonth());
    }

    function yearData(data, baseDate) {
      return data.filter(r => r.date && r.date.getFullYear() === baseDate.getFullYear());
    }

    function changeRate(current, previous) {
      if (!previous && !current) return '0.0%';
      if (!previous) return '+100.0%';
      const rate = ((current - previous) / previous) * 100;
      return `${rate >= 0 ? '+' : ''}${rate.toFixed(1)}%`;
    }

    function changeTone(current, previous, lowerIsBetter = false) {
      if (current === previous) return 'good';
      const up = current > previous;
      if (lowerIsBetter) return up ? 'warn' : 'good';
      return up ? 'good' : 'warn';
    }

    function filterByPeriod(data) {
      const option = document.getElementById('periodSelect').value;
      const customBox = document.getElementById('customDateBox');
      customBox.classList.toggle('show', option === 'custom');

      const allDates = data.map(r => r.date).filter(Boolean);
      const minDate = allDates.length
        ? new Date(Math.min(...allDates.map(d => d.getTime())))
        : todayDate();
      let start;
      let end = endOfDay(todayDate());

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? endOfDay(new Date(endValue + 'T00:00:00')) : endOfDay(todayDate());
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        const today = todayDate();
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = endOfMonth(today);
      } else {
        start = todayDate();
        start.setDate(start.getDate() - Number(option) + 1);
      }

      const filtered = data.filter(r => {
        if (!r.date) return false;
        const compare = new Date(r.date);
        compare.setHours(0,0,0,0);
        return compare >= start && compare <= end;
      });
      document.getElementById('periodLabel').textContent = `${dateStr(start)} ~ ${dateStr(end)}`;
      return filtered;
    }

    function getPreviousPeriodRange(start, end) {
      const startDate = new Date(start);
      startDate.setHours(0,0,0,0);
      const endDate = new Date(end);
      endDate.setHours(23,59,59,999);
      const days = Math.max(1, Math.floor((endOfDay(endDate) - startDate) / 86400000) + 1);
      const previousEnd = new Date(startDate);
      previousEnd.setDate(previousEnd.getDate() - 1);
      previousEnd.setHours(23,59,59,999);
      const previousStart = new Date(previousEnd);
      previousStart.setDate(previousStart.getDate() - days + 1);
      previousStart.setHours(0,0,0,0);
      return { start: previousStart, end: previousEnd, days };
    }

    function filterShippingByRange(data, range) {
      if (!range || !range.start || !range.end) return [];
      return data.filter(r => {
        if (!r.date) return false;
        const compare = new Date(r.date);
        compare.setHours(0,0,0,0);
        return compare >= range.start && compare <= range.end;
      });
    }
    function applyPeriodAndRender() {
      if (!state.shipping.length) return;
      state.filteredShipping = filterByPeriod(state.shipping);
      state.coupang.date = '';
      state.coupang.page = 1;
      renderCurrentTab();

    function metricCard(title, sub, value, caption, tone = 'good', spark = []) {

      }[type];

                <tbody>${rows.map(r=>`
                  <tr>

    function renderBarChart(data, valueKey, labelKey = 'date', options = {}) {
      const baseItems = options.hideZero ? data.filter(r => Number(r[valueKey] || 0) > 0) : data;
      const items = options.limit ? baseItems.slice(-options.limit) : baseItems;
      const max = Math.max(...items.map(r => Number(r[valueKey] || 0)), 1);

      if (!items.length) return '<div class="empty">차트로 표시할 데이터가 없습니다.</div>';

      return `<div class="simple-bar-scroll"><div class="simple-bar-chart ${items.length > 12 ? 'many' : ''}">${items.map(r => {
        const label = r.date ? `${r.date.getMonth()+1}/${r.date.getDate()}` : String(r[labelKey] || '-').slice(0, 10);
        const value = Number(r[valueKey] || 0);
        const height = value > 0 ? Math.max((value / max) * 100, 2) : 1;
        const issue = Number(r.missing || 0) + Number(r.misdelivery || 0);
        const issueHtml = issue > 0 ? `<div class="issue-marker" title="누락 ${fmt(r.missing || 0)}건 / 오배송 ${fmt(r.misdelivery || 0)}건">!</div>` : '';
        const issueText = issue > 0 ? `<div class="simple-bar-issue">문제 ${fmt(issue)}</div>` : '';
        return `
          <div class="simple-bar-col">
            <div class="simple-bar-wrap ${issue > 0 ? 'has-issue' : ''}">
              ${issueHtml}
              <div class="simple-bar ${Number.isFinite(options.dangerThreshold) && value > options.dangerThreshold ? 'danger-threshold' : ''}" style="height:${height}%"></div>
            </div>
            <div class="simple-bar-value">${fmt(value)}</div>
            ${issueText}
            <div class="simple-bar-label">${label}</div>
          </div>
        `;
      }).join('')}</div></div>`;
    }

    function renderPeriodComparisonChart(items, labels) {
      if (!items.length) return '<div class="empty">비교할 데이터가 없습니다.</div>';
      const formatValue = item => {
        if (item.type === 'rate') return v => `${Number(v || 0).toFixed(2)}%`;
        return v => `${fmt(v)}건`;
      };
      const formatDelta = (item, current, previous) => {
        const diff = current - previous;
        const direction = diff > 0 ? '증가' : diff < 0 ? '감소' : '동일';
        const sign = diff > 0 ? '+' : diff < 0 ? '-' : '';
        const rate = changeRate(current, previous);
        const deltaValue = item.type === 'rate'
          ? `${sign}${Math.abs(diff).toFixed(2)}%p`
          : `${sign}${fmt(Math.abs(Math.round(diff)))}건`;
        const tone = diff === 0 ? 'neutral' : item.lowerIsBetter ? (diff > 0 ? 'warn' : 'good') : (diff > 0 ? 'good' : 'warn');
        return { text: `직전 대비 ${deltaValue} / ${rate} ${direction}`, tone };
      };
      return `
        <div class="period-compare">
          <div class="period-compare-legend">
            <span><i class="period-compare-dot current"></i>${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>${labels.previous}</span>
          </div>
          ${items.map(item => {
            const current = Number(item.current || 0);
            const previous = Number(item.previous || 0);
            const localMax = Math.max(current, previous, 1);
            const currentWidth = current > 0 ? Math.max((current / localMax) * 100, 2) : 0;
            const previousWidth = previous > 0 ? Math.max((previous / localMax) * 100, 2) : 0;
            const display = formatValue(item);
            const delta = formatDelta(item, current, previous);
            return `
              <div class="period-compare-row">
                <div class="period-compare-label">${item.label}</div>
                <div class="period-compare-bars">
                  <div class="period-compare-track" title="${labels.current} ${display(current)}"><div class="period-compare-bar current" style="width:${currentWidth}%"></div></div>
                  <div class="period-compare-track" title="${labels.previous} ${display(previous)}"><div class="period-compare-bar previous" style="width:${previousWidth}%"></div></div>
                </div>
                <div class="period-compare-value">${display(current)}<div class="period-compare-sub">직전 ${display(previous)}</div><div class="period-compare-delta ${delta.tone}">${delta.text}</div></div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderVerticalPeriodComparisonChart(items, labels) {
      if (!items.length) return '<div class="empty">비교할 데이터가 없습니다.</div>';
      const displayValue = (item, value) => item.type === 'rate'
        ? `${Number(value || 0).toFixed(2)}%`
        : `${fmt(value)}${item.unit || '건'}`;
      const deltaInfo = (item, current, previous) => {
        const diff = current - previous;
        if (diff === 0) return { text: '동일 · 변화 없음', tone: 'neutral' };
        const direction = diff > 0 ? '증가' : '감소';
        const amount = item.type === 'rate'
          ? `${Math.abs(diff).toFixed(2)}%p`
          : `${fmt(Math.abs(Math.round(diff)))}${item.unit || '건'}`;
        const rate = previous ? `${Math.abs((diff / previous) * 100).toFixed(1)}%` : '신규';
        const tone = item.lowerIsBetter ? (diff > 0 ? 'warn' : 'good') : (diff > 0 ? 'good' : 'warn');
        return { text: `${amount} ${direction} · ${rate}`, tone };
      };
      return `
        <div class="period-vertical">
          <div class="period-vertical-legend">
            <span><i class="period-compare-dot current"></i>선택기간 · ${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>직전기간 · ${labels.previous}</span>
          </div>
          <div class="period-vertical-grid">
            ${items.map(item => {
              const current = Number(item.current || 0);
              const previous = Number(item.previous || 0);
              const localMax = Math.max(current, previous, 1);
              const maxBarHeight = 180;
              const currentHeight = current > 0 ? Math.max((current / localMax) * maxBarHeight, 4) : 0;
              const previousHeight = previous > 0 ? Math.max((previous / localMax) * maxBarHeight, 4) : 0;
              const delta = deltaInfo(item, current, previous);
              return `
                <div class="period-vertical-facet">
                  <div class="period-vertical-title">${item.label}</div>
                  <div class="period-vertical-delta ${delta.tone}">${delta.text}</div>

    function shippingPeriodKey(date, mode) {
      if (!date) return '-';
      if (mode === 'monthly') return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
      if (mode === 'weekly') {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        const day = d.getDay() || 7;
        d.setDate(d.getDate() + 4 - day);
        const yearStart = new Date(d.getFullYear(),0,1);
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getMonth()+1}월 ${weekNo}주차`;
      }
      return dateStr(date);
    }

    function groupShippingData(data, mode) {
      const map = {};
      data.forEach(r => {
        const key = shippingPeriodKey(r.date, mode);
        if (key === '-') return;
        if (!map[key]) map[key] = { label: key, date: r.date, shipments: 0, missing: 0, misdelivery: 0 };
        map[key].shipments += r.shipments;
        map[key].missing += r.missing;
        map[key].misdelivery += r.misdelivery;
      });
      return Object.values(map).sort((a,b)=>a.date-b.date);
    }

    function setShippingMode(value) {
      state.shippingView.mode = value;
      renderShipping();
    }

    function setShippingMonth(value) {
      state.shippingView.month = value;
      renderShipping();
    }

      if (!state.shippingView.month && availableMonths.length) state.shippingView.month = `${baseDate.getFullYear()}-${String(baseDate.getMonth()+1).padStart(2,'0')}`;
      if (state.shippingView.month) {
        d = ytdShipping.filter(r => `${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,'0')}` === state.shippingView.month);
      }
      const groupedShipping = groupShippingData(d, state.shippingView.mode);
      const thisMonth = sameMonthData(state.shipping, baseDate, 0);
      const prevMonth = sameMonthData(state.shipping, baseDate, -1);

      const sumMissing = arr => arr.reduce((s, r) => s + r.missing, 0);
