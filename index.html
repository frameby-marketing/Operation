    function getPaymentAnalysis() {
      const paymentRows = state.raw.payments || [];
      const poRows = state.raw.po || [];

      const paymentHeaders = paymentRows[0] || [];
      const paymentObjects = rowsToObjects(paymentRows);
      const poObjects = rowsToObjects(poRows);

      const dateKey = findHeader(paymentHeaders, ['결제일','예정일','결제예정일','날짜','일자']);
      const vendorKey = findHeader(paymentHeaders, ['거래처','업체','공급처']);
      const productKey = findHeader(paymentHeaders, ['상품명','품목명','제품명','품목','제품']);
      const typeKey = findHeader(paymentHeaders, ['결제유형','유형','선급금','잔금','구분']);
      const inboundKey = findHeader(paymentHeaders, ['입고일','입고예정일','도착일']);

      const usdKey = findHeader(paymentHeaders, ['USD','외화','달러','송금USD','결제외화','외화금액','외화결제액','결제액']) || paymentHeaders[7];
      const krwKey = findHeader(paymentHeaders, ['원화','KRW','결제원화','한화']);
      // 결제_예정 및 완료 탭 G열: 통화 구분 고정 사용
      const paymentCurrencyKey = paymentHeaders[6] || findHeader(paymentHeaders, ['통화','currency','curr','화폐']);
      function getPaymentCurrency(o) {
        return paymentCurrency(o, paymentCurrencyKey);
      }
      const poHeaders = poRows[0] || [];
      const poNumberKey = findHeader(poHeaders, ['PO번호','PO','발주번호','ORDER']);
      const poProductKey = findHeader(poHeaders, ['상품명','품목명','제품명','품목','제품']);
      const poTotalKey = findHeader(poHeaders, ['총PO금액(외화)','총PO금액','PO금액','총발주금액']);
      const poAdvanceKey = findHeader(poHeaders, ['총선급금(외화)','총선급금','선급금']);
      const poInboundPaidKey = findHeader(poHeaders, ['누적입고물품금액(외화)','누적입고물품금액','입고물품금액']);
      const poNotInboundKey = findHeader(poHeaders, ['미입고물품금액(외화)','미입고물품금액','미입고금액']);
      const poUnpaidBalanceKey = findHeader(poHeaders, ['물품미결제잔액(외화)','물품미결제잔액','미결제잔액','미지급잔액']);
      const poRemainQtyKey = findHeader(poHeaders, ['잔여수량','미입고수량','남은수량','잔량']) || poHeaders[16];
      const poCurrencyKey = findHeader(poHeaders, ['통화','currency','curr','화폐']);
      const poVendorKey = findHeader(poHeaders, ['거래처','업체','공급처']);
      const FX_RATES = { USD: 1500, RMB: 210, CNY: 210 };

      function getPoCurrency(o) {
        const raw = poCurrencyKey ? String(o[poCurrencyKey] || '').trim().toUpperCase() : 'USD';
        if (raw.includes('RMB') || raw.includes('CNY') || raw.includes('위안') || raw.includes('元') || raw.includes('¥')) return 'RMB';
        return 'USD';
      }

      function poFxRate(o) {
        const currency = getPoCurrency(o);
        return FX_RATES[currency] || FX_RATES.USD;
      }

      function poAmountToKrw(o, key) {
        return Math.round(toNum(o[key]) * poFxRate(o));
      }

      function formatForeignByCurrency(amount, currency) {
        if (currency === 'RMB') return `¥${fmt(Math.round(Number(amount || 0)))}`;
        return `$${fmt(Math.round(Number(amount || 0)))}`;
      }

      function getPoRemainQty(o) {
        const byHeader = poRemainQtyKey ? toNum(o[poRemainQtyKey]) : 0;
        const byQColumn = o._row ? toNum(o._row[16]) : 0;
        return byHeader || byQColumn;
      }

      const objects = dateKey ? filterObjectsByDate(paymentObjects, dateKey) : paymentObjects;

      const today = new Date();
      today.setHours(0,0,0,0);

      const upcomingPayments = paymentObjects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      }).sort((a,b) => toDate(a[dateKey]) - toDate(b[dateKey]));

      const upcomingUsd = upcomingPayments.filter(o => getPaymentCurrency(o) === 'USD').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const upcomingRmb = upcomingPayments.filter(o => getPaymentCurrency(o) === 'RMB').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const upcomingKrw = upcomingPayments.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const nearestPaymentDate = upcomingPayments.length ? dateStr(toDate(upcomingPayments[0][dateKey])) : '-';

      const upcomingDailyMap = {};
      upcomingPayments.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!upcomingDailyMap[d]) upcomingDailyMap[d] = { name: d, label: d, value: 0, usd: 0, qty: 0 };
        upcomingDailyMap[d].value += toNum(o[krwKey]);
        upcomingDailyMap[d].usd += toNum(o[usdKey]);
        upcomingDailyMap[d].qty += 1;
      });
      const upcomingDaily = Object.values(upcomingDailyMap).sort((a,b) => {
        const da = toDate(a.name);
        const db = toDate(b.name);
        return (da?.getTime() || 0) - (db?.getTime() || 0);
      });

      const scheduledPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      });

      const paidPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d < today;
      });

      const scheduledKrwInPeriod = scheduledPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const paidKrwInPeriod = paidPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);

      const totalUsd = objects.filter(o => getPaymentCurrency(o) === 'USD').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const totalRmb = objects.filter(o => getPaymentCurrency(o) === 'RMB').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const totalKrw = objects.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const totalPoAmount = poObjects.reduce((s,o)=>s+toNum(o[poTotalKey]),0);
      const totalAdvance = poObjects.reduce((s,o)=>s+toNum(o[poAdvanceKey]),0);
      const totalInboundPaid = poObjects.reduce((s,o)=>s+toNum(o[poInboundPaidKey]),0);
      const totalNotInbound = poObjects.reduce((s,o)=>s+toNum(o[poNotInboundKey]),0);
      const totalPoAmountKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poTotalKey),0);
      const totalNotInboundKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poNotInboundKey),0);
      const totalAdvanceKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poAdvanceKey),0);
      const totalInboundPaidKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poInboundPaidKey),0);
      // 결제_PO관리 탭은 결제_예정 및 완료 탭에 미래 결제일이 적혀 있어도 결제 완료처럼 계산될 수 있으므로,
      // 대시보드에서는 오늘 포함 이후 결제 예정액을 물품미결제잔액에 다시 더해 보정한다.
      const poUnpaidBalanceKrwRaw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poUnpaidBalanceKey),0);
      const futureScheduledKrwForUnpaid = upcomingPayments.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const totalUnpaidBalanceKrw = poUnpaidBalanceKrwRaw + futureScheduledKrwForUnpaid;

      const vendorMap = {};
      const vendorFlowMap = {};
      const poMap = {};
      const productMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          poKrw: 0,
          advance: 0,
          advanceKrw: 0,
          inbound: 0,
          inboundKrw: 0,
          remaining: 0,
          remainingKrw: 0,
          currency: '',
            remainQty: 0,
          paymentRate: 0
        };
        vendorMap[name].value += toNum(o[krwKey]);
        vendorMap[name].usd += getPaymentCurrency(o) === 'USD' ? toNum(o[usdKey]) : 0;
        vendorMap[name].rmb = (vendorMap[name].rmb || 0) + (getPaymentCurrency(o) === 'RMB' ? toNum(o[usdKey]) : 0);
        vendorMap[name].qty += 1;
      });

      // 업체별 결제 흐름은 상단 전체 기간 필터가 아니라, 이 섹션의 월 선택 범위를 기준으로 별도 집계한다.
      paymentObjects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!name || name === '거래처 미지정') return;

        const paymentDate = toDate(o[dateKey]);
        if (!paymentDate) return;

        const monthKey = `${paymentDate.getFullYear()}-${String(paymentDate.getMonth()+1).padStart(2,'0')}`;
        const flowKey = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(paymentDate);

        if (!vendorFlowMap[flowKey]) vendorFlowMap[flowKey] = {};
        if (!vendorFlowMap[flowKey][name]) vendorFlowMap[flowKey][name] = 0;
        vendorFlowMap[flowKey][name] += toNum(o[krwKey]);
      });

      poObjects.forEach(o => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';

        if (poNo) {
          if (!poMap[poNo]) poMap[poNo] = {
            name: poNo,
            poName: poNo,
            productName: productName || poNo,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          poMap[poNo].currency = poMap[poNo].currency || getPoCurrency(o);
          poMap[poNo].po += toNum(o[poTotalKey]);
          poMap[poNo].poKrw += poAmountToKrw(o, poTotalKey);
          poMap[poNo].advance += toNum(o[poAdvanceKey]);
          poMap[poNo].advanceKrw += poAmountToKrw(o, poAdvanceKey);
          poMap[poNo].inbound += toNum(o[poInboundPaidKey]);
          poMap[poNo].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
          poMap[poNo].remaining += toNum(o[poNotInboundKey]);
          poMap[poNo].remainingKrw += poAmountToKrw(o, poNotInboundKey);
          poMap[poNo].remainQty += getPoRemainQty(o);
        }

        if (productName) {
          if (!productMap[productName]) productMap[productName] = {
            name: productName,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          productMap[productName].currency = productMap[productName].currency || getPoCurrency(o);
          productMap[productName].po += toNum(o[poTotalKey]);
          productMap[productName].poKrw += poAmountToKrw(o, poTotalKey);
          productMap[productName].advance += toNum(o[poAdvanceKey]);
          productMap[productName].advanceKrw += poAmountToKrw(o, poAdvanceKey);
          productMap[productName].inbound += toNum(o[poInboundPaidKey]);
          productMap[productName].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
          productMap[productName].remaining += toNum(o[poNotInboundKey]);
          productMap[productName].remainingKrw += poAmountToKrw(o, poNotInboundKey);
          productMap[productName].remainQty += getPoRemainQty(o);
        }
        const name = poVendorKey ? (o[poVendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          poKrw: 0,
          advance: 0,
          advanceKrw: 0,
          inbound: 0,
          inboundKrw: 0,
          remaining: 0,
          remainingKrw: 0,
          currency: '',
            remainQty: 0,
          paymentRate: 0
        };

        vendorMap[name].currency = vendorMap[name].currency || getPoCurrency(o);
        vendorMap[name].po += toNum(o[poTotalKey]);
        vendorMap[name].poKrw += poAmountToKrw(o, poTotalKey);
        vendorMap[name].advance += toNum(o[poAdvanceKey]);
        vendorMap[name].advanceKrw += poAmountToKrw(o, poAdvanceKey);
        vendorMap[name].inbound += toNum(o[poInboundPaidKey]);
        vendorMap[name].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
        vendorMap[name].remaining += toNum(o[poNotInboundKey]);
        vendorMap[name].remainingKrw += poAmountToKrw(o, poNotInboundKey);
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      const paymentMonthValues = [...new Set(Object.keys(vendorFlowMap).map(k => k.slice(0,7)))].sort();
      if (!state.payment.startMonth && paymentMonthValues.length) state.payment.startMonth = paymentMonthValues[0];
      if (!state.payment.endMonth && paymentMonthValues.length) state.payment.endMonth = paymentMonthValues[paymentMonthValues.length - 1];

      const vendorFlowMapFiltered = {};
      Object.entries(vendorFlowMap).forEach(([period, vendors]) => {
        const monthKey = period.slice(0,7);
        const startOk = !state.payment.startMonth || monthKey >= state.payment.startMonth;
        const endOk = !state.payment.endMonth || monthKey <= state.payment.endMonth;
        if (startOk && endOk) vendorFlowMapFiltered[period] = vendors;
      });

      Object.values(poMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      Object.values(productMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      const typeMap = {};
      objects.forEach(o => {
        const name = typeKey ? (o[typeKey] || '유형 미지정') : '유형 미지정';
        if (!typeMap[name]) typeMap[name] = { name, value: 0, qty: 0 };
        typeMap[name].value += toNum(o[krwKey]);
        typeMap[name].qty += 1;
      });

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += toNum(o[krwKey]);
        dailyMap[key].qty += 1;
      });

      const poDetailRank = poObjects.map((o, idx) => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';
        const poAmount = toNum(o[poTotalKey]);
        const advanceAmount = toNum(o[poAdvanceKey]);
        const inboundAmount = toNum(o[poInboundPaidKey]);
        const notInboundAmount = toNum(o[poNotInboundKey]);
        const poAmountKrw = poAmountToKrw(o, poTotalKey);
        const advanceAmountKrw = poAmountToKrw(o, poAdvanceKey);
        const inboundAmountKrw = poAmountToKrw(o, poInboundPaidKey);
        const notInboundAmountKrw = poAmountToKrw(o, poNotInboundKey);
        const remainQty = getPoRemainQty(o);
        const paymentRate = poAmountKrw ? (advanceAmountKrw / poAmountKrw) * 100 : 0;
        const currency = getPoCurrency(o);

        return {
          name: poNo || `PO-${idx + 1}`,
          poName: poNo || `PO-${idx + 1}`,
          productName: productName || poNo || `PO-${idx + 1}`,
          po: poAmount,
          poKrw: poAmountKrw,
          advance: advanceAmount,
          advanceKrw: advanceAmountKrw,
          inbound: inboundAmount,
          inboundKrw: inboundAmountKrw,
          remaining: notInboundAmount,
          remainingKrw: notInboundAmountKrw,
          remainQty,
          paymentRate,
          currency,
          value: poAmountKrw
        };
      }).filter(r => r.po > 0 && r.paymentRate < 100);

      return {
        paymentHeaders,
        paymentObjects,
        objects,
        poObjects,
        dateKey,
        vendorKey,
        productKey,
        typeKey,
        inboundKey,
        usdKey,
        krwKey,
        poTotalKey,
        poAdvanceKey,
        poInboundPaidKey,
        poNotInboundKey,
        poNumberKey,
        poProductKey,
        poUnpaidBalanceKey,
        poRemainQtyKey,
        poVendorKey,
        poCurrencyKey,
        totalUsd,
        totalRmb,
        totalKrw,
        paymentCurrencyKey,
        scheduledPaymentsInPeriod,
        paidPaymentsInPeriod,
        scheduledKrwInPeriod,
        paidKrwInPeriod,
        upcomingPayments,
        upcomingUsd,
        upcomingRmb,
        upcomingKrw,
        nearestPaymentDate,
        upcomingDaily,
        totalPoAmount,
        totalAdvance,
        totalInboundPaid,
        totalNotInbound,
        totalPoAmountKrw,
        totalAdvanceKrw,
        totalInboundPaidKrw,
        totalNotInboundKrw,
        poUnpaidBalanceKrwRaw,
        futureScheduledKrwForUnpaid,
        totalUnpaidBalanceKrw,
        vendorRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        vendorPaymentRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        poRank: Object.values(poMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        poPaymentRank: poDetailRank.sort((a,b)=>b.paymentRate-a.paymentRate),
        productPaymentRank: Object.values(productMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        typeRank: Object.values(typeMap).sort((a,b)=>b.value-a.value),
        dailyFlow: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorFlowMap: vendorFlowMapFiltered,
        paymentMonthValues
      };
    }

    function renderPayment() {
      const a = getPaymentAnalysis();

      const poDetailModal = renderPaymentPoDetailModal(a);

      const previewRows = a.objects.slice(0, 40).map(o => `
        <tr>
          <td>${o[a.dateKey] || '-'}</td>
          <td>${o[a.productKey] || '-'}</td>
          <td>${o[a.vendorKey] || '-'}</td>
          <td>${o[a.typeKey] || '-'}</td>
          <td>${o[a.inboundKey] || '-'}</td>
          <td class="right">${paymentCurrency(o, a.paymentCurrencyKey) === 'RMB' ? '¥' : '$'}${fmt(toNum(o[a.usdKey]))}</td>
          <td class="right">${money(toNum(o[a.krwKey]))}</td>
          <td class="right">${(() => {
            const vendor = o[a.vendorKey] || '거래처 미지정';
            const found = a.vendorPaymentRank.find(v => v.name === vendor);
            return found ? found.paymentRate.toFixed(1) + '%' : '-';
          })()}</td>
          
        </tr>
      `).join('');

      grid(`
        ${sizedMetricCard(metricCard('외화 결제액','USD / RMB 기준 합계',`${fmt(a.totalUsd)} / ¥${fmt(a.totalRmb || 0)}`,`${a.usdKey || '외화금액 없음'} · 통화: ${a.paymentCurrencyKey || 'G열 없음'}`,'good',a.dailyFlow.map(r=>r.value)), 'double')}
        ${sizedMetricCard(metricCard('원화 결제액','KRW 기준 합계',money(a.totalKrw),a.krwKey || '원화 컬럼 없음','good',a.dailyFlow.map(r=>r.value)), 'double')}
        ${sizedMetricCard(clickableMetricCard('총 PO금액','통화별 환율 적용',money(a.totalPoAmountKrw),`통화열 기준 USD 1,500원 / RMB 210원 / 클릭 시 구성 상세`, 'good',[a.totalPoAmountKrw],`openPaymentPoDetail('po')`), 'third-kpi')}
        ${sizedMetricCard(clickableMetricCard('미입고 물품금액','통화별 환율 적용',money(a.totalNotInboundKrw),`입고되지 않은 물품금액 기준 / 클릭 시 구성 상세`,a.totalNotInboundKrw > 0 ? 'warn' : 'good',[a.totalNotInboundKrw],`openPaymentPoDetail('notInbound')`), 'third-kpi')}
        ${sizedMetricCard(clickableMetricCard('물품 미결제 잔액','미결제잔액 + 미래 결제예정 보정',money(a.totalUnpaidBalanceKrw),`PO잔액 ${money(a.poUnpaidBalanceKrwRaw)} + 오늘포함 예정 ${money(a.futureScheduledKrwForUnpaid)} / 클릭 시 구성 상세`,a.totalUnpaidBalanceKrw > 0 ? 'warn' : 'good',[a.totalUnpaidBalanceKrw],`openPaymentPoDetail('unpaid')`), 'third-kpi')}
        

        ${poDetailModal}
        <article class="card full"><div class="card-head"><div><div class="card-title">업체별 결제 흐름 분석</div><div class="card-sub">거래처별 월별 / 일별 지출 흐름</div></div><button onclick="togglePaymentVendorFlow()">${state.payment.vendorFlowOpen ? '흐름 분석 닫기' : '흐름 분석 보기'}</button></div>
          ${state.payment.vendorFlowOpen ? `
          <div class="table-tools">
            <div class="tool-left">
              <select onchange="setPaymentVendorPeriod(this.value)">
                <option value="monthly" ${state.payment.vendorPeriod === 'monthly' ? 'selected' : ''}>월별 보기</option>
                <option value="daily" ${state.payment.vendorPeriod === 'daily' ? 'selected' : ''}>일별 보기</option>
              </select>
              <select onchange="setPaymentVendor(this.value)">
                <option value="all">전체 업체</option>
                ${a.vendorRank.map(v => `<option value="${v.name}" ${state.payment.selectedVendor === v.name ? 'selected' : ''}>${v.name}</option>`).join('')}
              </select>
              <input type="month" value="${state.payment.startMonth}" onchange="setPaymentMonthRange('start', this.value)" />
              <input type="month" value="${state.payment.endMonth}" onchange="setPaymentMonthRange('end', this.value)" />
              <div class="pill">월 범위 선택</div>
            </div>
          </div>
          ${(() => {
            const flowEntries = Object.entries(a.vendorFlowMap || {});
            const selected = state.payment.selectedVendor;
            const chartData = flowEntries.map(([label, vendors]) => ({
              label,
              value: selected === 'all'
                ? Object.values(vendors).reduce((s,v)=>s+v,0)
                : (vendors[selected] || 0),
              qty: Object.keys(vendors).length
            })).filter(r => r.value > 0).sort((x,y)=>x.label.localeCompare(y.label));

            const selectedPeriod = state.payment.selectedFlowPeriod || chartData[0]?.label || '';
            const detailRows = paymentObjectsForVendorFlow(a, selectedPeriod).slice(0, 20);
            const detailTotal = detailRows.reduce((s,o)=>s+toNum(o[a.krwKey]),0);

            return `
              ${renderCoupangFlowChart(chartData, { clickFn: 'setPaymentFlowPeriod' })}
              <div class="table-wrap" style="margin-top:18px; position:relative; z-index:1;">
                <div class="card-head" style="padding:0; margin-bottom:10px;">
                  <div><div class="card-title">${selectedPeriod || '-'} 결제 상세</div><div class="card-sub">선택한 그래프 구간의 품목 / 거래처 / 결제금액</div></div>
                  <span class="badge">${money(detailTotal)}</span>
                </div>
                <table>
                  <thead><tr><th>결제일</th><th>품목</th><th>거래처</th><th>결제유형</th><th class="right">원화</th></tr></thead>
                  <tbody>${detailRows.map(o=>`
                    <tr>
                      <td>${o[a.dateKey] || '-'}</td>
                      <td>${o[a.productKey] || '-'}</td>
                      <td>${o[a.vendorKey] || '-'}</td>
                      <td>${o[a.typeKey] || '-'}</td>
                      <td class="right">${money(toNum(o[a.krwKey]))}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="5" class="muted">선택 구간의 결제 데이터가 없습니다.</td></tr>'}</tbody>
                </table>
              </div>
            `;
          })()}
          ` : '<div class="empty">필요할 때만 열어서 업체별 결제 흐름을 확인합니다.</div>'}
        </article>

        <article class="card full"><div class="card-head"><div><div class="card-title">다가오는 결제 예정</div><div class="card-sub">예정 결제 통합 운영 현황 / 전체 예정건 표시</div></div><span class="badge warn">${fmt(a.upcomingPayments.length)}건 예정</span></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;position:relative;z-index:1;">
            <div style="padding:18px;border-radius:18px;background:var(--ov04);border:1px solid var(--ov06);">
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">총 예정 결제액</div>
              <div style="font-size:28px;font-weight:900;letter-spacing:-0.04em;">${money(a.upcomingKrw)}</div>
            </div>
            <div style="padding:18px;border-radius:18px;background:var(--ov04);border:1px solid var(--ov06);">
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">가장 가까운 결제일</div>
              <div style="font-size:28px;font-weight:900;letter-spacing:-0.04em;">${a.nearestPaymentDate}</div>
            </div>
            <div style="padding:18px;border-radius:18px;background:var(--ov04);border:1px solid var(--ov06);">
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">예정 건수</div>
              <div style="font-size:28px;font-weight:900;letter-spacing:-0.04em;">${fmt(a.upcomingPayments.length)}건</div>
            </div>
          </div>

    function extractConnectedTable(rows, requiredHeaders) {
      const normalized = value => String(value || '').replaceAll(' ', '').toLowerCase();
      const sourceRows = Array.isArray(rows) ? rows : [];
      const headerIndex = sourceRows.findIndex(row => requiredHeaders.every(required =>
        (row || []).some(cell => normalized(cell).includes(normalized(required)))
      ));
      if (headerIndex < 0) return { headerIndex: -1, headers: [], objects: [] };

      const rawHeaders = sourceRows[headerIndex] || [];
      let lastHeaderIndex = rawHeaders.length - 1;
      while (lastHeaderIndex >= 0 && !String(rawHeaders[lastHeaderIndex] || '').trim()) lastHeaderIndex--;
      // gviz CSV는 상단 제목/구분 행을 실제 헤더 셀과 합쳐 반환할 수 있으므로
      // 알려진 열 이름이 포함돼 있으면 대시보드용 표준 헤더로 정규화합니다.
      const canonicalHeaders = [
        '검수불량사진URL','불량사진URL','불량사진링크','검수사진URL','사진URL','사진링크',
        '첨부사진','불량사진','검수사진','이미지URL','이미지','사진',
        '검수완료수량','검수진행률','공장약속일','누적불량','불량수량','불량유형','검수수량',
        '입고수량','관리번호','공급사','발주일','선적일','입고일','불량률','지연일','검수일',
        'SKU','원인','조치','상태'
      ];
      const headers = rawHeaders.slice(0, lastHeaderIndex + 1).map(header => {
        const raw = String(header || '').trim();
        const normalizedRaw = normalized(raw);
        const match = canonicalHeaders.reduce((best, candidate) => {
          const index = normalizedRaw.lastIndexOf(normalized(candidate));
          return index > best.index ? { candidate, index } : best;
        }, { candidate: '', index: -1 });
        return match.candidate || raw;
      });
      const objects = sourceRows.slice(headerIndex + 1).map(row => {
        const object = {};
        headers.forEach((header, index) => {
          if (header) object[header] = row[index] ?? '';
        });
        object._row = row;
        return object;
      }).filter(object => headers.some(header => header && String(object[header] || '').trim()));
      return { headerIndex, headers, objects };
    }

    function splitInspectionPhotoLinks(value) {
      return String(value || '')
        .replace(/,\s*(?=https?:\/\/)/gi, '\n')
        .split(/[\n\r|;]+/)
        .map(url => url.trim())
        .filter(url => /^https:\/\//i.test(url));
    }

    function getInspectionDriveFileId(url) {
      const value = String(url || '');
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/i,
        /[?&]id=([a-zA-Z0-9_-]+)/i,
        /\/d\/([a-zA-Z0-9_-]+)/i
      ];
      for (const pattern of patterns) {
        const match = value.match(pattern);
        if (match) return match[1];
      }
      return '';
    }

    function normalizeInspectionPhoto(url) {
      const originalUrl = String(url || '').trim();
      const driveId = getInspectionDriveFileId(originalUrl);
      if (driveId) {
        const safeId = encodeURIComponent(driveId);
        return {
          kind: 'drive',
          originalUrl,
          thumbnailUrl: `https://drive.google.com/thumbnail?id=${safeId}&sz=w1200`,
          viewerUrl: `https://drive.google.com/file/d/${safeId}/preview`,
          openUrl: `https://drive.google.com/file/d/${safeId}/view`
        };
      }
      return { kind: 'image', originalUrl, thumbnailUrl: originalUrl, viewerUrl: originalUrl, openUrl: originalUrl };
    }

    function getInspectionAnalysis() {
      const lotTable = extractConnectedTable(state.raw.productionInbound || [], ['관리번호','SKU','입고수량','검수완료수량','누적불량']);
      const defectTable = extractConnectedTable(state.raw.inspectionDefects || [], ['검수일','관리번호','검수수량','불량수량']);
      const photoKey = findHeader(defectTable.headers, [
        '검수불량사진URL','불량사진URL','불량사진링크','검수사진URL','사진URL','사진링크',
        '첨부사진','불량사진','검수사진','이미지URL','이미지','사진'
      ]);

      const defectRows = defectTable.objects.map((object, sourceIndex) => ({
        sourceIndex,
        date: toDate(object['검수일']),
        dateText: String(object['검수일'] || '').trim(),
        managementNo: String(object['관리번호'] || '').trim(),
        inspected: toNum(object['검수수량']),
        defect: toNum(object['불량수량']),
        type: String(object['불량유형'] || '').trim(),
        cause: String(object['원인'] || '').trim(),
        action: String(object['조치'] || '').trim(),
        photoLinks: photoKey ? splitInspectionPhotoLinks(object[photoKey]) : [],
        photoIndexes: []
      })).filter(row => row.managementNo && (row.date || row.inspected || row.defect || row.type || row.cause || row.action || row.photoLinks.length));

      const detailByLot = new Map();
      defectRows.forEach(row => {
        if (!detailByLot.has(row.managementNo)) detailByLot.set(row.managementNo, []);
        detailByLot.get(row.managementNo).push(row);
      });

      const allLots = lotTable.objects.map(object => {
        const managementNo = String(object['관리번호'] || '').trim();
        const details = detailByLot.get(managementNo) || [];
        const inspected = toNum(object['검수완료수량']);
        const defect = toNum(object['누적불량']);
        const detailInspected = details.reduce((sum, row) => sum + row.inspected, 0);
        const detailDefect = details.reduce((sum, row) => sum + row.defect, 0);
        const inspectionDates = details.map(row => row.date).filter(Boolean);
        const inboundQty = toNum(object['입고수량']);
        return {
          managementNo,
          sku: String(object['SKU'] || '').trim(),
          supplier: String(object['공급사'] || '').trim(),
          orderDate: toDate(object['발주일']),
          promiseDate: toDate(object['공장약속일']),
          shipDate: toDate(object['선적일']),
          inboundDate: toDate(object['입고일']),
          inboundQty,
          inspected,
          defect,
          remaining: Math.max(inboundQty - inspected, 0),
          progressRate: inboundQty ? inspected / inboundQty : 0,
          defectRate: inspected ? defect / inspected : 0,
          status: String(object['상태'] || '').trim() || (inboundQty && inspected >= inboundQty ? '검수완료' : '검수중'),
          details,
          detailInspected,
          detailDefect,
          linked: inspected === detailInspected && defect === detailDefect,
          latestInspectionDate: inspectionDates.length ? new Date(Math.max(...inspectionDates.map(date => date.getTime()))) : null
        };
      }).filter(lot => lot.managementNo);

      const availableLots = allLots.map(lot => lot.managementNo);
      let selectedLots = Array.isArray(state.inspection.selectedLots)
        ? state.inspection.selectedLots.filter(id => availableLots.includes(id))
        : null;
      if (selectedLots && selectedLots.length === availableLots.length && availableLots.every(id => selectedLots.includes(id))) {
        selectedLots = null;
      }
      state.inspection.selectedLots = selectedLots;
      const selectedLotSet = selectedLots === null ? null : new Set(selectedLots);
      const lots = selectedLotSet === null ? allLots : allLots.filter(lot => selectedLotSet.has(lot.managementNo));
      const selectedLotIds = new Set(lots.map(lot => lot.managementNo));
      const details = defectRows.filter(row => selectedLotIds.has(row.managementNo));
      const lotById = new Map(allLots.map(lot => [lot.managementNo, lot]));
      const photos = [];
      details.forEach(row => {
        row.photoIndexes = row.photoLinks.map((url, photoOrder) => {
          const asset = normalizeInspectionPhoto(url);
          const index = photos.length;
          photos.push({
            ...asset,
            index,
            photoOrder,
            sourceIndex: row.sourceIndex,
            managementNo: row.managementNo,
            date: row.date,
            dateText: row.dateText,
            inspected: row.inspected,
            defect: row.defect,
            type: row.type,
            cause: row.cause,
            action: row.action,
            reason: row.type || row.cause || '유형 미입력'
          });
          return index;
        });
      });

      const totalInbound = lots.reduce((sum, lot) => sum + lot.inboundQty, 0);
      const totalInspected = lots.reduce((sum, lot) => sum + lot.inspected, 0);
      const totalDefect = lots.reduce((sum, lot) => sum + lot.defect, 0);
      const remaining = Math.max(totalInbound - totalInspected, 0);
      const progressRate = totalInbound ? totalInspected / totalInbound : 0;
      const defectRate = totalInspected ? totalDefect / totalInspected : 0;

      const periodRange = getCurrentPeriodRange();
      const periodDetails = details.filter(row => {
        if (!row.date) return false;
        const date = new Date(row.date);
        date.setHours(0,0,0,0);
        return date >= periodRange.start && date <= periodRange.end;
      });
      const periodInspected = periodDetails.reduce((sum, row) => sum + row.inspected, 0);
      const periodDefect = periodDetails.reduce((sum, row) => sum + row.defect, 0);
      const periodDefectRate = periodInspected ? periodDefect / periodInspected : 0;

      const dailyMap = new Map();
      periodDetails.forEach(row => {
        if (!row.date) return;
        const key = dateStr(row.date);
        if (!dailyMap.has(key)) dailyMap.set(key, { label: key, date: row.date, inspected: 0, defect: 0 });
        const day = dailyMap.get(key);
        day.inspected += row.inspected;
        day.defect += row.defect;
      });
      const daily = [...dailyMap.values()].sort((a, b) => a.date - b.date);

      const defectTypeMap = new Map();
      details.forEach(row => {
        if (row.defect <= 0) return;
        const name = row.type || row.cause || '유형 미입력';
        defectTypeMap.set(name, (defectTypeMap.get(name) || 0) + row.defect);
      });
      const defectTypes = [...defectTypeMap.entries()]
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);

      const inboundDates = lots.map(lot => lot.inboundDate).filter(Boolean);
      const latestInboundDate = inboundDates.length ? new Date(Math.max(...inboundDates.map(date => date.getTime()))) : null;
      const mismatchLots = lots.filter(lot => !lot.linked);
      const allLotIds = new Set(allLots.map(lot => lot.managementNo));
      const orphanDetails = defectRows.filter(row => !allLotIds.has(row.managementNo));

      return {
        lotTable,
        defectTable,
        photoKey,
        photos,
        allLots,
        lots,
        details,
        periodDetails,
        defectRows,
        availableLots,
        selectedLots,
        lotById,
        totalInbound,
        totalInspected,
        totalDefect,
        remaining,
        progressRate,
        defectRate,
        periodInspected,
        periodDefect,
        periodDefectRate,
        periodDayCount: new Set(periodDetails.map(row => row.date ? dateStr(row.date) : '').filter(Boolean)).size,
        daily,
        defectTypes,
        latestInboundDate,
        mismatchLots,
        orphanDetails
      };
    }

    function toggleInspectionLotMenu(event) {
      if (event) event.stopPropagation();
      state.inspection.lotFilterOpen = !state.inspection.lotFilterOpen;
      renderInspection();
    }

    function setAllInspectionLots(checked) {
      state.inspection.selectedLots = checked ? null : [];
      state.inspection.lotFilterOpen = true;
      renderInspection();
    }

    function toggleInspectionLot(value, checked) {
      const analysis = getInspectionAnalysis();
      const available = analysis.availableLots;
      const selected = new Set(state.inspection.selectedLots === null ? available : state.inspection.selectedLots);
      if (checked) selected.add(value);
      else selected.delete(value);
      const next = available.filter(id => selected.has(id));
      state.inspection.selectedLots = next.length === available.length ? null : next;
      state.inspection.lotFilterOpen = true;
      renderInspection();
    }

    function openInspectionDefectDetail(event) {
      if (event) event.stopPropagation();
      state.inspection.lotFilterOpen = false;
      state.inspection.defectDetailOpen = true;
      renderInspection();
    }

    function closeInspectionDefectDetail() {
      state.inspection.defectDetailOpen = false;
      renderInspection();
    }

    function toggleInspectionDetails() {
      state.inspection.detailExpanded = !state.inspection.detailExpanded;
      renderInspection();
    }

    function getInspectionPhotoSelection(a) {
      const reasons = [...new Set((a.photos || []).map(photo => photo.reason).filter(Boolean))]
        .sort((left, right) => left.localeCompare(right, 'ko'));
      if (state.inspection.photoReason !== 'all' && !reasons.includes(state.inspection.photoReason)) {
        state.inspection.photoReason = 'all';
      }
      const photos = state.inspection.photoReason === 'all'
        ? (a.photos || [])
        : (a.photos || []).filter(photo => photo.reason === state.inspection.photoReason);
      return { reasons, photos };
    }

    function setInspectionPhotoReason(reason) {
      state.inspection.photoReason = String(reason || 'all');
      state.inspection.photoExpanded = false;
      renderInspection();
    }

    function toggleInspectionPhotoGallery() {
      state.inspection.photoExpanded = !state.inspection.photoExpanded;
      renderInspection();
    }

    function openInspectionPhoto(index, event) {
      if (event) event.stopPropagation();
      const analysis = getInspectionAnalysis();
      if (!analysis.photos.length) return;
      state.inspection.photoViewerIndex = Math.min(Math.max(Number(index) || 0, 0), analysis.photos.length - 1);
      state.inspection.photoViewerOpen = true;
      state.inspection.lotFilterOpen = false;
      renderInspection();
    }

    function closeInspectionPhoto(event) {
      if (event) event.stopPropagation();
      state.inspection.photoViewerOpen = false;
      renderInspection();
    }

    function stepInspectionPhoto(direction, event) {
      if (event) event.stopPropagation();
      const analysis = getInspectionAnalysis();
      const count = analysis.photos.length;
      if (!count) {
        state.inspection.photoViewerOpen = false;
        renderInspection();
        return;
      }
      state.inspection.photoViewerIndex = (state.inspection.photoViewerIndex + Number(direction) + count) % count;
      renderInspection();
    }

    function renderInspectionPhotoGallery(a, scopeLabel) {
      const selection = getInspectionPhotoSelection(a);
      const visibleLimit = 10;
      const visiblePhotos = state.inspection.photoExpanded ? selection.photos : selection.photos.slice(0, visibleLimit);
      const filterButtons = [
        `<button type="button" class="inspection-photo-filter ${state.inspection.photoReason === 'all' ? 'active' : ''}" data-reason="all" onclick="setInspectionPhotoReason(this.dataset.reason)">전체 ${fmt(a.photos.length)}</button>`,
        ...selection.reasons.map(reason => {
          const count = a.photos.filter(photo => photo.reason === reason).length;
          return `<button type="button" class="inspection-photo-filter ${state.inspection.photoReason === reason ? 'active' : ''}" data-reason="${safeHtml(reason)}" onclick="setInspectionPhotoReason(this.dataset.reason)">${safeHtml(reason)} ${fmt(count)}</button>`;
        })
      ].join('');

      const photoTiles = visiblePhotos.map((photo, visibleIndex) => {
        const label = `${photo.reason} · ${photo.managementNo} · ${photo.dateText || dateStr(photo.date)}`;
        return `<button type="button" class="inspection-photo-tile" onclick="openInspectionPhoto(${photo.index},event)" aria-label="${safeHtml(label)} 사진 크게 보기">
          <div class="inspection-photo-media">
            <img src="${safeHtml(photo.thumbnailUrl)}" alt="${safeHtml(label)}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
            <div class="inspection-photo-fallback" hidden><div><strong>미리보기 열기</strong>이미지를 불러오지 못했습니다.<br>눌러서 원본을 확인하세요.</div></div>
            <span class="inspection-photo-count">${visibleIndex + 1} / ${selection.photos.length}</span>
          </div>
          <div class="inspection-photo-copy">
            <strong>${safeHtml(photo.reason)}</strong>
            <span>${safeHtml(photo.managementNo)} · ${safeHtml(photo.dateText || dateStr(photo.date))}</span>
            <em>불량 ${fmt(photo.defect)}개</em>
          </div>
        </button>`;
      }).join('');

      let galleryBody = '';
      if (!a.photoKey) {
        galleryBody = `<div class="inspection-photo-empty"><div><strong>사진 열을 찾지 못했습니다.</strong><code>검수불량</code> 시트에 <code>불량사진</code> 또는 <code>사진URL</code> 열을 추가하고<br>공유된 Google Drive 사진 링크를 입력하면 여기에 자동 표시됩니다.</div></div>`;
      } else if (!a.photos.length) {
        galleryBody = `<div class="inspection-photo-empty"><div><strong>등록된 불량 사진이 없습니다.</strong>${safeHtml(scopeLabel)}에 해당하는 <code>${safeHtml(a.photoKey)}</code> 열의 링크를 확인해 주세요.<br>링크는 <code>https://</code>로 시작해야 합니다.</div></div>`;
      } else if (!selection.photos.length) {
        galleryBody = '<div class="inspection-photo-empty"><div><strong>선택한 불량유형의 사진이 없습니다.</strong>위 필터에서 다른 불량유형을 선택해 주세요.</div></div>';
      } else {
        galleryBody = `<div class="inspection-photo-grid">${photoTiles}</div>${selection.photos.length > visibleLimit ? `<div class="inspection-photo-more"><button type="button" onclick="toggleInspectionPhotoGallery()">${state.inspection.photoExpanded ? '사진 접기' : `나머지 ${fmt(selection.photos.length - visibleLimit)}장 더보기`}</button></div>` : ''}`;
      }

      return `<article class="card full inspection-photo-card">
        <div class="card-head"><div><div class="card-title">불량 사진</div><div class="card-sub">${safeHtml(scopeLabel)} · 검수불량 시트의 사진 링크</div></div><span class="badge ${a.photos.length ? 'danger' : ''}">${fmt(selection.photos.length)}장</span></div>
        ${a.photos.length ? `<div class="inspection-photo-toolbar"><div class="inspection-photo-filters">${filterButtons}</div><span class="pill">불량유형별 필터</span></div>` : ''}
        ${galleryBody}
        <div class="inspection-photo-help">지원 열 이름: 불량사진, 사진URL, 사진링크, 검수사진, 이미지. 한 셀에 여러 장을 넣을 때는 링크를 줄바꿈·세미콜론·<strong>|</strong>로 구분하세요. Google Drive 사진은 공유 권한을 ‘링크가 있는 사용자’로 설정해야 대시보드 안에서 열립니다.</div>
      </article>`;
    }

    function renderInspectionPhotoViewer(a) {
      if (!state.inspection.photoViewerOpen || !a.photos.length) return '';
      state.inspection.photoViewerIndex = Math.min(Math.max(state.inspection.photoViewerIndex, 0), a.photos.length - 1);
      const photo = a.photos[state.inspection.photoViewerIndex];
      const label = `${photo.reason} · ${photo.managementNo}`;
      const stage = photo.kind === 'drive'
        ? `<iframe src="${safeHtml(photo.viewerUrl)}" title="${safeHtml(label)} 사진 미리보기" loading="lazy" allow="fullscreen"></iframe>`
        : `<img src="${safeHtml(photo.viewerUrl)}" alt="${safeHtml(label)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
           <div class="inspection-photo-stage-fallback" hidden><div>이 링크는 이미지로 바로 표시할 수 없습니다.<br><a href="${safeHtml(photo.openUrl)}" target="_blank" rel="noopener noreferrer">원본 링크 열기</a></div></div>`;
      const navigation = a.photos.length > 1
        ? `<button type="button" class="inspection-photo-nav prev" onclick="stepInspectionPhoto(-1,event)" aria-label="이전 사진">‹</button><button type="button" class="inspection-photo-nav next" onclick="stepInspectionPhoto(1,event)" aria-label="다음 사진">›</button>`
        : '';

      return `<div class="inspection-photo-viewer-backdrop" role="dialog" aria-modal="true" aria-label="불량 사진 크게 보기" onclick="closeInspectionPhoto(event)">
        <div class="inspection-photo-viewer" onclick="event.stopPropagation()">
          <div class="inspection-photo-viewer-head">
            <div class="inspection-photo-viewer-title"><strong>${safeHtml(photo.reason)}</strong><span>${safeHtml(photo.managementNo)} · ${safeHtml(photo.dateText || dateStr(photo.date))} · ${state.inspection.photoViewerIndex + 1}/${a.photos.length}</span></div>
            <button type="button" class="modal-close" onclick="closeInspectionPhoto(event)">닫기</button>
          </div>
          <div class="inspection-photo-stage">${stage}${navigation}</div>
          <div class="inspection-photo-viewer-meta"><div><strong>불량 ${fmt(photo.defect)}개${photo.cause ? ` · 원인 ${safeHtml(photo.cause)}` : ''}</strong><span>${photo.action ? `조치: ${safeHtml(photo.action)}` : '조치 내용 미입력'}</span></div><a href="${safeHtml(photo.openUrl)}" target="_blank" rel="noopener noreferrer">원본 열기</a></div>
        </div>
      </div>`;
    }

    function renderInspectionDefectModal(a, scopeLabel) {
      if (!state.inspection.defectDetailOpen) return '';
      const reasonItems = a.defectTypes.map(item => ({ name:item.name, qty:item.value, value:0 }));
      const reasonSourceTotal = reasonItems.reduce((sum, item) => sum + item.qty, 0);
      const unlinked = Math.max(a.totalDefect - reasonSourceTotal, 0);
      if (unlinked > 0) reasonItems.push({ name:'사유 미연동', qty:unlinked, value:0 });
      const chartTotal = reasonItems.reduce((sum, item) => sum + item.qty, 0);
      const mismatchNote = reasonSourceTotal === a.totalDefect
        ? '불량 사유 비율은 각 사유의 불량수량 ÷ 선택 로트 누적 불량수량으로 계산합니다.'
        : reasonSourceTotal < a.totalDefect
          ? `누적 불량 ${fmt(a.totalDefect)}개에서 검수불량 상세의 사유 합계 ${fmt(reasonSourceTotal)}개를 뺀 ${fmt(unlinked)}개를 ‘사유 미연동’으로 구분했습니다.`
          : `검수불량 상세의 사유 합계 ${fmt(reasonSourceTotal)}개가 누적 불량 ${fmt(a.totalDefect)}개보다 ${fmt(reasonSourceTotal - a.totalDefect)}개 많습니다. 원형그래프는 상세 사유 합계 기준이며 연동값 확인이 필요합니다.`;

      return `
        <div class="modal-backdrop inspection-defect-backdrop" onclick="closeInspectionDefectDetail()">
          <div class="modal-card inspection-defect-modal" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div><div class="card-title">누적 불량 사유 구성</div><div class="card-sub">${safeHtml(scopeLabel)} · 선택한 관리번호의 전체 누적 기준</div></div>
              <button class="modal-close" onclick="closeInspectionDefectDetail()">닫기</button>
            </div>
            <div class="inspection-defect-summary">
              <div class="pill">누적 불량 ${fmt(a.totalDefect)}개</div>
              <div class="pill">사유 집계 ${fmt(chartTotal)}개</div>
              <div class="pill">불량률 ${pct(a.totalDefect,a.totalInspected)}</div>
              <div class="pill">등록 사진 ${fmt(a.photos.length)}장</div>
            </div>
            ${renderCategoryDonutChart(reasonItems, {
              metric:'qty',
              limit:8,
              scopeLabel:'불량 사유',
              quantityLabel:'사유 집계 합계',
              emptyMessage:'입력된 불량 사유가 없습니다.',
              colors:['#fb7185','#ef4444','#f97316','#fbbf24','#a78bfa','#f43f5e','#dc2626','#fb923c']
            })}
            <div class="inspection-defect-note">${safeHtml(mismatchNote)}</div>
          </div>
        </div>`;
    }

    document.addEventListener('click', event => {
      if (!state.inspection.lotFilterOpen) return;
      if (event.target?.closest?.('[data-inspection-lot-filter]')) return;
      state.inspection.lotFilterOpen = false;
      if (state.tab === 'inspection') renderInspection();
    });

    document.addEventListener('keydown', event => {
      if (state.inspection.photoViewerOpen && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
        stepInspectionPhoto(event.key === 'ArrowLeft' ? -1 : 1, event);
        return;
      }
      if (event.key !== 'Escape') return;
      if (state.inspection.photoViewerOpen) {
        state.inspection.photoViewerOpen = false;
        if (state.tab === 'inspection') renderInspection();
        return;
      }
      if (state.inspection.defectDetailOpen) {
        state.inspection.defectDetailOpen = false;
        if (state.tab === 'inspection') renderInspection();
        return;
      }
      if (!state.inspection.lotFilterOpen) return;
      state.inspection.lotFilterOpen = false;
      if (state.tab === 'inspection') renderInspection();
    });

    function inspectionLotShortLabel(value) {
      const text = String(value || '');
      return text.length > 13 ? `${text.slice(0, 6)}…${text.slice(-5)}` : text;
    }

    function renderInspectionKpiCard({ title, sub, value, caption, tone, badge, badgeClass = '', lots, valueKey, maxValue, scaleLabel, onClick = '' }) {
      const count = lots.length;
      const gap = count <= 4 ? 10 : count <= 8 ? 7 : count <= 14 ? 4 : count <= 24 ? 2 : 1;
      const labelStep = count > 24 ? 4 : count > 14 ? 3 : count > 8 ? 2 : 1;
      const showFullLotLabels = count <= 6;
      const safeMax = Math.max(Number(maxValue || 0), 1);
      const bars = lots.map((lot, index) => {
        const amount = Number(lot[valueKey] || 0);
        // 최대 막대도 84%까지만 사용해 막대 위 수량 라벨 공간을 항상 확보합니다.
        const height = amount > 0 ? Math.min((amount / safeMax) * 84, 84) : 0;
        const showLabel = labelStep === 1 || index % labelStep === 0 || index === count - 1;
        const fullLabel = String(lot.managementNo || `로트 ${index + 1}`);
        const displayLabel = showFullLotLabels ? fullLabel : inspectionLotShortLabel(fullLabel);
        const tooltip = `${fullLabel} · ${title} ${fmt(amount)}개`;
        return `<div class="inspection-lot-chart-col" title="${safeHtml(tooltip)}" aria-label="${safeHtml(tooltip)}">
          <div class="inspection-lot-chart-stack">
            <div class="inspection-lot-chart-value">${showLabel ? `${fmt(amount)}개` : '&nbsp;'}</div>
            <div class="inspection-lot-chart-bar ${amount > 0 ? 'has-value' : ''}" style="--bar-height:${height.toFixed(2)}%"></div>
          </div>
          <div class="inspection-lot-chart-label">${showLabel ? safeHtml(displayLabel) : '&nbsp;'}</div>
        </div>`;
      }).join('');
      const chart = count
        ? `<div class="inspection-lot-chart ${showFullLotLabels ? 'labels-full' : ''}" style="--lot-gap:${gap}px" role="img" aria-label="${safeHtml(title)} 로트별 세로 막대그래프">${bars}</div>`
        : '<div class="inspection-chart-empty">선택된 로트가 없습니다.<br>위의 관리번호 필터에서 로트를 선택해 주세요.</div>';
      const interactiveClass = onClick ? ' is-clickable' : '';
      const interactiveAttrs = onClick
        ? ` role="button" tabindex="0" onclick="${onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${onClick}}" title="클릭해서 불량 사유 구성 보기"`
        : '';
      return `<article class="card kpi inspection-kpi-card tone-${tone}${interactiveClass}"${interactiveAttrs}>
        <div class="card-head"><div><div class="card-title">${safeHtml(title)}</div><div class="card-sub">${safeHtml(sub)}</div></div><span class="badge ${badgeClass}">${safeHtml(badge)}</span></div>
        <div class="kpi-value">${safeHtml(value)}</div>
        <div class="kpi-caption">${safeHtml(caption)}</div>
        <div class="inspection-chart-head"><span class="inspection-chart-key">막대 위 수량 · 아래 관리번호</span><span class="inspection-chart-scale">${safeHtml(scaleLabel)}</span></div>
        ${chart}
      </article>`;
    }

    function renderInspectionLotProgress(lots) {
      if (!lots.length) return '<div class="empty">표시할 생산입고 로트가 없습니다.</div>';
      return `<div class="inspection-lot-list">${lots.map(lot => {
        const progress = Math.min(Math.max(lot.progressRate * 100, 0), 100);
        const statusClass = lot.remaining > 0 || lot.defect > 0 ? 'warn' : '';
        return `<div class="inspection-lot">
          <div class="inspection-lot-top">
            <div class="inspection-lot-name"><strong>${safeHtml(lot.sku || lot.managementNo)}</strong><span>${safeHtml(lot.managementNo)} · ${safeHtml(lot.supplier || '공급사 미입력')}</span></div>
            <span class="badge ${statusClass}">${safeHtml(lot.status)}</span>
          </div>
          <div class="inspection-lot-stats">
            <div class="inspection-lot-stat"><span>입고</span><strong>${fmt(lot.inboundQty)}개</strong></div>
            <div class="inspection-lot-stat"><span>검수 완료</span><strong>${fmt(lot.inspected)}개</strong></div>
            <div class="inspection-lot-stat"><span>잔여</span><strong>${fmt(lot.remaining)}개</strong></div>
            <div class="inspection-lot-stat"><span>불량률</span><strong>${pct(lot.defect, lot.inspected)}</strong></div>
          </div>
          <div class="inspection-lot-progress"><div style="width:${progress}%"></div></div>
          <div class="inspection-lot-foot"><span>검수진행률 ${pct(lot.inspected, lot.inboundQty)} · 누적불량 ${fmt(lot.defect)}개</span><span>입고 ${dateStr(lot.inboundDate)} · 최근 검수 ${dateStr(lot.latestInspectionDate)} · ${lot.linked ? '연동 일치' : '연동값 확인 필요'}</span></div>
        </div>`;
      }).join('')}</div>`;
    }

          : '<span class="muted">-</span>';
        return `<tr><td>${safeHtml(row.dateText || dateStr(row.date))}</td><td>${safeHtml(row.managementNo)}</td><td>${safeHtml(lot?.sku || '-')}</td><td class="right">${fmt(row.inspected)}</td><td class="right">${fmt(row.defect)}</td><td class="right">${pct(row.defect, row.inspected)}</td><td>${safeHtml(row.type || '-')}</td><td>${safeHtml(row.cause || '-')}</td><td>${safeHtml(row.action || '-')}</td><td>${photoButton}</td></tr>`;
      }).join('') || '<tr><td colspan="10" class="muted">표시할 검수 상세 데이터가 없습니다.</td></tr>'}</tbody></table></div>`;

      grid(`
        <article class="card full inspection-filter-toolbar" style="min-height:auto;padding:14px 18px;">
          <div class="table-tools" style="margin:0;">
            <div class="tool-left">
              <strong style="font-size:13px;">관리번호</strong>

                  <div class="inspection-lot-checks">

        ${renderInspectionKpiCard({ title:'검수 완료', sub:`${scopeLabel} · 누적`, value:`${fmt(a.totalInspected)}개`, caption:`입고 ${fmt(a.totalInbound)}개 대비 ${pct(a.totalInspected,a.totalInbound)}`, tone:'complete', badge:`진행 ${pct(a.totalInspected,a.totalInbound)}`, lots:a.lots, valueKey:'inspected', maxValue:sharedLotMax, scaleLabel:'입고와 같은 축' })}
        ${renderInspectionKpiCard({ title:'잔여 검수수량', sub:'입고수량 - 검수완료', value:`${fmt(a.remaining)}개`, caption:a.remaining > 0 ? `선택 로트의 남은 검수 ${fmt(a.remaining)}개` : '선택 로트 전체 검수 완료', tone:'remaining', badge:`잔여 ${pct(a.remaining,a.totalInbound)}`, badgeClass:a.remaining > 0 ? 'warn' : '', lots:a.lots, valueKey:'remaining', maxValue:sharedLotMax, scaleLabel:'입고와 같은 축' })}
        ${renderInspectionKpiCard({ title:'누적 불량', sub:`${scopeLabel} · 검수불량 기준`, value:`${fmt(a.totalDefect)}개`, caption:`검수 ${fmt(a.totalInspected)}개 중 ${pct(a.totalDefect,a.totalInspected)}`, tone:'defect', badge:`불량률 ${pct(a.totalDefect,a.totalInspected)}`, badgeClass:a.totalDefect > 0 ? 'danger' : '', lots:a.lots, valueKey:'defect', maxValue:defectLotMax, scaleLabel:'클릭: 사유 구성 보기', onClick:'openInspectionDefectDetail(event)' })}

        <article class="card wide"><div class="card-head"><div><div class="card-title">로트별 검수 진행</div><div class="card-sub">입고수량 대비 검수완료·잔여·불량률</div></div><span class="badge ${a.remaining > 0 ? 'warn' : ''}">전체 진행률 ${pct(a.totalInspected, a.totalInbound)}</span></div>${renderInspectionLotProgress(a.lots)}</article>

        <article class="card side"><div class="card-head"><div><div class="card-title">선택기간 검수 요약</div><div class="card-sub">상단 기간 필터 · 검수일 기준</div></div><span class="badge">${safeHtml(document.getElementById('periodLabel').textContent)}</span></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">📅</div><div><strong>검수 진행일</strong><span>검수불량 시트의 입력 날짜</span></div><div class="issue-num">${fmt(a.periodDayCount)}일</div></div>
          <div class="issue"><div class="issue-icon">🔍</div><div><strong>검수수량</strong><span>선택기간 합계</span></div><div class="issue-num">${fmt(a.periodInspected)}</div></div>
          <div class="issue"><div class="issue-icon">!</div><div><strong>불량수량</strong><span>선택기간 합계</span></div><div class="issue-num">${fmt(a.periodDefect)}</div></div>
          <div class="issue"><div class="issue-icon">%</div><div><strong>불량률</strong><span>불량수량 ÷ 검수수량</span></div><div class="issue-num">${pct(a.periodDefect, a.periodInspected)}</div></div>

            <div class="inspection-detail-actions"><span class="badge">${fmt(detailRows.length)}행</span><button type="button" class="inspection-detail-toggle" aria-expanded="${state.inspection.detailExpanded}" onclick="toggleInspectionDetails()">${state.inspection.detailExpanded ? '접기' : '펼치기'} <span class="inspection-detail-toggle-arrow">▾</span></button></div>

      const allLotsCheckbox = document.getElementById('inspectionAllLots');
      if (allLotsCheckbox) allLotsCheckbox.indeterminate = !allLotsSelected && a.lots.length > 0;

    function getInboundAnalysis() {
      // 입고_예정 탭이 비어 있거나 gid 연결이 안 된 경우,
      // 현재 실제로 로드되고 있는 결제_PO관리 데이터를 기준으로 입고 예정 정보를 구성한다.
      const rows = state.raw.inbound || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['입고예정일','예정일','입고일','도착일','날짜','일자','납기일','도착예정일']);
      const vendorKey = findHeader(headers, ['거래처','업체','공급처','공장']);
      const productKey = findHeader(headers, ['상품명','품목명','제품명','품목','제품','모델','옵션']);
      const qtyKey = findHeader(headers, ['입고수량','예정수량','수량','입고예정수량','잔여수량','미입고수량','발주수량']) || headers[16];
      const statusKey = findHeader(headers, ['상태','진행상태','입고상태']);
      const reasonKey = findHeader(headers, ['지연사유','확인사유','사유','비고','메모','특이사항','이슈']);
      const poKey = findHeader(headers, ['PO번호','PO','발주번호','주문번호']);
      const amountKey = findHeader(headers, ['입고금액','예정금액','물품금액','금액','원화','KRW','미입고물품금액(외화)','미입고물품금액','총PO금액']);

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const today = new Date();
      today.setHours(0,0,0,0);

      function rowQty(o) {
        const byHeader = qtyKey ? toNum(o[qtyKey]) : 0;
        const byQColumn = o._row ? toNum(o._row[16]) : 0;
        return byHeader || byQColumn || 0;
      }
      function rowAmount(o) {
        const value = amountKey ? toNum(o[amountKey]) : 0;
        // PO관리의 외화 금액 컬럼을 입고 예정 금액으로 잡은 경우 1,500원 환산 적용
        const amountName = String(amountKey || '');
        if (amountName.includes('외화') || amountName.includes('PO')) return usdToKrw(value);
        return value;
      }
      function rowStatus(o) { return statusKey ? String(o[statusKey] || '').trim() : ''; }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalAmount = objects.reduce((s,o)=>s+rowAmount(o),0);
      const completed = objects.filter(o => rowStatus(o).includes('완료') || rowStatus(o).includes('입고완료'));
      const delayed = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d < today && !status.includes('완료');
      });
      const upcoming = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d >= today && !status.includes('완료');
      }).sort((a,b)=>toDate(a[dateKey])-toDate(b[dateKey]));

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += rowQty(o);
        dailyMap[key].qty += rowQty(o);
      });

      const vendorMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (String(o[vendorKey] || '').trim() || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = { name, qty:0, value:0 };
        vendorMap[name].qty += rowQty(o);
        vendorMap[name].value += rowAmount(o) || rowQty(o);
      });

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty:0, value:0 };
        productMap[name].qty += rowQty(o);
        productMap[name].value += rowQty(o);
      });

      const statusMap = {};
      objects.forEach(o => {
        const name = rowStatus(o) || '상태 미지정';
        if (!statusMap[name]) statusMap[name] = { name, qty:0, value:0 };
        statusMap[name].qty += 1;
        statusMap[name].value += rowQty(o);
      });

      return {
        headers, objects, dateKey, vendorKey, productKey, qtyKey, statusKey, reasonKey, poKey, amountKey,
        totalQty, totalAmount, completed, delayed, upcoming,
        daily: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorRank: Object.values(vendorMap).filter(v=>v.name !== '거래처 미지정').sort((a,b)=>b.value-a.value),
        productRank: Object.values(productMap).filter(v=>v.name !== '품목 미지정').sort((a,b)=>b.qty-a.qty),
        statusRank: Object.values(statusMap).sort((a,b)=>b.qty-a.qty)
      };
    }

    function renderInbound() {
      const a = getInboundAnalysis();
      if (!a.headers.length) {

    function getInboundManageAnalysis() {
      const rows = state.raw.inboundManage || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['입고일','실입고일','처리일','검수일','날짜','일자']);
      const expectedDateKey = findHeader(headers, ['입고예정일','예정일','도착예정일']);
      const vendorKey = findHeader(headers, ['거래처','업체','공급처','공장']);
      const productKey = findHeader(headers, ['상품명','품목명','제품명','품목','제품','모델','옵션']);
      const poKey = findHeader(headers, ['PO번호','PO','발주번호','주문번호']);
      const expectedQtyKey = findHeader(headers, ['예정수량','입고예정수량','발주수량','예상수량']);
      const actualQtyKey = findHeader(headers, ['실입고수량','입고수량','실제입고','입고완료수량','완료수량']);
      const diffQtyKey = findHeader(headers, ['차이수량','수량차이','부족수량','과입고수량']);
      const defectQtyKey = findHeader(headers, ['불량수량','파손수량','검수불량','불량','파손']);
      const statusKey = findHeader(headers, ['상태','입고상태','검수상태','진행상태']);
      const memoKey = findHeader(headers, ['비고','메모','사유','특이사항','이슈']);
      const amountKey = headers[20]; // U열: 최종 입고금액 고정

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;

      function expectedQty(o) { return expectedQtyKey ? toNum(o[expectedQtyKey]) : 0; }
      function actualQty(o) { return actualQtyKey ? toNum(o[actualQtyKey]) : 0; }
      function defectQty(o) { return defectQtyKey ? toNum(o[defectQtyKey]) : 0; }
      function diffQty(o) {
        if (diffQtyKey) return toNum(o[diffQtyKey]);
        const e = expectedQty(o);
        const a = actualQty(o);
        return e || a ? e - a : 0;
      }
      function amount(o) {
        // 입고 금액은 반드시 입고_관리 탭 U열(21번째 열, index 20)의 최종 입고금액만 사용
        return o._row ? toNum(o._row[20]) : 0;
      }
      function status(o) { return statusKey ? String(o[statusKey] || '').trim() : ''; }

      const totalExpected = objects.reduce((s,o)=>s+expectedQty(o),0);
      const totalActual = objects.reduce((s,o)=>s+actualQty(o),0);
      const totalDiff = objects.reduce((s,o)=>s+diffQty(o),0);
      const totalDefect = objects.reduce((s,o)=>s+defectQty(o),0);
      const totalAmount = objects.reduce((s,o)=>s+amount(o),0);
      const completeRate = totalExpected ? pct(totalActual, totalExpected) : '0.00%';

      const issueRows = objects.filter(o => diffQty(o) !== 0 || defectQty(o) > 0 || String(status(o)).includes('확인') || String(status(o)).includes('지연'));

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += actualQty(o);
        dailyMap[key].qty += actualQty(o);
      });

      const vendorMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (String(o[vendorKey] || '').trim() || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = { name, value:0, qty:0 };
        vendorMap[name].value += amount(o) || actualQty(o);
        vendorMap[name].qty += actualQty(o);
      });

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, value:0, qty:0 };
        productMap[name].value += amount(o);
        productMap[name].qty += actualQty(o);
      });

      const statusMap = {};
      objects.forEach(o => {
        const name = status(o) || '상태 미지정';
        if (!statusMap[name]) statusMap[name] = { name, value:0, qty:0 };
        statusMap[name].value += actualQty(o) || 1;
        statusMap[name].qty += 1;
      });

      return {
        headers, objects, dateKey, expectedDateKey, vendorKey, productKey, poKey,
        expectedQtyKey, actualQtyKey, diffQtyKey, defectQtyKey, statusKey, memoKey, amountKey,
        totalExpected, totalActual, totalDiff, totalDefect, totalAmount, completeRate, issueRows,
        daily: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorRank: Object.values(vendorMap).filter(v=>v.name !== '거래처 미지정').sort((a,b)=>b.value-a.value),
        productRank: Object.values(productMap).filter(v=>v.name !== '품목 미지정').sort((a,b)=>b.qty-a.qty),
        statusRank: Object.values(statusMap).sort((a,b)=>b.qty-a.qty)
      };
    }

        <article class="card full"><div class="card-head"><div><div class="card-title">일별 입고 처리 흐름</div><div class="card-sub">실입고일 기준 수량 흐름</div></div><span class="badge">${a.dateKey || '날짜열 없음'}</span></div>${renderBarChart(a.daily, 'qty', 'label')}</article>
