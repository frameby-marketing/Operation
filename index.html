    function renderBarChart(data, valueKey, labelKey = 'date', options = {}) {
      const baseItems = options.hideZero ? data.filter(r => Number(r[valueKey] || 0) > 0) : data;
      const items = options.limit ? baseItems.slice(-options.limit) : baseItems;
      const max = Math.max(...items.map(r => Number(r[valueKey] || 0)), 1);

      if (!items.length) return '<div class="empty">차트로 표시할 데이터가 없습니다.</div>';

      return `<div class="simple-bar-scroll"><div class="simple-bar-chart ${items.length > 12 ? 'many' : ''}">${items.map(r => {
        const label = r.date ? `${r.date.getMonth()+1}/${r.date.getDate()}` : String(r[labelKey] || '-').slice(0, 10);
        const value = Number(r[valueKey] || 0);
        const height = value > 0 ? Math.max((value / max) * 100, 2) : 1;
        const issue = Number(r.missing || 0) + Number(r.misdelivery || 0);
        const issueHtml = issue > 0 ? `<div class="issue-marker" title="누락 ${fmt(r.missing || 0)}건 / 오배송 ${fmt(r.misdelivery || 0)}건">!</div>` : '';
        const issueText = issue > 0 ? `<div class="simple-bar-issue">문제 ${fmt(issue)}</div>` : '';
        return `
          <div class="simple-bar-col">
            <div class="simple-bar-wrap ${issue > 0 ? 'has-issue' : ''}">
              ${issueHtml}
              <div class="simple-bar ${Number.isFinite(options.dangerThreshold) && value > options.dangerThreshold ? 'danger-threshold' : ''}" style="height:${height}%"></div>
            </div>
            <div class="simple-bar-value">${fmt(value)}</div>
            ${issueText}
            <div class="simple-bar-label">${label}</div>
          </div>
        `;
      }).join('')}</div></div>`;
    }

    function renderPeriodComparisonChart(items, labels) {
      if (!items.length) return '<div class="empty">비교할 데이터가 없습니다.</div>';
      const formatValue = item => {
        if (item.type === 'rate') return v => `${Number(v || 0).toFixed(2)}%`;
        return v => `${fmt(v)}건`;
      };
      const formatDelta = (item, current, previous) => {
        const diff = current - previous;
        const direction = diff > 0 ? '증가' : diff < 0 ? '감소' : '동일';
        const sign = diff > 0 ? '+' : diff < 0 ? '-' : '';
        const rate = changeRate(current, previous);
        const deltaValue = item.type === 'rate'
          ? `${sign}${Math.abs(diff).toFixed(2)}%p`
          : `${sign}${fmt(Math.abs(Math.round(diff)))}건`;
        const tone = diff === 0 ? 'neutral' : item.lowerIsBetter ? (diff > 0 ? 'warn' : 'good') : (diff > 0 ? 'good' : 'warn');
        return { text: `직전 대비 ${deltaValue} / ${rate} ${direction}`, tone };
      };
      return `
        <div class="period-compare">
          <div class="period-compare-legend">
            <span><i class="period-compare-dot current"></i>${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>${labels.previous}</span>
          </div>
          ${items.map(item => {
            const current = Number(item.current || 0);
            const previous = Number(item.previous || 0);
            const localMax = Math.max(current, previous, 1);
            const currentWidth = current > 0 ? Math.max((current / localMax) * 100, 2) : 0;
            const previousWidth = previous > 0 ? Math.max((previous / localMax) * 100, 2) : 0;
            const display = formatValue(item);
            const delta = formatDelta(item, current, previous);
            return `
              <div class="period-compare-row">
                <div class="period-compare-label">${item.label}</div>
                <div class="period-compare-bars">
                  <div class="period-compare-track" title="${labels.current} ${display(current)}"><div class="period-compare-bar current" style="width:${currentWidth}%"></div></div>
                  <div class="period-compare-track" title="${labels.previous} ${display(previous)}"><div class="period-compare-bar previous" style="width:${previousWidth}%"></div></div>
                </div>
                <div class="period-compare-value">${display(current)}<div class="period-compare-sub">직전 ${display(previous)}</div><div class="period-compare-delta ${delta.tone}">${delta.text}</div></div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderVerticalPeriodComparisonChart(items, labels) {
      if (!items.length) return '<div class="empty">비교할 데이터가 없습니다.</div>';
      const displayValue = (item, value) => item.type === 'rate'
        ? `${Number(value || 0).toFixed(2)}%`
        : `${fmt(value)}${item.unit || '건'}`;
      const deltaInfo = (item, current, previous) => {
        const diff = current - previous;
        if (diff === 0) return { text: '동일 · 변화 없음', tone: 'neutral' };
        const direction = diff > 0 ? '증가' : '감소';
        const amount = item.type === 'rate'
          ? `${Math.abs(diff).toFixed(2)}%p`
          : `${fmt(Math.abs(Math.round(diff)))}${item.unit || '건'}`;
        const rate = previous ? `${Math.abs((diff / previous) * 100).toFixed(1)}%` : '신규';
        const tone = item.lowerIsBetter ? (diff > 0 ? 'warn' : 'good') : (diff > 0 ? 'good' : 'warn');
        return { text: `${amount} ${direction} · ${rate}`, tone };
      };
      return `
        <div class="period-vertical">
          <div class="period-vertical-legend">
            <span><i class="period-compare-dot current"></i>선택기간 · ${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>직전기간 · ${labels.previous}</span>
          </div>
          <div class="period-vertical-grid">
            ${items.map(item => {
              const current = Number(item.current || 0);
              const previous = Number(item.previous || 0);
              const localMax = Math.max(current, previous, 1);
              const maxBarHeight = 180;
              const currentHeight = current > 0 ? Math.max((current / localMax) * maxBarHeight, 4) : 0;
              const previousHeight = previous > 0 ? Math.max((previous / localMax) * maxBarHeight, 4) : 0;
              const delta = deltaInfo(item, current, previous);
              return `
                <div class="period-vertical-facet">
                  <div class="period-vertical-title">${item.label}</div>
                  <div class="period-vertical-delta ${delta.tone}">${delta.text}</div>
                  <div class="period-vertical-plot">
                    <div class="period-vertical-column">
                      <div class="period-vertical-value">${displayValue(item, current)}</div>
                      <div class="period-vertical-bar" style="height:${currentHeight}px" title="${labels.current} ${displayValue(item, current)}"></div>
                    </div>
                    <div class="period-vertical-column">
                      <div class="period-vertical-value">${displayValue(item, previous)}</div>
                      <div class="period-vertical-bar previous" style="height:${previousHeight}px" title="${labels.previous} ${displayValue(item, previous)}"></div>
                    </div>
                  </div>
                  <div class="period-vertical-axis"><span>현재</span><span>직전</span></div>
                  <div class="period-vertical-context">${item.context || ''}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderOverview() {
      const d = state.filteredShipping;
      const totalShip = d.reduce((s, r) => s + r.shipments, 0);
      const missing = d.reduce((s, r) => s + r.missing, 0);
      const mis = d.reduce((s, r) => s + r.misdelivery, 0);
      const issues = missing + mis;
      const avgBiz = d.filter(r => r.shipments > 0).length ? Math.round(totalShip / d.filter(r => r.shipments > 0).length) : 0;
      const maxDay = d.reduce((a, b) => b.shipments > a.shipments ? b : a, d[0] || { shipments: 0, dateText: '-' });

      const productionAnalysis = getProductionAnalysis('period', 'all');
      const productionObjects = productionAnalysis.objects;
      const productionDateKey = productionAnalysis.dateKey;
      const productionQtyKey = productionAnalysis.qtyKey;
      const productionDefectKey = [productionAnalysis.defectKey, productionAnalysis.disposalKey].filter(Boolean).join(' + ');
      const productionDateParseSamples = productionDateKey
        ? productionAnalysis.allObjects.slice(0, 5).map(o => o[productionDateKey]).filter(Boolean)
        : [];
      const productionTotal = productionAnalysis.totalQty;
      const productionDefect = productionAnalysis.totalDefect;
      const productionRate = productionAnalysis.defectRate;

      const paymentAnalysis = getPaymentAnalysis();
      const overviewPaymentModal = renderOverviewPaymentModal(paymentAnalysis);
      const coupangRows = state.raw.coupang || [];
      const coupangAnalysis = getCoupangAnalysis('period', { ignoreDate: true });
      const coupangTotal = coupangAnalysis.totalQty;
      const coupangSupplyTotal = coupangAnalysis.totalSupply;
      const coupangMainKey = coupangAnalysis.qtyKey;
      const coupangDateKey = coupangAnalysis.dateKey;
      const coupangObjects = coupangAnalysis.objects;
      grid(`
        ${metricCard('총 출고량','선택 기간 합계',fmt(totalShip),`출고일 기준 평균 ${fmt(avgBiz)}건`,'good',d.slice(-7).map(r=>r.shipments))}
        ${metricCard('누락 건수','선택 기간 합계',fmt(missing),`출고 대비 ${pct(missing,totalShip)}`,missing > 0 ? 'warn' : 'good',d.slice(-7).map(r=>r.missing))}
        ${metricCard('오배송 건수','선택 기간 합계',fmt(mis),`출고 대비 ${pct(mis,totalShip)}`,mis > 0 ? 'danger' : 'good',d.slice(-7).map(r=>r.misdelivery))}
        ${metricCard('문제율','누락+오배송 / 출고',`${fmt(issues)}건`,`${pct(issues,totalShip)} / 총 출고 ${fmt(totalShip)}건`,issues > 0 ? 'warn' : 'good',d.slice(-7).map(r=>r.missing+r.misdelivery))}
        ${clickableMetricCard('결제 예정 금액','선택 기간 내 예정일 기준',money(paymentAnalysis.scheduledKrwInPeriod),`${fmt(paymentAnalysis.scheduledPaymentsInPeriod.length)}건 예정 / 클릭 시 상세`,'warn',[paymentAnalysis.scheduledKrwInPeriod],`openOverviewPaymentDetail('scheduled')`)}
        ${clickableMetricCard('실제 결제 금액','선택 기간 내 결제 완료 기준',money(paymentAnalysis.paidKrwInPeriod),`${fmt(paymentAnalysis.paidPaymentsInPeriod.length)}건 결제 / 클릭 시 상세`,'good',[paymentAnalysis.paidKrwInPeriod],`openOverviewPaymentDetail('paid')`)}
        ${metricCard('총 제작수량','제작_일별 기준',fmt(productionTotal),productionQtyKey ? `${productionQtyKey} 합계` : '행 개수 기준','good',[productionTotal])}
        ${metricCard('불량 / 폐기','제작 품질 이슈',fmt(productionDefect),`불량·폐기율 ${productionRate}` ,productionDefect > 0 ? 'warn' : 'good',[productionDefect])}
        ${metricCard('쿠팡 판매','수량 + 공급가액 합계',`${fmt(coupangTotal)}개`,`공급가액 ${money(coupangSupplyTotal)}`,'good',coupangAnalysis.dated.slice(-7).map(r=>r.qty))}
        <article class="card three-quarter"><div class="card-head"><div><div class="card-title">일별 출고 흐름</div><div class="card-sub">선택 기간 전체 출고량 / 누락·오배송 발생일 표시</div></div><span class="badge">MAX ${fmt(maxDay.shipments)}</span></div>${renderBarChart(d,'shipments','date',{hideZero:true})}</article>
        <article class="card half"><div class="card-head"><div><div class="card-title">즉시 확인 필요</div><div class="card-sub">문제 발생 항목 요약</div></div><span class="badge ${issues > 0 ? 'warn' : ''}">${fmt(issues)}건</span></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">📦</div><div><strong>누락 발생</strong><span>${d.filter(r=>r.missing>0).length}일 발생</span></div><div class="issue-num">${fmt(missing)}</div></div>
          <div class="issue"><div class="issue-icon">🚚</div><div><strong>오배송 발생</strong><span>${d.filter(r=>r.misdelivery>0).length}일 발생</span></div><div class="issue-num">${fmt(mis)}</div></div>
          <div class="issue"><div class="issue-icon">📊</div><div><strong>최대 출고일</strong><span>${maxDay.dateText || dateStr(maxDay.date)}</span></div><div class="issue-num">${fmt(maxDay.shipments)}</div></div>
          <div class="issue"><div class="issue-icon">%</div><div><strong>문제율</strong><span>출고량 대비</span></div><div class="issue-num">${pct(issues,totalShip)}</div></div>
        </div></article>
        <article class="card half"><div class="card-head"><div><div class="card-title">제작 운영 현황</div><div class="card-sub">생산 / 불량 / 품질 기준</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">🏭</div><div><strong>총 제작수량</strong><span>${productionQtyKey || '자동 감지'} 기준</span></div><div class="issue-num">${fmt(productionTotal)}</div></div>
          <div class="issue"><div class="issue-icon">⚠️</div><div><strong>불량 / 폐기</strong><span>${productionDefectKey || '감지 안됨'}</span></div><div class="issue-num">${fmt(productionDefect)}</div></div>
          <div class="issue"><div class="issue-icon">%</div><div><strong>불량·폐기율</strong><span>(불량 + 폐기) ÷ 제작수량</span></div><div class="issue-num">${productionRate}</div></div>
          <div class="issue"><div class="issue-icon">📅</div><div><strong>기간 적용</strong><span>${productionDateKey || '날짜열 감지 안됨'}</span></div><div class="issue-num">${productionObjects.length}</div></div>
          <div class="issue"><div class="issue-icon">🔎</div><div><strong>감지 컬럼</strong><span>수량: ${productionQtyKey || '없음'} / 샘플: ${productionDateParseSamples[0] || '-'}</span></div><div class="issue-num">확인</div></div>
        </div></article>
        <article class="card half"><div class="card-head"><div><div class="card-title">쿠팡 판매 현황</div><div class="card-sub">기간별 판매 / 매출 기준</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">🛒</div><div><strong>쿠팡 판매수량</strong><span>${coupangMainKey || '자동 감지'} 기준</span></div><div class="issue-num">${fmt(coupangTotal)}개</div></div>
          <div class="issue"><div class="issue-icon">₩</div><div><strong>공급가액 합계</strong><span>쿠팡 판매 탭 계산 기준</span></div><div class="issue-num">${money(coupangSupplyTotal)}</div></div>
          <div class="issue"><div class="issue-icon">📅</div><div><strong>기간 적용</strong><span>${document.getElementById('periodLabel').textContent}</span></div><div class="issue-num">${fmt(coupangObjects.length)}</div></div>
          <div class="issue"><div class="issue-icon">📊</div><div><strong>데이터 상태</strong><span>쿠팡_판매 시트 연결</span></div><div class="issue-num">${coupangRows.length ? 'OK' : '확인'}</div></div>
        </div></article>
        <article class="card half"><div class="card-head"><div><div class="card-title">운영 섹션 연결 상태</div><div class="card-sub">구글시트 탭 기준 데이터 연결</div></div></div><div class="progress-block">${renderProgressHtml()}</div></article>
        ${overviewPaymentModal}
      `);
    }

    function shippingPeriodKey(date, mode) {
      if (!date) return '-';
      if (mode === 'monthly') return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
      if (mode === 'weekly') {
        const d = new Date(date);
        d.setHours(0,0,0,0);
        const day = d.getDay() || 7;
        d.setDate(d.getDate() + 4 - day);
        const yearStart = new Date(d.getFullYear(),0,1);
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        return `${d.getMonth()+1}월 ${weekNo}주차`;
      }
      return dateStr(date);
    }

    function groupShippingData(data, mode) {
      const map = {};
      data.forEach(r => {
        const key = shippingPeriodKey(r.date, mode);
        if (key === '-') return;
        if (!map[key]) map[key] = { label: key, date: r.date, shipments: 0, missing: 0, misdelivery: 0 };
        map[key].shipments += r.shipments;
        map[key].missing += r.missing;
        map[key].misdelivery += r.misdelivery;
      });
      return Object.values(map).sort((a,b)=>a.date-b.date);
    }

    function setShippingMode(value) {
      state.shippingView.mode = value;
      renderShipping();
    }

    function setShippingMonth(value) {
      state.shippingView.month = value;
      renderShipping();
    }

    function renderShipping() {
      const baseDate = todayDate();
      const ytdShipping = yearData(state.shipping, baseDate);
      let d = [...ytdShipping];
      const availableMonths = [...new Set(ytdShipping.map(r => `${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,'0')}`))].sort();
      if (!state.shippingView.month && availableMonths.length) state.shippingView.month = `${baseDate.getFullYear()}-${String(baseDate.getMonth()+1).padStart(2,'0')}`;
      if (state.shippingView.month) {
        d = ytdShipping.filter(r => `${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,'0')}` === state.shippingView.month);
      }
      const groupedShipping = groupShippingData(d, state.shippingView.mode);
      const thisMonth = sameMonthData(state.shipping, baseDate, 0);
      const prevMonth = sameMonthData(state.shipping, baseDate, -1);

      const sumShip = arr => arr.reduce((s, r) => s + r.shipments, 0);
      const sumMissing = arr => arr.reduce((s, r) => s + r.missing, 0);
      const sumMis = arr => arr.reduce((s, r) => s + r.misdelivery, 0);

      const totalShip = sumShip(ytdShipping);
      const missing = sumMissing(ytdShipping);
      const mis = sumMis(ytdShipping);
      const ytdIssues = missing + mis;
      const selectedShip = sumShip(d);
      const selectedMissing = sumMissing(d);
      const selectedMis = sumMis(d);
      const periodShipping = state.filteredShipping || [];
      const periodShip = sumShip(periodShipping);
      const periodMissing = sumMissing(periodShipping);
      const periodMis = sumMis(periodShipping);
      const periodIssues = periodMissing + periodMis;
      const periodRange = getCurrentPeriodRange();
      const previousPeriodRange = getPreviousPeriodRange(periodRange.start, periodRange.end);
      const previousPeriodShipping = filterShippingByRange(state.shipping, previousPeriodRange);
      const previousPeriodShip = sumShip(previousPeriodShipping);
      const previousPeriodMissing = sumMissing(previousPeriodShipping);
      const previousPeriodMis = sumMis(previousPeriodShipping);
      const previousPeriodIssues = previousPeriodMissing + previousPeriodMis;
      const periodMissingRate = periodShip ? periodMissing / periodShip : 0;
      const previousPeriodMissingRate = previousPeriodShip ? previousPeriodMissing / previousPeriodShip : 0;
      const periodMisRate = periodShip ? periodMis / periodShip : 0;
      const previousPeriodMisRate = previousPeriodShip ? previousPeriodMis / previousPeriodShip : 0;
      const periodLabelText = document.getElementById('periodLabel').textContent;
      const previousPeriodLabel = `${dateStr(previousPeriodRange.start)} ~ ${dateStr(previousPeriodRange.end)}`;
      const shippingComparisonLabels = { current: periodLabelText, previous: previousPeriodLabel };
      const shippingComparison = buildShippingPeriodComparison(periodRange, previousPeriodRange, periodShipping, previousPeriodShipping);
      const periodComparisonItems = [
        { label: '출고량', current: periodShip, previous: previousPeriodShip },
        { label: '누락률', current: periodMissingRate * 100, previous: previousPeriodMissingRate * 100, type: 'rate', lowerIsBetter: true },
        { label: '오배송률', current: periodMisRate * 100, previous: previousPeriodMisRate * 100, type: 'rate', lowerIsBetter: true },
        { label: '이슈건수', current: periodIssues, previous: previousPeriodIssues, lowerIsBetter: true }
      ];
      const monthShip = sumShip(thisMonth);
      const prevShip = sumShip(prevMonth);
      const monthMissingRate = monthShip ? sumMissing(thisMonth) / monthShip : 0;
      const prevMissingRate = prevShip ? sumMissing(prevMonth) / prevShip : 0;
      const monthMisRate = monthShip ? sumMis(thisMonth) / monthShip : 0;
      const prevMisRate = prevShip ? sumMis(prevMonth) / prevShip : 0;
      const rows = d.map(r => {
        const issue = r.missing + r.misdelivery;
        const status = issue === 0 ? '<span class="badge">정상</span>' : r.misdelivery > 0 ? '<span class="badge danger">오배송 확인</span>' : '<span class="badge warn">누락 확인</span>';
        return `<tr><td>${dateStr(r.date)}</td><td class="right">${fmt(r.shipments)}</td><td class="right">${fmt(r.missing)}</td><td class="right">${fmt(r.misdelivery)}</td><td>${status}</td></tr>`;
      }).join('');
      const commonCards = `
        ${viewToggle('shipping')}
        ${metricCard('올해 누적 출고량','택배_일별 YTD 기준',fmt(totalShip),`${baseDate.getFullYear()}년 전체 / 이번달 ${fmt(monthShip)}건`,'good',ytdShipping.slice(-7).map(r=>r.shipments))}
        ${metricCard('올해 누적 누락·오배송','택배_일별 YTD 품질 이슈',`${fmt(ytdIssues)}건`,`누락 ${fmt(missing)}건 / 오배송 ${fmt(mis)}건 / 문제율 ${pct(ytdIssues, totalShip)}`,ytdIssues > 0 ? 'warn' : 'good',ytdShipping.slice(-7).map(r=>r.missing+r.misdelivery))}
        ${metricCard('이번달 출고량','전월 대비',fmt(monthShip),`전월 ${fmt(prevShip)}건 / ${changeRate(monthShip, prevShip)}`,changeTone(monthShip, prevShip),thisMonth.slice(-7).map(r=>r.shipments))}
        ${metricCard('누락률','이번달 vs 전월',`${fmt(sumMissing(thisMonth))}건 · ${pct(sumMissing(thisMonth),monthShip)}`,`전월 ${fmt(sumMissing(prevMonth))}건 · ${pct(sumMissing(prevMonth),prevShip)} / ${changeRate(monthMissingRate, prevMissingRate)}`,changeTone(monthMissingRate, prevMissingRate, true),thisMonth.slice(-7).map(r=>r.missing))}
        ${metricCard('오배송률','이번달 vs 전월',`${fmt(sumMis(thisMonth))}건 · ${pct(sumMis(thisMonth),monthShip)}`,`전월 ${fmt(sumMis(prevMonth))}건 · ${pct(sumMis(prevMonth),prevShip)} / ${changeRate(monthMisRate, prevMisRate)}`,changeTone(monthMisRate, prevMisRate, true),thisMonth.slice(-7).map(r=>r.misdelivery))}
        ${metricCard('선택기간 출고량','직전 동일 기간 대비',fmt(periodShip),`${periodLabelText} / 직전 ${previousPeriodLabel} ${fmt(previousPeriodShip)}건 / ${changeRate(periodShip, previousPeriodShip)} · 누락 ${fmt(periodMissing)}건 · ${pct(periodMissing, periodShip)} / 오배송 ${fmt(periodMis)}건 · ${pct(periodMis, periodShip)}`,changeTone(periodShip, previousPeriodShip),periodShipping.slice(-7).map(r=>r.shipments))}
      `;
      const shippingSummaryIssues = shippingComparison.currentMissing + shippingComparison.currentMis;
      const shippingSummaryPending = shippingComparison.pendingCount > 0 || shippingComparison.futureCount > 0;
      const summaryCards = `
        ${viewToggle('shipping')}
        ${renderSummaryKpiCard({
          title: '출고량',
          sub: '선택기간 · 입력 완료일 기준',
          value: fmt(shippingComparison.currentShip),
          unit: '건',
          caption: `${periodLabelText} · 입력 완료 ${shippingComparison.completedCount}/${shippingComparison.requiredDays} 영업일`,
          tone: shippingSummaryPending ? 'warn' : 'good',
          badge: shippingSummaryPending ? '잠정 집계' : '집계 완료'
        })}
        ${renderSummaryKpiCard({
          title: '누락률',
          sub: '선택기간 출고 품질',
          value: pct(shippingComparison.currentMissing, shippingComparison.currentShip),
          caption: `누락 ${fmt(shippingComparison.currentMissing)}건 · 입력 완료일 기준`,
          tone: shippingComparison.currentMissing > 0 ? 'warn' : 'good',
          badge: shippingComparison.currentMissing > 0 ? '확인 필요' : '정상'
        })}
        ${renderSummaryKpiCard({
          title: '오배송률',
          sub: '선택기간 출고 품질',
          value: pct(shippingComparison.currentMis, shippingComparison.currentShip),
          caption: `오배송 ${fmt(shippingComparison.currentMis)}건 · 입력 완료일 기준`,
          tone: shippingComparison.currentMis > 0 ? 'danger' : 'good',
          badge: shippingComparison.currentMis > 0 ? '확인 필요' : '정상'
        })}
        ${renderSummaryKpiCard({
          title: '전체 이슈',
          sub: '누락 + 오배송',
          value: fmt(shippingSummaryIssues),
          unit: '건',
          caption: `문제율 ${pct(shippingSummaryIssues, shippingComparison.currentShip)}`,
          tone: shippingSummaryIssues > 0 ? 'warn' : 'good',
          badge: shippingSummaryIssues > 0 ? '관리 필요' : '정상'
        })}
        ${renderVolumeComparisonCard({
          title: '출고량 기간 비교',
          subtitle: '상단 KPI와 분리해 선택기간·직전기간 출고량만 비교',
          current: shippingComparison.currentShip,
          previous: shippingComparison.previousShip,
          unit: '건',
          labels: shippingComparisonLabels,
          currentMeta: `입력 완료 ${shippingComparison.completedCount}일`,
          previousMeta: `출고 입력일 ${shippingComparison.previousCompletedCount}일`,
          badge: shippingSummaryPending ? '잠정 비교' : '세로 막대',
          badgeTone: shippingSummaryPending ? 'warn' : '',
          statusItems: [
            { label: '입력 완료', value: `${shippingComparison.completedCount}일`, tone: 'complete' },
            { label: '미입력', value: `${shippingComparison.pendingCount}일`, tone: shippingComparison.pendingCount ? 'pending' : '' },
            { label: '주말·휴무', value: `${shippingComparison.closedCount}일` },
            ...(shippingComparison.futureCount ? [{ label: '예정', value: `${shippingComparison.futureCount}일` }] : [])
          ]
        })}
      `;
      if (state.viewMode.shipping === 'summary') {
        grid(`${summaryCards}

          <article class="card half"><div class="card-head"><div><div class="card-title">월별 출고 비교</div><div class="card-sub">올해 월별 출고량 비교</div></div></div>${renderBarChart(groupShippingData(yearData(state.shipping, baseDate),'monthly'),'shipments','label',{hideZero:true})}</article>
          <article class="card half"><div class="card-head"><div><div class="card-title">택배 이슈 요약</div><div class="card-sub">선택 월 누락/오배송 발생일</div></div></div><div class="issue-list">${d.filter(r=>r.missing+r.misdelivery>0).slice(-6).map(r=>`<div class="issue"><div class="issue-icon">!</div><div><strong>${dateStr(r.date)}</strong><span>누락 ${fmt(r.missing)}건 / 오배송 ${fmt(r.misdelivery)}건</span></div><div class="issue-num">${fmt(r.missing+r.misdelivery)}</div></div>`).join('') || '<div class="empty">선택 월 내 택배 이슈가 없습니다.</div>'}</div></article>
        `);
        return;
      }
      grid(`${commonCards}
        ${renderShippingDailyComparison(shippingComparison, shippingComparisonLabels)}
        <article class="card wide"><div class="card-head"><div><div class="card-title">택배 출고량 분석</div><div class="card-sub">일간 / 주간 / 월간 전환 및 특정 월 자동 집계</div></div><span class="badge">${state.shippingView.month || '전체'}</span></div>
          <div class="table-tools">
            <div class="tool-left">
              <select onchange="setShippingMode(this.value)">
                <option value="daily" ${state.shippingView.mode === 'daily' ? 'selected' : ''}>일간</option>
                <option value="weekly" ${state.shippingView.mode === 'weekly' ? 'selected' : ''}>주간</option>
                <option value="monthly" ${state.shippingView.mode === 'monthly' ? 'selected' : ''}>월간</option>
              </select>
              <input type="month" value="${state.shippingView.month}" onchange="setShippingMonth(this.value)" />
              <div class="pill">선택 월 전체 자동 집계</div>
            </div>
          </div>
          ${renderBarChart(groupedShipping,'shipments','label',{hideZero:true})}
        </article>

        <article class="card half"><div class="card-head"><div><div class="card-title">월별 출고 비교</div><div class="card-sub">올해 월별 출고량 비교</div></div></div>${renderBarChart(groupShippingData(yearData(state.shipping, baseDate),'monthly'),'shipments','label',{hideZero:true})}</article>
        <article class="card side"><div class="card-head"><div><div class="card-title">택배 이슈 요약</div><div class="card-sub">누락/오배송 집중 구간</div></div></div><div class="issue-list">
          ${d.filter(r=>r.missing+r.misdelivery>0).slice(-6).map(r=>`<div class="issue"><div class="issue-icon">!</div><div><strong>${dateStr(r.date)}</strong><span>누락 ${fmt(r.missing)}건 / 오배송 ${fmt(r.misdelivery)}건</span></div><div class="issue-num">${fmt(r.missing+r.misdelivery)}</div></div>`).join('') || '<div class="empty">선택 기간 내 택배 이슈가 없습니다.</div>'}
        </div></article>
        <article class="card full"><div class="card-head"><div><div class="card-title">일별 원본 데이터</div><div class="card-sub">택배_일별 시트 / 선택 월 ${fmt(selectedShip)}건 · 누락 ${fmt(selectedMissing)}건 · 오배송 ${fmt(selectedMis)}건</div></div></div><table><thead><tr><th>날짜</th><th class="right">출고수량</th><th class="right">누락건수</th><th class="right">오배송건수</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></article>
      `);
    }

    function genericTabConfig(tab) {
      const map = {
        production: { key: 'production', title: '제작 현황', icon: '🏭', primary: ['제작','생산','수량','완료','불량'], date: ['날짜','일자','제작일'] },
        payment: { key: 'payments', title: '결제 관리', icon: '💰', primary: ['금액','결제','잔금','예정','완료'], date: ['날짜','예정일','결제일'] },
        inbound: { key: 'inbound', title: '입고 예정', icon: '📥', primary: ['입고','수량','예정','지연','완료'], date: ['날짜','예정일','입고일'] },
        coupang: { key: 'coupang', title: '쿠팡 판매', icon: '🛒', primary: ['쿠팡','판매','출고','수량','매출','금액'], date: ['날짜','일자','판매일','출고일'] },
        reorder: { key: 'reorder', title: '발주관리', icon: '📦', primary: ['발주','재고','부족','필요','수량'], date: ['날짜','예상일','품절'] }
      };
      return map[tab];
    }

    function analyzeGeneric(rows, config) {
      const allObjects = rowsToObjects(rows);
      const headers = rows[0] || [];
      const dateKey = headers.find(h => config.date.some(k => String(h).replaceAll(' ', '').includes(k)));
      const latestProductionDate = (() => {
        const dates = allObjects.map(o => toDate(o[dateKey])).filter(Boolean);
        return dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : new Date();
      })();
      const objects = dateKey
        ? (scope === 'year'
            ? allObjects.filter(o => {
                const d = toDate(o[dateKey]);
                return d && d.getFullYear() === latestProductionDate.getFullYear();
              })
            : scope === 'previousPeriod'
              ? (() => {
                  const currentRange = getCurrentPeriodRange();
                  const previousRange = getPreviousPeriodRange(currentRange.start, currentRange.end);
                  return allObjects.filter(o => {
                    const d = toDate(o[dateKey]);
                    if (!d) return false;
                    const compare = new Date(d);
                    compare.setHours(0,0,0,0);
                    return compare >= previousRange.start && compare <= previousRange.end;
                  });
                })()
              : filterObjectsByDate(allObjects, dateKey))
        : allObjects;
      const numKeys = headers.filter(h => objects.some(o => toNum(o[h]) > 0));
      const mainKey = numKeys.find(h => config.primary.some(k => String(h).replaceAll(' ', '').includes(k))) || numKeys[0];
      const total = mainKey ? objects.reduce((s,o)=>s+toNum(o[mainKey]),0) : objects.length;
      const dated = objects.map(o => ({ raw:o, date: toDate(o[dateKey]), value: mainKey ? toNum(o[mainKey]) : 1, label: o[dateKey] || o[headers[0]] || '-' })).filter(x => x.date || x.value || x.label);
      return { objects, allObjects, headers, dateKey, mainKey, total, dated };
    }

    function findHeader(headers, keywords, exclude = []) {
      return headers.find(h => {
        const text = String(h || '').replaceAll(' ', '').toLowerCase();
        return keywords.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase())) &&
               !exclude.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase()));
      });
    }

    function normalizeCurrency(raw) {
      const text = String(raw || '').trim().toUpperCase();
      if (text.includes('RMB') || text.includes('CNY') || text.includes('위안') || text.includes('元') || text.includes('¥')) return 'RMB';
      return 'USD';
    }

    function paymentCurrency(o, currencyKey) {
      return normalizeCurrency(currencyKey ? o[currencyKey] : 'USD');
    }

    function getCoupangAnalysis(scope = 'ytd', options = {}) {
      const rows = state.raw.coupang || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);
      const activeFlowMode = options.flowMode || state.coupang.flowMode;

      const dateKey = findHeader(headers, ['날짜','일자','판매일','출고일','주문일','주문일자','매출일','정산일','date']);
      const qtyKey = findHeader(headers, ['판매수량','출고수량','수량','판매개수','개수']);
      const categoryKey = findHeader(headers, ['카테고리','분류','상품분류','제품군','품목군','카테고리명']);

      // 총액 컬럼과 단가 컬럼을 분리한다.
      // 쿠팡 시트에서 '공급가액'이 단가처럼 들어오는 경우가 있어, 공급가액은 단가 후보로 우선 처리한다.
      const supplyTotalKey =
        findHeader(headers, ['총공급가액','공급가액합계','공급금액','판매금액','매출금액','총매출','실매출','결제금액'], ['단가','매입']);
      const supplyUnitKey =
        findHeader(headers, ['공급가액','공급가','판매가','판매단가','단가'], ['총','합계','금액','매입']);

      const purchaseTotalKey =
        findHeader(headers, ['매입금액','매입가액합계','원가금액','총원가'], ['단가']);
      const purchaseUnitKey =
        findHeader(headers, ['매입가','원가','매입단가'], ['합계','금액']);

      const taxKey = findHeader(headers, ['세액','부가세','vat']);
      let productKey = findHeader(headers, ['상품명','상품','제품명','제품','품목명','품목','옵션명','옵션','sku','SKU','모델','관리코드','바코드']);

      if (!productKey) {
        productKey = headers.find(h => {
          const text = String(h || '').replaceAll(' ', '').toLowerCase();
          if (!text) return false;
          if (text.includes('날짜') || text.includes('일자') || text.includes('date')) return false;
          if (text.includes('수량') || text.includes('금액') || text.includes('가액') || text.includes('단가') || text.includes('세액')) return false;
          return allObjects.some(o => String(o[h] || '').trim() && Number.isNaN(Number(String(o[h]).replace(/,/g, ''))));
        });
      }

      const latestCoupangDate = todayDate();
      const sourceDates = dateKey ? allObjects.map(o => toDate(o[dateKey])).filter(Boolean) : [];
      const latestCoupangDataDate = sourceDates.length
        ? new Date(Math.max(...sourceDates.map(date => date.getTime())))
        : null;

      // 올해 누적 데이터는 상세 화면의 월별 장기 흐름에만 사용하고,
      // 요약 KPI·카테고리·원본 목록은 별도의 선택기간 분석값을 사용한다.
      const ytdObjects = dateKey
        ? allObjects.filter(o => {
            const d = toDate(o[dateKey]);
            return d && d.getFullYear() === latestCoupangDate.getFullYear();
          })
        : allObjects;

      const currentPeriodRange = getCurrentPeriodRange();
      const previousPeriodRange = getPreviousPeriodRange(currentPeriodRange.start, currentPeriodRange.end);
      const filterRange = (items, range) => dateKey
        ? items.filter(o => {
            const d = toDate(o[dateKey]);
            if (!d) return false;
            const compare = new Date(d);
            compare.setHours(0,0,0,0);
            return compare >= range.start && compare <= range.end;
          })
        : items;
      const filteredObjects = filterRange(allObjects, currentPeriodRange);
      const previousObjects = filterRange(allObjects, previousPeriodRange);
      const periodObjects = scope === 'period'
        ? filteredObjects
        : (scope === 'previous' ? previousObjects : ytdObjects);
      const periodDates = [...new Set(periodObjects.map(o => dateStr(toDate(o[dateKey]))).filter(d => d !== '-'))].sort();

      if (!options.ignoreDate && state.coupang.date && !periodDates.includes(state.coupang.date)) {
        state.coupang.date = '';
      }

      let objects = periodObjects;
      if (!options.ignoreDate && state.coupang.date && dateKey) {
        objects = objects.filter(o => dateStr(toDate(o[dateKey])) === state.coupang.date);
      }

      function rowQty(o) {
        return qtyKey ? toNum(o[qtyKey]) : 1;
      }

      function rowSupply(o) {
        if (supplyTotalKey) return toNum(o[supplyTotalKey]);
        if (supplyUnitKey) return toNum(o[supplyUnitKey]) * rowQty(o);
        return 0;
      }

      function rowPurchase(o) {
        if (purchaseTotalKey) return toNum(o[purchaseTotalKey]);
        if (purchaseUnitKey) return toNum(o[purchaseUnitKey]) * rowQty(o);
        return 0;
      }

      function rowTax(o) {
        if (taxKey) return toNum(o[taxKey]);
        return Math.round(rowSupply(o) * 0.1);
      }

      const basisKey = state.coupang.basis === 'purchase'
        ? (purchaseTotalKey || purchaseUnitKey || supplyTotalKey || supplyUnitKey)
        : (supplyTotalKey || supplyUnitKey || purchaseTotalKey || purchaseUnitKey);

      const totalQty = objects.reduce((s, o) => s + rowQty(o), 0);
      const totalSupply = objects.reduce((s, o) => s + rowSupply(o), 0);
      const totalPurchase = objects.reduce((s, o) => s + rowPurchase(o), 0);
      const totalTax = objects.reduce((s, o) => s + rowTax(o), 0);
      const totalBasis = state.coupang.basis === 'purchase' ? totalPurchase : totalSupply;

      const thisMonthObjects = ytdObjects.filter(o => {
        const d = toDate(o[dateKey]);
        return d && d.getFullYear() === latestCoupangDate.getFullYear() && d.getMonth() === latestCoupangDate.getMonth();
      });
      const prevMonthDate = new Date(latestCoupangDate.getFullYear(), latestCoupangDate.getMonth() - 1, 1);
      const prevMonthObjects = ytdObjects.filter(o => {
        const d = toDate(o[dateKey]);
        return d && d.getFullYear() === prevMonthDate.getFullYear() && d.getMonth() === prevMonthDate.getMonth();
      });

      const ytdTotalQty = ytdObjects.reduce((s, o) => s + rowQty(o), 0);
      const ytdTotalSupply = ytdObjects.reduce((s, o) => s + rowSupply(o), 0);
      const ytdTotalPurchase = ytdObjects.reduce((s, o) => s + rowPurchase(o), 0);
      const ytdTotalTax = ytdObjects.reduce((s, o) => s + rowTax(o), 0);
      const thisMonthQty = thisMonthObjects.reduce((s, o) => s + rowQty(o), 0);
      const thisMonthSupply = thisMonthObjects.reduce((s, o) => s + rowSupply(o), 0);
      const thisMonthPurchase = thisMonthObjects.reduce((s, o) => s + rowPurchase(o), 0);
      const prevMonthQty = prevMonthObjects.reduce((s, o) => s + rowQty(o), 0);
      const prevMonthSupply = prevMonthObjects.reduce((s, o) => s + rowSupply(o), 0);
      const prevMonthPurchase = prevMonthObjects.reduce((s, o) => s + rowPurchase(o), 0);

      function getFlowKey(date) {
        if (!date) return '-';
        if (activeFlowMode === 'monthly') {
          return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }
        if (activeFlowMode === 'weekly') {
          const temp = new Date(date);
          temp.setHours(0,0,0,0);
          const day = temp.getDay() || 7;
          temp.setDate(temp.getDate() + 4 - day);
          const yearStart = new Date(temp.getFullYear(),0,1);
          const weekNo = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
          const month = temp.getMonth() + 1;
          return `${month}월 ${weekNo}주차`;
        }
        return dateStr(date);
      }

      const groupedMap = {};
      objects.forEach(o => {
        const rowDate = toDate(o[dateKey]);
        const d = getFlowKey(rowDate);
        if (d === '-') return;

        if (!groupedMap[d]) {
          groupedMap[d] = { raw: o, date: rowDate, label: d, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }

        groupedMap[d].qty += rowQty(o);
        groupedMap[d].supply += rowSupply(o);
        groupedMap[d].purchase += rowPurchase(o);
        groupedMap[d].tax += rowTax(o);
      });

      const dated = Object.values(groupedMap)
        .sort((a,b) => a.date - b.date)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }));

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) {
          productMap[name] = { name, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }
        productMap[name].qty += rowQty(o);
        productMap[name].supply += rowSupply(o);
        productMap[name].purchase += rowPurchase(o);
        productMap[name].tax += rowTax(o);
      });

      const categoryMap = {};
      objects.forEach(o => {
        const name = categoryKey ? (String(o[categoryKey] || '').trim() || '카테고리 미지정') : '카테고리 미지정';
        if (!categoryMap[name]) {
          categoryMap[name] = { name, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }
        categoryMap[name].qty += rowQty(o);
        categoryMap[name].supply += rowSupply(o);
        categoryMap[name].purchase += rowPurchase(o);
        categoryMap[name].tax += rowTax(o);
      });

      const productRank = Object.values(productMap)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }))
        .sort((a, b) => b.value - a.value);

      const categoryRank = Object.values(categoryMap)
        .filter(r => r.name && r.name !== '카테고리 미지정')
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }))
        .sort((a, b) => b.value - a.value);

      const monthlyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!monthlyMap[key]) monthlyMap[key] = { label: key, date: new Date(d.getFullYear(), d.getMonth(), 1), qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        monthlyMap[key].qty += rowQty(o);
        monthlyMap[key].supply += rowSupply(o);
        monthlyMap[key].purchase += rowPurchase(o);
        monthlyMap[key].tax += rowTax(o);
      });

      const monthlyFlow = Object.values(monthlyMap)
        .sort((a,b) => a.date - b.date)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }));

      return {
        headers,
        allObjects,
        ytdObjects,
        periodObjects,
        objects,
        dateKey,
        qtyKey,
        supplyTotalKey,
        supplyUnitKey,
        purchaseTotalKey,
        purchaseUnitKey,
        taxKey,
        productKey,
        categoryKey,
        basisKey,
        flowMode: activeFlowMode,
        totalQty,
        totalBasis,
        totalSupply,
        totalPurchase,
        totalTax,
        ytdTotalQty,
        ytdTotalSupply,
        ytdTotalPurchase,
        ytdTotalTax,
        thisMonthQty,
        thisMonthSupply,
        thisMonthPurchase,
        prevMonthQty,
        prevMonthSupply,
        prevMonthPurchase,
        latestCoupangDate,
        latestCoupangDataDate,
        dates: periodDates,
        dated,
        monthlyFlow,
        productRank,
        categoryRank
      };
    }

    function renderProductRankChart(items, limit = 10) {
      const safeItems = Array.isArray(items) ? items : [];
      const top = safeItems.filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || 0), 1);
      if (!top.length) return '<div class="empty">품목 컬럼을 찾지 못했습니다. 쿠팡 기준 선택 카드의 감지 컬럼을 확인해 주세요.</div>';
      return `<div class="rank-chart">${top.map((r, i) => `
        <div class="rank-row">
          <div class="rank-name" title="${r.name}">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((r.value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${money(r.value)}</div>
          <div class="rank-qty">${fmt(r.qty)}개</div>
        </div>
      `).join('')}</div>`;
    }

    function compactKrw(value) {
      const amount = Number(value || 0);
      const abs = Math.abs(amount);
      if (abs >= 100000000) return `${(amount / 100000000).toLocaleString('ko-KR', { maximumFractionDigits: 1 })}억`;
      if (abs >= 10000) return `${(amount / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 })}만`;
      return `${fmt(amount)}원`;
    }

    function renderCoupangCategoryMetricToggle() {
      const metric = state.coupang.categoryMetric === 'amount' ? 'amount' : 'qty';
      return `<div class="category-metric-toggle" role="group" aria-label="카테고리 원형그래프 기준">
        <button type="button" class="${metric === 'qty' ? 'active' : ''}" aria-pressed="${metric === 'qty'}" onclick="setCoupangCategoryMetric('qty')">수량</button>
        <button type="button" class="${metric === 'amount' ? 'active' : ''}" aria-pressed="${metric === 'amount'}" onclick="setCoupangCategoryMetric('amount')">금액</button>
      </div>`;
    }

    function renderCategoryDonutChart(items, options = {}) {
      const colors = Array.isArray(options.colors) && options.colors.length
        ? options.colors
        : ['#22d3ee', '#5b7cfa', '#34d399', '#fbbf24', '#fb7185', '#a78bfa'];
      const metric = options.metric === 'amount' ? 'amount' : 'qty';
      const metricValue = item => metric === 'amount' ? toNum(item.value) : toNum(item.qty);
      const safeItems = (Array.isArray(items) ? items : [])
        .filter(r => r && String(r.name || '').trim() && metricValue(r) > 0)
        .map(r => ({ ...r, name: String(r.name).trim(), qty: toNum(r.qty), value: toNum(r.value), chartValue: metricValue(r) }))
        .sort((a, b) => b.chartValue - a.chartValue);

      if (!safeItems.length) {
        return `<div class="empty">${safeHtml(options.emptyMessage || '표시할 카테고리별 판매 데이터가 없습니다.')}</div>`;
      }

      const totalMetric = safeItems.reduce((sum, item) => sum + item.chartValue, 0);
      const limit = Math.max(Number(options.limit) || 5, 2);
      const shown = safeItems.slice(0, limit);
      const remainder = safeItems.slice(limit);
      if (remainder.length) {
        shown.push({
          name: `기타 ${remainder.length}개 카테고리`,
          qty: remainder.reduce((sum, item) => sum + item.qty, 0),
          value: remainder.reduce((sum, item) => sum + item.value, 0),
          chartValue: remainder.reduce((sum, item) => sum + item.chartValue, 0)
        });
      }

      let accumulated = 0;
      const gradient = shown.map((item, index) => {
        const start = accumulated;
        accumulated += (item.chartValue / totalMetric) * 100;
        const end = index === shown.length - 1 ? 100 : accumulated;
        return `${colors[index % colors.length]} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
      }).join(', ');
      const scopeLabel = safeHtml(options.scopeLabel || '판매수량');
      const amountLabel = safeHtml(options.amountLabel || '판매금액');
      const exactTotal = metric === 'amount' ? money(totalMetric) : `${fmt(totalMetric)}개`;
      const centerValue = metric === 'amount' ? compactKrw(totalMetric) : fmt(totalMetric);
      const centerLabel = metric === 'amount' ? `${amountLabel} 합계` : safeHtml(options.quantityLabel || '총 판매수량');

      return `
        <div class="category-donut">
          <div class="category-donut-visual">
            <div class="category-donut-ring" style="background:conic-gradient(${gradient});">
              <div class="category-donut-center">
                <span>${scopeLabel}</span>
                <strong title="${safeHtml(exactTotal)}">${safeHtml(centerValue)}</strong>
                <small>${centerLabel}</small>
              </div>
            </div>
          </div>
          <div class="category-donut-legend">
            ${shown.map((item, index) => `
              <div class="category-donut-row">
                <span class="category-donut-dot" style="background:${colors[index % colors.length]};color:${colors[index % colors.length]};"></span>
                <span class="category-donut-name" title="${safeHtml(item.name)}">${safeHtml(item.name)}</span>
                <span class="category-donut-stat"><strong>${metric === 'amount' ? money(item.chartValue) : `${fmt(item.chartValue)}개`}</strong><span>${((item.chartValue / totalMetric) * 100).toFixed(1)}%</span></span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCoupangFlowChart(items, options = {}) {
      const safeItems = Array.isArray(items) ? items : [];
      const maxMoney = Math.max(...safeItems.map(r => r.value || 0), 1);
      const maxQty = Math.max(...safeItems.map(r => r.qty || 0), 1);

      if (!safeItems.length) {
        return '<div class="empty">흐름 차트로 표시할 데이터가 없습니다.</div>';
      }

      const best = [...safeItems].sort((a,b) => b.value - a.value)[0];
      const total = safeItems.reduce((s,r) => s + r.value, 0);
      const totalQty = safeItems.reduce((s,r) => s + r.qty, 0);

      return `
        <div class="flow-wrap">
          <div class="flow-grid">
            <div></div><div></div><div></div><div></div><div></div>
          </div>
          
          <div class="flow-chart">${safeItems.map(r => {
            const barHeight = Math.max((r.value / maxMoney) * 100, 2);

              <div class="flow-col" ${options.clickFn ? `onclick="${options.clickFn}('${safeLabel}')" style="cursor:pointer;"` : ''}>

    function setCoupangMonthDetail(label) {
      state.coupang.selectedMonthDetail = label;
      renderCoupang();
    }

    function closeCoupangMonthDetail() {
      state.coupang.selectedMonthDetail = '';
      renderCoupang();
    }

    function renderCoupangMonthDetail(a) {
      const label = state.coupang.selectedMonthDetail;
      if (!label) return '';
      const rows = (a.ytdObjects || []).filter(o => {
        const d = toDate(o[a.dateKey]);
        if (!d) return false;
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === label;
      });

      const productMap = {};
      const categoryMap = {};
      rows.forEach(o => {
        const product = a.productKey ? (String(o[a.productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        const category = a.categoryKey ? (String(o[a.categoryKey] || '').trim() || '카테고리 미지정') : '카테고리 미지정';
        const qty = a.qtyKey ? toNum(o[a.qtyKey]) : 1;
        const supply = a.supplyTotalKey ? toNum(o[a.supplyTotalKey]) : (a.supplyUnitKey ? toNum(o[a.supplyUnitKey]) * qty : 0);
        const purchase = a.purchaseTotalKey ? toNum(o[a.purchaseTotalKey]) : (a.purchaseUnitKey ? toNum(o[a.purchaseUnitKey]) * qty : 0);
        const value = state.coupang.basis === 'purchase' ? purchase : supply;

        if (!productMap[product]) productMap[product] = { name: product, qty: 0, value: 0 };
        productMap[product].qty += qty;
        productMap[product].value += value;

        if (!categoryMap[category]) categoryMap[category] = { name: category, qty: 0, value: 0 };
        categoryMap[category].qty += qty;
        categoryMap[category].value += value;
      });

      const productRank = Object.values(productMap).sort((x,y)=>y.value-x.value);
      const categoryRank = Object.values(categoryMap).filter(r=>r.name !== '카테고리 미지정').sort((x,y)=>y.value-x.value);
      const totalQty = productRank.reduce((s,r)=>s+r.qty,0);
      const totalValue = productRank.reduce((s,r)=>s+r.value,0);

      return `
        <div class="modal-backdrop" onclick="closeCoupangMonthDetail()">
          <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div>
                <div class="card-title">${label} 쿠팡 출고 상세</div>
                <div class="card-sub">월별 그래프 금액이 어떤 품목/카테고리로 구성됐는지 확인합니다.</div>
              </div>
              <button class="modal-close" onclick="closeCoupangMonthDetail()">닫기</button>
            </div>
            <div class="flow-summary" style="margin-bottom:18px;">
              <div class="pill">총 판매수량 ${fmt(totalQty)}개</div>
              <div class="pill">총 금액 ${money(totalValue)}</div>
              <div class="pill">데이터 ${fmt(rows.length)}행</div>
            </div>
            <div class="grid" style="grid-template-columns:repeat(12,1fr);">
              <article class="card half"><div class="card-head"><div><div class="card-title">카테고리별 구성</div><div class="card-sub">선택 월 기준</div></div></div>${renderProductRankChart(categoryRank, 12)}</article>
              <article class="card half"><div class="card-head"><div><div class="card-title">품목별 구성</div><div class="card-sub">선택 월 기준</div></div></div>${renderProductRankChart(productRank, 12)}</article>
            </div>
          </div>
        </div>
      `;

        ${metricCard('판매 카테고리', '선택기간 판매수량 기준', `${fmt(periodA.categoryRank.length)}개`, topCategory ? `최다 ${topCategory.name} ${fmt(topCategory.qty)}개` : `최신 원본 데이터 ${latestDataText || '-'}`, periodA.categoryRank.length ? 'good' : 'warn', periodA.categoryRank.map(r => r.qty))}

        ${sizedMetricCard(metricCard('선택기간 공급가액', periodLabel, money(periodA.totalSupply), `직전 ${money(previousA.totalSupply)} / ${changeRate(periodA.totalSupply, previousA.totalSupply)}`, changeTone(periodA.totalSupply, previousA.totalSupply), [previousA.totalSupply, periodA.totalSupply]), 'third-kpi')}
        ${sizedMetricCard(metricCard('판매 데이터 입력일', `${fmt(selectedDays)}일 중 입력된 날짜`, `${fmt(periodA.dates.length)}일`, `일평균 ${periodAverageQty.toLocaleString('ko-KR', { maximumFractionDigits: 1 })}개 / 직전 ${fmt(previousA.dates.length)}일`, 'good', [previousA.dates.length, periodA.dates.length]), 'third-kpi')}
      `;
      if (state.viewMode.coupang === 'summary') {

          <article class="card wide"><div class="card-head"><div><div class="card-title">선택기간 쿠팡 판매 흐름</div><div class="card-sub">${basisLabel} / ${summaryFlowLabel} / ${periodLabel}</div></div><span class="badge">${fmt(periodA.dates.length)}일 데이터</span></div>${renderCoupangFlowChart(periodA.dated)}</article>

          <div class="table-tools">

                <option value="daily" ${state.coupang.flowMode === 'daily' ? 'selected' : ''}>일별</option>
                <option value="weekly" ${state.coupang.flowMode === 'weekly' ? 'selected' : ''}>주간</option>

        </article>

        <article class="card half"><div class="card-head"><div><div class="card-title">품목별 금액 순위</div><div class="card-sub">${basisLabel} / 선택기간 기준 상위 10개 품목</div></div><span class="badge">금액 큰 순</span></div>${renderProductRankChart(detailA.productRank, 10)}</article>

        <article class="card side"><div class="card-head"><div><div class="card-title">쿠팡 기준 선택</div><div class="card-sub">선택기간 내 날짜 / 금액 기준 전환</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">📅</div><div><strong>선택기간 내 날짜</strong><span>${detailA.dateKey || '날짜열 감지 안됨'}</span></div><div></div></div>
          <select id="coupangDateSelect" onchange="setCoupangDate(this.value)">${dateOptions}</select>
          <div class="issue"><div class="issue-icon">₩</div><div><strong>금액 기준</strong><span>공급가 / 매입가 전환</span></div><div></div></div>
          <select id="coupangBasisSelect" onchange="setCoupangBasis(this.value)">
            <option value="supply" ${state.coupang.basis === 'supply' ? 'selected' : ''}>공급가 기준</option>
            <option value="purchase" ${state.coupang.basis === 'purchase' ? 'selected' : ''}>매입가 기준</option>
          </select>
          <div class="issue"><div class="issue-icon">🔎</div><div><strong>감지 컬럼</strong><span>수량: ${detailA.qtyKey || '-'} / 공급: ${detailA.supplyTotalKey || detailA.supplyUnitKey || '-'} / 매입: ${detailA.purchaseTotalKey || detailA.purchaseUnitKey || '-'}</span></div><div class="issue-num">확인</div></div>
          <div class="issue"><div class="issue-icon">🏷️</div><div><strong>카테고리</strong><span>${detailA.categoryKey || '카테고리 컬럼 감지 안됨'}</span></div><div class="issue-num">${fmt(detailA.categoryRank.length)}</div></div>
        </div></article>

        <article class="card full"><div class="card-head"><div><div class="card-title">쿠팡 원본 데이터 전체 보기</div><div class="card-sub">선택기간 ${fmt(periodA.objects.length)}행 / 현재 표시 ${fmt(detailA.objects.length)}행 / 페이지당 ${fmt(state.coupang.pageSize)}행</div></div></div>
          <div class="table-tools">

                <option value="30" ${state.coupang.pageSize === 30 ? 'selected' : ''}>30개씩</option>
                <option value="50" ${state.coupang.pageSize === 50 ? 'selected' : ''}>50개씩</option>
                <option value="100" ${state.coupang.pageSize === 100 ? 'selected' : ''}>100개씩</option>

          </div>

          <div class="pagination">

      `);

    function paymentObjectsForVendorFlow(a, periodLabel) {
      const selected = state.payment.selectedVendor;
      return (a.paymentObjects || []).filter(o => {
        const d = toDate(o[a.dateKey]);
        if (!d) return false;
        const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const key = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(d);
        const vendor = a.vendorKey ? (o[a.vendorKey] || '거래처 미지정') : '거래처 미지정';
        return key === periodLabel && (selected === 'all' || vendor === selected);
      }).sort((x,y)=>toDate(x[a.dateKey])-toDate(y[a.dateKey]));
    }

    function normalizeProductionRows(rows) {
      const rawHeaders = rows[0] || [];
      const dateLabels = ['날짜','일자','제작일','생산일','작업일','등록일','date'];
      const blockStarts = rawHeaders.reduce((starts, header, index) => {
        const normalized = String(header || '').replaceAll(' ', '').toLowerCase();
        if (dateLabels.includes(normalized)) starts.push(index);
        return starts;
      }, []);

      // 일반적인 세로형 표는 기존 방식으로 읽고, 같은 헤더가 가로로 반복될 때만
      // 각 블록을 독립적인 행 데이터로 변환한다.
      if (blockStarts.length <= 1) {
        return {
          headers: rawHeaders.filter(h => String(h || '').trim()),
          objects: rowsToObjects(rows),
          blockCount: rawHeaders.length ? 1 : 0
        };
      }

      const headers = [];
      const objects = [];
      blockStarts.forEach((start, blockIndex) => {
        const nextStart = blockStarts[blockIndex + 1] ?? rawHeaders.length;
        let end = nextStart;
        while (end > start && !String(rawHeaders[end - 1] || '').trim()) end--;
        const blockHeaders = rawHeaders.slice(start, end).map(h => String(h || '').trim());
        blockHeaders.forEach(h => { if (h && !headers.includes(h)) headers.push(h); });

        rows.slice(1).forEach(row => {
          const object = {};
          let hasData = false;
          blockHeaders.forEach((header, offset) => {
            if (!header) return;
            const value = row[start + offset] ?? '';
            object[header] = value;
            if (String(value).trim()) hasData = true;
          });
          const hasIdentity = dateLabels.some(label => String(object[headers.find(h => String(h).replaceAll(' ', '').toLowerCase() === label)] || '').trim()) ||
            String(object['품목'] || object['제품명'] || object['상품명'] || '').trim();
          if (hasData && hasIdentity) objects.push(object);
        });
      });

      return { headers, objects, blockCount: blockStarts.length };
    }

    function getProductionAnalysis(scope = 'period', productFilter = state.production.selectedProduct || 'all') {
      const rows = state.raw.production || [];
      const normalized = normalizeProductionRows(rows);
      const headers = normalized.headers;
      const allObjects = normalized.objects;

      const dateKey = findHeader(headers, ['날짜','일자','제작일','생산일','작업일','등록일','date']);
      const productKey = findHeader(headers, ['상품명','제품명','품목명','품목','모델','옵션','sku','SKU','제품']);
      const workerKey = findHeader(headers, ['작업자','담당자','생산자','작업인원','직원']);
      const qtyKey = findHeader(headers, ['제작수량','생산수량','완성수량','완료수량','양품수량','수량']);
      const goodKey = findHeader(headers, ['양품수량','정상수량','완료수량','양품']);
      const defectKey = findHeader(headers, ['불량수량','불량량','NG수량','불량','NG'], ['폐기','사유','율']);
      const disposalKey = findHeader(headers, ['폐기수량','폐기량','폐기개수','폐기'], ['사유','율']);
      const reasonKey = findHeader(headers, ['불량사유','폐기사유','원인','이슈','비고','메모']);
      const targetKey = findHeader(headers, ['목표수량','목표','계획수량','계획']);

      const latestProductionDate = todayDate();

      const scopedObjects = dateKey
        ? (scope === 'year'
            ? allObjects.filter(o => {
                const d = toDate(o[dateKey]);
                return d && d.getFullYear() === latestProductionDate.getFullYear();
              })
            : scope === 'previousPeriod'
              ? (() => {
                  const currentRange = getCurrentPeriodRange();
                  const previousRange = getPreviousPeriodRange(currentRange.start, currentRange.end);
                  return allObjects.filter(o => {
                    const d = toDate(o[dateKey]);
                    if (!d) return false;
                    const compare = new Date(d);
                    compare.setHours(0,0,0,0);
                    return compare >= previousRange.start && compare <= previousRange.end;
                  });
                })()
              : filterObjectsByDate(allObjects, dateKey))
        : allObjects;

      const availableProducts = productKey
        ? [...new Set(allObjects.map(o => String(o[productKey] || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ko'))
        : [];
      if (productFilter !== 'all' && !availableProducts.includes(productFilter)) {
        productFilter = 'all';
      }
      const selectedProduct = productFilter || 'all';
      const objects = selectedProduct === 'all' || !productKey
        ? scopedObjects
        : scopedObjects.filter(o => String(o[productKey] || '').trim() === selectedProduct);

      function rowQty(o) {
        if (qtyKey) return toNum(o[qtyKey]);
        if (goodKey || defectKey) return toNum(o[goodKey]) + toNum(o[defectKey]);
        return 1;
      }

      function rowGood(o) {
        if (goodKey) return toNum(o[goodKey]);
        return Math.max(rowQty(o) - rowDefect(o), 0);
      }

      function rowDefect(o) {
        return (defectKey ? toNum(o[defectKey]) : 0) + (disposalKey ? toNum(o[disposalKey]) : 0);
      }

      function rowTarget(o) {
        return targetKey ? toNum(o[targetKey]) : 0;
      }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalGood = objects.reduce((s,o)=>s+rowGood(o),0);
      const totalDefect = objects.reduce((s,o)=>s+rowDefect(o),0);
      const totalTarget = objects.reduce((s,o)=>s+rowTarget(o),0);
      const goodRate = totalQty ? pct(totalGood, totalQty) : '0.00%';
      const defectRate = totalQty ? pct(totalDefect, totalQty) : '0.00%';
      const defectRateNumber = totalQty ? (totalDefect / totalQty) * 100 : 0;
      const defectGoalRates = targetKey
        ? objects.map(o => String(o[targetKey] || '').match(/(\d+(?:\.\d+)?)\s*%/)).filter(Boolean).map(match => Number(match[1]))
        : [];
      const defectGoalRate = defectGoalRates.length ? defectGoalRates[0] : null;
      const defectGoalText = defectGoalRate == null ? '목표 미설정' : `${defectGoalRate}% 미만`;
      const defectGoalPassed = defectGoalRate == null ? null : defectRateNumber < defectGoalRate;
      const defectGoalLabel = defectGoalPassed == null ? '목표 미설정' : (defectGoalPassed ? '목표 달성' : '관리 필요');
      const targetRate = defectGoalLabel;

      const dailyMap = {};
      objects.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!dailyMap[d]) dailyMap[d] = { label: d, date: toDate(o[dateKey]), qty: 0, good: 0, defect: 0, target: 0, value: 0 };
        dailyMap[d].qty += rowQty(o);
        dailyMap[d].good += rowGood(o);
        dailyMap[d].defect += rowDefect(o);
        dailyMap[d].target += rowTarget(o);
        dailyMap[d].value += rowQty(o);
      });
      const daily = Object.values(dailyMap).sort((a,b)=>a.date-b.date);

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty: 0, good: 0, defect: 0, value: 0 };
        productMap[name].qty += rowQty(o);
        productMap[name].good += rowGood(o);
        productMap[name].defect += rowDefect(o);
        productMap[name].value += rowQty(o);
      });
      const productRank = Object.values(productMap).sort((a,b)=>b.qty-a.qty);

      const workerMap = {};
      objects.forEach(o => {
        const name = workerKey ? (String(o[workerKey] || '').trim() || '작업자 미지정') : '작업자 미지정';
        if (!workerMap[name]) workerMap[name] = { name, qty: 0, defect: 0, value: 0 };
        workerMap[name].qty += rowQty(o);
        workerMap[name].defect += rowDefect(o);
        workerMap[name].value += rowQty(o);
      });
      const workerRank = Object.values(workerMap).sort((a,b)=>b.qty-a.qty);

      const reasonMap = {};
      objects.forEach(o => {
        const defect = rowDefect(o);
        if (!defect) return;
        const reason = reasonKey ? (String(o[reasonKey] || '').trim() || '사유 미기재') : '사유 미기재';
        if (!reasonMap[reason]) reasonMap[reason] = { name: reason, qty: 0, value: 0 };
        reasonMap[reason].qty += defect;
        reasonMap[reason].value += defect;
      });
      const reasonRank = Object.values(reasonMap).sort((a,b)=>b.qty-a.qty);

      return {
        headers,
        allObjects,
        objects,
        dateKey,
        productKey,
        workerKey,
        qtyKey,
        goodKey,
        defectKey,
        disposalKey,
        reasonKey,
        targetKey,
        blockCount: normalized.blockCount,
        availableProducts,
        selectedProduct,
        totalQty,
        totalGood,
        totalDefect,
        totalTarget,
        goodRate,
        defectRate,
        targetRate,
        defectRateNumber,
        defectGoalRate,
        defectGoalText,
        defectGoalPassed,
        defectGoalLabel,
        daily,
        productRank,
        workerRank,
        reasonRank
      };
    }

    function renderProductionRank(items, valueLabel = '개', limit = 8) {
      const top = (items || []).filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || r.qty || 0), 1);
      if (!top.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';
      return `<div class="rank-chart">${top.map((r, i) => {
        const value = r.value || r.qty || 0;
        return `<div class="rank-row">
          <div class="rank-name" title="${r.name}">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${fmt(value)}${valueLabel}</div>
          <div class="rank-qty">${r.defect ? `불량 ${fmt(r.defect)}` : ''}</div>
        </div>`;
      }).join('')}</div>`;
    }

    function getProductionCategoryTotals(analysis) {
      return (analysis.productRank || []).reduce((totals, item) => {
        const name = String(item.name || '').replaceAll(' ', '').toLowerCase();
        const qty = Number(item.qty || item.value || 0);
        if (name.includes('프레임')) totals.frame += qty;
        else if (name.includes('맥세이프') || name.includes('magsafe')) totals.magsafe += qty;
        else totals.other += qty;
        return totals;
      }, { magsafe: 0, frame: 0, other: 0 });
    }

    function buildProductionPeriodComparison(currentAnalysis, previousAnalysis, currentRange, previousRange) {
      const currentMap = new Map((currentAnalysis.daily || []).map(row => [dateStr(row.date), row]));
      const previousMap = new Map((previousAnalysis.daily || []).map(row => [dateStr(row.date), row]));
      const days = Math.max(1, previousRange.days || 1);
      const pairs = [];

      for (let index = 0; index < days; index++) {
        const currentDate = new Date(currentRange.start);
        currentDate.setHours(0,0,0,0);
        currentDate.setDate(currentDate.getDate() + index);
        const previousDate = new Date(previousRange.start);
        previousDate.setHours(0,0,0,0);
        previousDate.setDate(previousDate.getDate() + index);
        pairs.push({
          currentDate,
          previousDate,
          current: currentMap.get(dateStr(currentDate)) || null,
          previous: previousMap.get(dateStr(previousDate)) || null
        });
      }

      const currentDays = (currentAnalysis.daily || []).length;
      const previousDays = (previousAnalysis.daily || []).length;
      return {
        pairs,
        days,
        currentDays,
        previousDays,
        currentAvg: currentDays ? currentAnalysis.totalQty / currentDays : 0,
        previousAvg: previousDays ? previousAnalysis.totalQty / previousDays : 0,
        categories: getProductionCategoryTotals(currentAnalysis)
      };
    }

    function productionAverageText(value) {
      return Number(value || 0).toLocaleString('ko-KR', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
    }

          <div class="shipping-hero-grid">

                <div class="shipping-progress-top"><span>양품 ${fmt(current.totalGood)}개</span><span>불량·폐기 ${fmt(current.totalDefect)}개</span></div>
                <div class="shipping-progress-track"><div class="shipping-progress-fill" style="width:${current.totalQty ? Math.min((current.totalGood / current.totalQty) * 100, 100) : 0}%"></div></div>
              </div>

              <div class="shipping-match-title">직전기간 제작량 비교</div>
              <div class="shipping-match-sub">동일한 ${comparison.days}일 길이의 기간 비교</div>
              <div class="shipping-match-values"><strong>${fmt(current.totalQty)}</strong><span>vs</span><b>${fmt(previous.totalQty)}</b><span>개</span></div>
              <div class="shipping-delta ${deltaTone}">${deltaText}</div>
              <div class="shipping-match-sub" style="margin-top:10px;">직전 ${labels.previous} · 제작일 ${comparison.previousDays}일</div>

            <div class="shipping-status"><span>일평균 제작</span><strong>${productionAverageText(comparison.currentAvg)}개</strong></div>
            <div class="shipping-status"><span>맥세이프 케이스</span><strong>${fmt(comparison.categories.magsafe)}개</strong></div>
            <div class="shipping-status"><span>프레임 케이스</span><strong>${fmt(comparison.categories.frame)}개</strong></div>
          </div>
        </article>`;
    }

    function renderProductionQualitySummary(current, previous) {
      const currentGoodRate = current.totalQty ? current.totalGood / current.totalQty : 0;
      const previousGoodRate = previous.totalQty ? previous.totalGood / previous.totalQty : 0;
      const currentDefectRate = current.totalQty ? current.totalDefect / current.totalQty : 0;
      const previousDefectRate = previous.totalQty ? previous.totalDefect / previous.totalQty : 0;
      const qualityTone = (now, before, lowerIsBetter = false) => {
        if (now === before) return 'neutral';
        if (lowerIsBetter) return now < before ? 'good' : 'warn';
        return now > before ? 'good' : 'warn';
      };
      const qualityRows = [
        { label:'양품률', current:pct(current.totalGood, current.totalQty), previous:pct(previous.totalGood, previous.totalQty), delta:changeRate(currentGoodRate, previousGoodRate), tone:qualityTone(currentGoodRate, previousGoodRate) },
        { label:'불량·폐기율', current:pct(current.totalDefect, current.totalQty), previous:pct(previous.totalDefect, previous.totalQty), delta:changeRate(currentDefectRate, previousDefectRate), tone:qualityTone(currentDefectRate, previousDefectRate, true) },
        { label:'불량·폐기', current:`${fmt(current.totalDefect)}개`, previous:`${fmt(previous.totalDefect)}개`, delta:changeRate(current.totalDefect, previous.totalDefect), tone:qualityTone(current.totalDefect, previous.totalDefect, true) }
      ];
      const goalClass = current.defectGoalPassed === false ? 'warn' : '';
      return `
        <article class="card side">
          <div class="card-head"><div><div class="card-title">제작 품질 요약</div><div class="card-sub">선택기간 양품·불량·폐기 기준</div></div><span class="badge ${goalClass}">${current.defectGoalLabel}</span></div>
          <div class="shipping-quality-list">${qualityRows.map(row => `
            <div class="shipping-quality-row">
              <div class="shipping-quality-top"><span>${row.label}</span><strong>${row.current}</strong></div>
              <div class="shipping-quality-sub"><span>직전 ${row.previous}</span><b class="${row.tone}">${row.delta}</b></div>
            </div>`).join('')}
          </div>
          <div class="shipping-quality-note">품질 목표 ${current.defectGoalText} · 제작수량이 없는 날짜는 불량률 계산에 포함하지 않습니다.</div>
        </article>`;
    }

    function renderProductionDailyComparison(comparison, labels) {
      const values = comparison.pairs.flatMap(pair => [Number(pair.current?.qty || 0), Number(pair.previous?.qty || 0)]);
      const max = Math.max(...values, 1);

        <article class="card full">
          <div class="card-head"><div><div class="card-title">일별 제작량 비교</div><div class="card-sub">선택기간과 직전 동일 길이 기간의 제작량을 날짜 순서대로 비교</div></div><span class="badge">세로 막대</span></div>
          <div class="period-vertical-legend">
            <span><i class="period-compare-dot current"></i>선택기간 · ${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>직전기간 · ${labels.previous}</span>
            <span>데이터가 없는 날은 ‘제작 없음’으로 표시</span>

          <div class="shipping-day-scroll"><div class="shipping-day-grid" style="grid-template-columns:repeat(${comparison.pairs.length},minmax(118px,1fr));min-width:max(100%,${chartMinWidth}px);">
            ${comparison.pairs.map(pair => {
              const currentQty = Number(pair.current?.qty || 0);
              const previousQty = Number(pair.previous?.qty || 0);
              const currentDefect = Number(pair.current?.defect || 0);
              const currentHeight = currentQty > 0 ? Math.max((currentQty / max) * 100, 3) : 0;
              const previousHeight = previousQty > 0 ? Math.max((previousQty / max) * 100, 3) : 0;
              const currentVisual = pair.current
                ? `<span class="shipping-day-value">${fmt(currentQty)}</span><div class="shipping-day-bar" style="height:${currentHeight}%"></div>`
                : '<div class="shipping-day-placeholder">제작 없음</div>';
              const previousVisual = pair.previous
                ? `<span class="shipping-day-value">${fmt(previousQty)}</span><div class="shipping-day-bar previous" style="height:${previousHeight}%"></div>`
                : '<div class="shipping-day-placeholder">제작 없음</div>';
              return `<div class="shipping-day-group">
                <div class="shipping-day-head"><strong>${shippingShortDate(pair.currentDate)}</strong><span>${shippingDayName(pair.currentDate)}요일</span></div>
                <div class="shipping-day-plot"><div class="shipping-day-col">${currentVisual}</div><div class="shipping-day-col">${previousVisual}</div></div>
                <div class="shipping-day-axis"><span>선택</span><span>직전</span></div>
                <div class="shipping-day-status ${pair.current ? 'complete' : ''}">${pair.current ? `제작 ${fmt(currentQty)}개` : '제작 없음'}</div>
                <div class="production-day-issue">${currentDefect ? `불량·폐기 ${fmt(currentDefect)}개` : ''}</div>
                <div class="shipping-day-prev">직전 ${shippingShortDate(pair.previousDate)}</div>
              </div>`;
            }).join('')}
          </div></div>
        </article>`;
