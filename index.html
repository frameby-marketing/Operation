        <article class="card side"><div class="card-head"><div><div class="card-title">택배 이슈 요약</div><div class="card-sub">누락/오배송 집중 구간</div></div></div><div class="issue-list">
          ${d.filter(r=>r.missing+r.misdelivery>0).slice(-6).map(r=>`<div class="issue"><div class="issue-icon">!</div><div><strong>${dateStr(r.date)}</strong><span>누락 ${fmt(r.missing)}건 / 오배송 ${fmt(r.misdelivery)}건</span></div><div class="issue-num">${fmt(r.missing+r.misdelivery)}</div></div>`).join('') || '<div class="empty">선택 기간 내 택배 이슈가 없습니다.</div>'}
        </div></article>
        <article class="card full"><div class="card-head"><div><div class="card-title">일별 원본 데이터</div><div class="card-sub">택배_일별 시트 / 선택 월 ${fmt(selectedShip)}건 · 누락 ${fmt(selectedMissing)}건 · 오배송 ${fmt(selectedMis)}건</div></div></div><table><thead><tr><th>날짜</th><th class="right">출고수량</th><th class="right">누락건수</th><th class="right">오배송건수</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></article>
      `);
    }

    function genericTabConfig(tab) {
      const map = {
        production: { key: 'production', title: '제작 현황', icon: '🏭', primary: ['제작','생산','수량','완료','불량'], date: ['날짜','일자','제작일'] },
        payment: { key: 'payments', title: '결제 관리', icon: '💰', primary: ['금액','결제','잔금','예정','완료'], date: ['날짜','예정일','결제일'] },
        inbound: { key: 'inbound', title: '입고 예정', icon: '📥', primary: ['입고','수량','예정','지연','완료'], date: ['날짜','예정일','입고일'] },
        coupang: { key: 'coupang', title: '쿠팡 판매', icon: '🛒', primary: ['쿠팡','판매','출고','수량','매출','금액'], date: ['날짜','일자','판매일','출고일'] },
        reorder: { key: 'reorder', title: '발주관리', icon: '📦', primary: ['발주','재고','부족','필요','수량'], date: ['날짜','예상일','품절'] }
      };
      return map[tab];
    }

    function analyzeGeneric(rows, config) {
      const allObjects = rowsToObjects(rows);
      const headers = rows[0] || [];
      const dateKey = headers.find(h => config.date.some(k => String(h).replaceAll(' ', '').includes(k)));
      const latestProductionDate = (() => {
        const dates = allObjects.map(o => toDate(o[dateKey])).filter(Boolean);
        return dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : new Date();
      })();
      const objects = dateKey
        ? (scope === 'year'
            ? allObjects.filter(o => {
                const d = toDate(o[dateKey]);
                return d && d.getFullYear() === latestProductionDate.getFullYear();
              })
            : scope === 'previousPeriod'
              ? (() => {
                  const currentRange = getCurrentPeriodRange();
                  const previousRange = getPreviousPeriodRange(currentRange.start, currentRange.end);
                  return allObjects.filter(o => {
                    const d = toDate(o[dateKey]);
                    if (!d) return false;
                    const compare = new Date(d);
                    compare.setHours(0,0,0,0);
                    return compare >= previousRange.start && compare <= previousRange.end;
                  });
                })()
              : filterObjectsByDate(allObjects, dateKey))
        : allObjects;
      const numKeys = headers.filter(h => objects.some(o => toNum(o[h]) > 0));
      const mainKey = numKeys.find(h => config.primary.some(k => String(h).replaceAll(' ', '').includes(k))) || numKeys[0];
      const total = mainKey ? objects.reduce((s,o)=>s+toNum(o[mainKey]),0) : objects.length;
      const dated = objects.map(o => ({ raw:o, date: toDate(o[dateKey]), value: mainKey ? toNum(o[mainKey]) : 1, label: o[dateKey] || o[headers[0]] || '-' })).filter(x => x.date || x.value || x.label);
      return { objects, allObjects, headers, dateKey, mainKey, total, dated };
    }

    function findHeader(headers, keywords, exclude = []) {
      return headers.find(h => {
        const text = String(h || '').replaceAll(' ', '').toLowerCase();
        return keywords.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase())) &&
               !exclude.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase()));
      });
    }

    function normalizeCurrency(raw) {
      const text = String(raw || '').trim().toUpperCase();
      if (text.includes('RMB') || text.includes('CNY') || text.includes('위안') || text.includes('元') || text.includes('¥')) return 'RMB';
      return 'USD';
    }

    function paymentCurrency(o, currencyKey) {
      return normalizeCurrency(currencyKey ? o[currencyKey] : 'USD');
    }

    function getCoupangAnalysis(scope = 'ytd') {
      const rows = state.raw.coupang || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['날짜','일자','판매일','출고일','주문일','주문일자','매출일','정산일','date']);
      const qtyKey = findHeader(headers, ['판매수량','출고수량','수량','판매개수','개수']);
      const categoryKey = findHeader(headers, ['카테고리','분류','상품분류','제품군','품목군','카테고리명']);

      // 총액 컬럼과 단가 컬럼을 분리한다.
      // 쿠팡 시트에서 '공급가액'이 단가처럼 들어오는 경우가 있어, 공급가액은 단가 후보로 우선 처리한다.
      const supplyTotalKey =
        findHeader(headers, ['총공급가액','공급가액합계','공급금액','판매금액','매출금액','총매출','실매출','결제금액'], ['단가','매입']);
      const supplyUnitKey =
        findHeader(headers, ['공급가액','공급가','판매가','판매단가','단가'], ['총','합계','금액','매입']);

      const purchaseTotalKey =
        findHeader(headers, ['매입금액','매입가액합계','원가금액','총원가'], ['단가']);
      const purchaseUnitKey =
        findHeader(headers, ['매입가','원가','매입단가'], ['합계','금액']);

      const taxKey = findHeader(headers, ['세액','부가세','vat']);
      let productKey = findHeader(headers, ['상품명','상품','제품명','제품','품목명','품목','옵션명','옵션','sku','SKU','모델','관리코드','바코드']);

      if (!productKey) {
        productKey = headers.find(h => {
          const text = String(h || '').replaceAll(' ', '').toLowerCase();
          if (!text) return false;
          if (text.includes('날짜') || text.includes('일자') || text.includes('date')) return false;
          if (text.includes('수량') || text.includes('금액') || text.includes('가액') || text.includes('단가') || text.includes('세액')) return false;
          return allObjects.some(o => String(o[h] || '').trim() && Number.isNaN(Number(String(o[h]).replace(/,/g, ''))));
        });
      }

      const latestCoupangDate = todayDate();

      // 쿠팡 판매 탭은 택배/제작처럼 운영 KPI 기준으로 관리하므로,
      // 상단 기간 필터가 아니라 최신 판매일이 속한 연도 전체(YTD)를 기본 기준으로 사용한다.
      const ytdObjects = dateKey
        ? allObjects.filter(o => {
            const d = toDate(o[dateKey]);
            return d && d.getFullYear() === latestCoupangDate.getFullYear();
          })
        : allObjects;

      const filteredObjects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const periodObjects = scope === 'period' ? filteredObjects : ytdObjects;
      const periodDates = [...new Set(periodObjects.map(o => dateStr(toDate(o[dateKey]))).filter(d => d !== '-'))].sort();

      if (state.coupang.date && !periodDates.includes(state.coupang.date)) {
        state.coupang.date = '';
      }

      let objects = periodObjects;
      if (state.coupang.date && dateKey) {
        objects = objects.filter(o => dateStr(toDate(o[dateKey])) === state.coupang.date);
      }

      function rowQty(o) {
        return qtyKey ? toNum(o[qtyKey]) : 1;
      }

      function rowSupply(o) {
        if (supplyTotalKey) return toNum(o[supplyTotalKey]);
        if (supplyUnitKey) return toNum(o[supplyUnitKey]) * rowQty(o);
        return 0;
      }

      function rowPurchase(o) {
        if (purchaseTotalKey) return toNum(o[purchaseTotalKey]);
        if (purchaseUnitKey) return toNum(o[purchaseUnitKey]) * rowQty(o);
        return 0;
      }

      function rowTax(o) {
        if (taxKey) return toNum(o[taxKey]);
        return Math.round(rowSupply(o) * 0.1);
      }

      const basisKey = state.coupang.basis === 'purchase'
        ? (purchaseTotalKey || purchaseUnitKey || supplyTotalKey || supplyUnitKey)
        : (supplyTotalKey || supplyUnitKey || purchaseTotalKey || purchaseUnitKey);

      const totalQty = objects.reduce((s, o) => s + rowQty(o), 0);
      const totalSupply = objects.reduce((s, o) => s + rowSupply(o), 0);
      const totalPurchase = objects.reduce((s, o) => s + rowPurchase(o), 0);
      const totalTax = objects.reduce((s, o) => s + rowTax(o), 0);
      const totalBasis = state.coupang.basis === 'purchase' ? totalPurchase : totalSupply;

      const thisMonthObjects = ytdObjects.filter(o => {
        const d = toDate(o[dateKey]);
        return d && d.getFullYear() === latestCoupangDate.getFullYear() && d.getMonth() === latestCoupangDate.getMonth();
      });
      const prevMonthDate = new Date(latestCoupangDate.getFullYear(), latestCoupangDate.getMonth() - 1, 1);
      const prevMonthObjects = ytdObjects.filter(o => {
        const d = toDate(o[dateKey]);
        return d && d.getFullYear() === prevMonthDate.getFullYear() && d.getMonth() === prevMonthDate.getMonth();
      });

      const ytdTotalQty = ytdObjects.reduce((s, o) => s + rowQty(o), 0);
      const ytdTotalSupply = ytdObjects.reduce((s, o) => s + rowSupply(o), 0);
      const ytdTotalPurchase = ytdObjects.reduce((s, o) => s + rowPurchase(o), 0);
      const ytdTotalTax = ytdObjects.reduce((s, o) => s + rowTax(o), 0);
      const thisMonthQty = thisMonthObjects.reduce((s, o) => s + rowQty(o), 0);
      const thisMonthSupply = thisMonthObjects.reduce((s, o) => s + rowSupply(o), 0);
      const thisMonthPurchase = thisMonthObjects.reduce((s, o) => s + rowPurchase(o), 0);
      const prevMonthQty = prevMonthObjects.reduce((s, o) => s + rowQty(o), 0);
      const prevMonthSupply = prevMonthObjects.reduce((s, o) => s + rowSupply(o), 0);
      const prevMonthPurchase = prevMonthObjects.reduce((s, o) => s + rowPurchase(o), 0);

      function getFlowKey(date) {
        if (!date) return '-';
        if (state.coupang.flowMode === 'monthly') {
          return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }
        if (state.coupang.flowMode === 'weekly') {
          const temp = new Date(date);
          temp.setHours(0,0,0,0);
          const day = temp.getDay() || 7;
          temp.setDate(temp.getDate() + 4 - day);
          const yearStart = new Date(temp.getFullYear(),0,1);
          const weekNo = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
          const month = temp.getMonth() + 1;
          return `${month}월 ${weekNo}주차`;
        }
        return dateStr(date);
      }

      const groupedMap = {};
      objects.forEach(o => {
        const rowDate = toDate(o[dateKey]);
        const d = getFlowKey(rowDate);
        if (d === '-') return;

        if (!groupedMap[d]) {
          groupedMap[d] = { raw: o, date: rowDate, label: d, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }

        groupedMap[d].qty += rowQty(o);
        groupedMap[d].supply += rowSupply(o);
        groupedMap[d].purchase += rowPurchase(o);
        groupedMap[d].tax += rowTax(o);
      });

      const dated = Object.values(groupedMap)
        .sort((a,b) => a.date - b.date)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }));

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) {
          productMap[name] = { name, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }
        productMap[name].qty += rowQty(o);
        productMap[name].supply += rowSupply(o);
        productMap[name].purchase += rowPurchase(o);
        productMap[name].tax += rowTax(o);
      });

      const categoryMap = {};
      objects.forEach(o => {
        const name = categoryKey ? (String(o[categoryKey] || '').trim() || '카테고리 미지정') : '카테고리 미지정';
        if (!categoryMap[name]) {
          categoryMap[name] = { name, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }
        categoryMap[name].qty += rowQty(o);
        categoryMap[name].supply += rowSupply(o);
        categoryMap[name].purchase += rowPurchase(o);
        categoryMap[name].tax += rowTax(o);
      });

      const productRank = Object.values(productMap)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }))
        .sort((a, b) => b.value - a.value);

      const categoryRank = Object.values(categoryMap)
        .filter(r => r.name && r.name !== '카테고리 미지정')
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }))
        .sort((a, b) => b.value - a.value);

      const monthlyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!monthlyMap[key]) monthlyMap[key] = { label: key, date: new Date(d.getFullYear(), d.getMonth(), 1), qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        monthlyMap[key].qty += rowQty(o);
        monthlyMap[key].supply += rowSupply(o);
        monthlyMap[key].purchase += rowPurchase(o);
        monthlyMap[key].tax += rowTax(o);
      });

      const monthlyFlow = Object.values(monthlyMap)
        .sort((a,b) => a.date - b.date)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }));

      return {
        headers,
        allObjects,
        ytdObjects,
        periodObjects,
        objects,
        dateKey,
        qtyKey,
        supplyTotalKey,
        supplyUnitKey,
        purchaseTotalKey,
        purchaseUnitKey,
        taxKey,
        productKey,
        categoryKey,
        basisKey,
        totalQty,
        totalBasis,
        totalSupply,
        totalPurchase,
        totalTax,
        ytdTotalQty,
        ytdTotalSupply,
        ytdTotalPurchase,
        ytdTotalTax,
        thisMonthQty,
        thisMonthSupply,
        thisMonthPurchase,
        prevMonthQty,
        prevMonthSupply,
        prevMonthPurchase,
        latestCoupangDate,
        dates: periodDates,
        dated,
        monthlyFlow,
        productRank,
        categoryRank
      };
    }

    function renderProductRankChart(items, limit = 10) {
      const safeItems = Array.isArray(items) ? items : [];
      const top = safeItems.filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || 0), 1);
      if (!top.length) return '<div class="empty">품목 컬럼을 찾지 못했습니다. 쿠팡 기준 선택 카드의 감지 컬럼을 확인해 주세요.</div>';
      return `<div class="rank-chart">${top.map((r, i) => `
        <div class="rank-row">
          <div class="rank-name" title="${r.name}">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((r.value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${money(r.value)}</div>
          <div class="rank-qty">${fmt(r.qty)}개</div>
        </div>
      `).join('')}</div>`;
    }

    function renderCoupangFlowChart(items, options = {}) {
      const safeItems = Array.isArray(items) ? items : [];
      const maxMoney = Math.max(...safeItems.map(r => r.value || 0), 1);
      const maxQty = Math.max(...safeItems.map(r => r.qty || 0), 1);

      if (!safeItems.length) {
        return '<div class="empty">흐름 차트로 표시할 데이터가 없습니다.</div>';
      }

      const best = [...safeItems].sort((a,b) => b.value - a.value)[0];
      const total = safeItems.reduce((s,r) => s + r.value, 0);
      const totalQty = safeItems.reduce((s,r) => s + r.qty, 0);

      return `
        <div class="flow-wrap">
          <div class="flow-grid">
            <div></div><div></div><div></div><div></div><div></div>
          </div>
          
          <div class="flow-chart">${safeItems.map(r => {
            const barHeight = Math.max((r.value / maxMoney) * 100, 2);
            const safeLabel = String(r.label || '').replace(/'/g, "\'");
            return `
              <div class="flow-col" ${options.clickFn ? `onclick="${options.clickFn}('${safeLabel}')" style="cursor:pointer;"` : ''}>
                <div class="flow-bar-wrap">
                  <div class="flow-bar" style="height:${barHeight}%"></div>
                </div>
                <div class="flow-money compact">${money(r.value)}</div>
                <div class="flow-qty">${fmt(r.qty)}개</div>
                <div class="flow-label compact">${r.label}</div>
              </div>
            `;
          }).join('')}</div>

          <div class="flow-summary">
            <div class="pill">최고 판매 구간: ${best?.label || '-'}</div>
            <div class="pill">최고 금액: ${money(best?.value || 0)}</div>
            <div class="pill">총 판매금액: ${money(total)}</div>
            <div class="pill">총 판매수량: ${fmt(totalQty)}개</div>
          </div>
        </div>
      `;
    }

    function setCoupangMonthDetail(label) {
      state.coupang.selectedMonthDetail = label;
      renderCoupang();
    }

    function closeCoupangMonthDetail() {
      state.coupang.selectedMonthDetail = '';
      renderCoupang();
    }

    function renderCoupangMonthDetail(a) {
      const label = state.coupang.selectedMonthDetail;
      if (!label) return '';
      const rows = (a.ytdObjects || []).filter(o => {
        const d = toDate(o[a.dateKey]);
        if (!d) return false;
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === label;
      });

      const productMap = {};
      const categoryMap = {};
      rows.forEach(o => {
        const product = a.productKey ? (String(o[a.productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        const category = a.categoryKey ? (String(o[a.categoryKey] || '').trim() || '카테고리 미지정') : '카테고리 미지정';
        const qty = a.qtyKey ? toNum(o[a.qtyKey]) : 1;
        const supply = a.supplyTotalKey ? toNum(o[a.supplyTotalKey]) : (a.supplyUnitKey ? toNum(o[a.supplyUnitKey]) * qty : 0);
        const purchase = a.purchaseTotalKey ? toNum(o[a.purchaseTotalKey]) : (a.purchaseUnitKey ? toNum(o[a.purchaseUnitKey]) * qty : 0);
        const value = state.coupang.basis === 'purchase' ? purchase : supply;

        if (!productMap[product]) productMap[product] = { name: product, qty: 0, value: 0 };
        productMap[product].qty += qty;
        productMap[product].value += value;

        if (!categoryMap[category]) categoryMap[category] = { name: category, qty: 0, value: 0 };
        categoryMap[category].qty += qty;
        categoryMap[category].value += value;
      });

      const productRank = Object.values(productMap).sort((x,y)=>y.value-x.value);
      const categoryRank = Object.values(categoryMap).filter(r=>r.name !== '카테고리 미지정').sort((x,y)=>y.value-x.value);
      const totalQty = productRank.reduce((s,r)=>s+r.qty,0);
      const totalValue = productRank.reduce((s,r)=>s+r.value,0);

      return `
        <div class="modal-backdrop" onclick="closeCoupangMonthDetail()">
          <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div>
                <div class="card-title">${label} 쿠팡 출고 상세</div>
                <div class="card-sub">월별 그래프 금액이 어떤 품목/카테고리로 구성됐는지 확인합니다.</div>
              </div>
              <button class="modal-close" onclick="closeCoupangMonthDetail()">닫기</button>
            </div>
            <div class="flow-summary" style="margin-bottom:18px;">
              <div class="pill">총 판매수량 ${fmt(totalQty)}개</div>
              <div class="pill">총 금액 ${money(totalValue)}</div>
              <div class="pill">데이터 ${fmt(rows.length)}행</div>
            </div>
            <div class="grid" style="grid-template-columns:repeat(12,1fr);">
              <article class="card half"><div class="card-head"><div><div class="card-title">카테고리별 구성</div><div class="card-sub">선택 월 기준</div></div></div>${renderProductRankChart(categoryRank, 12)}</article>
              <article class="card half"><div class="card-head"><div><div class="card-title">품목별 구성</div><div class="card-sub">선택 월 기준</div></div></div>${renderProductRankChart(productRank, 12)}</article>
            </div>
          </div>
        </div>
      `;
    }

    function renderCoupang() {
      const a = getCoupangAnalysis('ytd');
      const periodA = getCoupangAnalysis('period');
      if (!a.headers.length) {
        grid(`<article class="card full"><div class="card-head"><div><div class="card-title">쿠팡 판매</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">쿠팡_판매 시트 데이터를 불러오지 못했습니다.</div></article>`);
        return;
      }

      const totalPages = Math.max(Math.ceil(a.objects.length / state.coupang.pageSize), 1);
      state.coupang.page = Math.min(Math.max(state.coupang.page, 1), totalPages);
      const start = (state.coupang.page - 1) * state.coupang.pageSize;
      const pageRows = a.objects.slice(start, start + state.coupang.pageSize);
      const headers = a.headers;
      const basisLabel = state.coupang.basis === 'purchase' ? '매입가 기준' : '공급가 기준';
      const flowLabel = state.coupang.flowMode === 'monthly' ? '월간 집계' : state.coupang.flowMode === 'weekly' ? '주간 집계' : '일별 집계';

      const dateOptions = ['<option value="">전체 날짜</option>'].concat(a.dates.map(d => `<option value="${d}" ${state.coupang.date === d ? 'selected' : ''}>${d}</option>`)).join('');
      const table = pageRows.map(o => `<tr>${headers.map(h => `<td>${o[h] || '-'}</td>`).join('')}</tr>`).join('');
      const monthDetailModal = renderCoupangMonthDetail(a);

      const commonCards = `
        ${viewToggle('coupang')}
        ${metricCard('올해 누적 쿠팡 판매수량', a.qtyKey || '행 개수 기준', fmt(a.ytdTotalQty), `${a.latestCoupangDate.getFullYear()}년 전체 / 이번달 ${fmt(a.thisMonthQty)}개`, 'good', a.monthlyFlow.map(r=>r.qty))}
        ${metricCard('올해 누적 공급가액', a.supplyTotalKey || a.supplyUnitKey || '공급가 컬럼 없음', money(a.ytdTotalSupply), `${a.latestCoupangDate.getFullYear()}년 전체 공급가액`, 'good', a.monthlyFlow.map(r=>r.supply))}
        ${metricCard('이번달 판매수량', '전월 대비', fmt(a.thisMonthQty), `전월 ${fmt(a.prevMonthQty)}개 / ${changeRate(a.thisMonthQty, a.prevMonthQty)}`, changeTone(a.thisMonthQty, a.prevMonthQty), [a.prevMonthQty, a.thisMonthQty])}
        ${metricCard('이번달 공급가액', '전월 대비', money(a.thisMonthSupply), `전월 ${money(a.prevMonthSupply)} / ${changeRate(a.thisMonthSupply, a.prevMonthSupply)}`, changeTone(a.thisMonthSupply, a.prevMonthSupply), [a.prevMonthSupply, a.thisMonthSupply])}
      `;
      const summaryCards = `
        ${viewToggle('coupang')}
        ${metricCard('이번달 판매수량', '전월 대비', fmt(a.thisMonthQty), `전월 ${fmt(a.prevMonthQty)}개 / ${changeRate(a.thisMonthQty, a.prevMonthQty)}`, changeTone(a.thisMonthQty, a.prevMonthQty), [a.prevMonthQty, a.thisMonthQty])}
        ${metricCard('이번달 공급가액', '전월 대비', money(a.thisMonthSupply), `전월 ${money(a.prevMonthSupply)} / ${changeRate(a.thisMonthSupply, a.prevMonthSupply)}`, changeTone(a.thisMonthSupply, a.prevMonthSupply), [a.prevMonthSupply, a.thisMonthSupply])}
        ${metricCard('선택기간 판매수량', '상단 기간 선택 기준', fmt(periodA.totalQty), `${document.getElementById('periodLabel').textContent} / 공급가액 ${money(periodA.totalSupply)}`, 'good', periodA.dated.map(r=>r.qty))}
      `;
      if (state.viewMode.coupang === 'summary') {
        grid(`${summaryCards}
          <article class="card wide"><div class="card-head"><div><div class="card-title">월별 쿠팡 출고 금액</div><div class="card-sub">${basisLabel} / 월별 공급가액·수량 흐름 / 클릭 시 상세</div></div><span class="badge">월별</span></div>${renderCoupangFlowChart(a.monthlyFlow, { clickFn: 'setCoupangMonthDetail' })}</article>
          <article class="card side"><div class="card-head"><div><div class="card-title">카테고리별 출고 현황</div><div class="card-sub">선택기간 판매수량 기준</div></div><span class="badge">${periodA.categoryKey || '카테고리 없음'}</span></div>${renderProductRankChart(periodA.categoryRank, 8)}</article>
          ${monthDetailModal}
        `);
        return;
      }
      grid(`${commonCards}
        <article class="card wide"><div class="card-head"><div><div class="card-title">월별 쿠팡 출고 금액</div><div class="card-sub">${basisLabel} / 월별 공급가액·수량 흐름</div></div><span class="badge">월별</span></div>
          ${renderCoupangFlowChart(a.monthlyFlow, { clickFn: 'setCoupangMonthDetail' })}
        </article>
        ${monthDetailModal}

        <article class="card side"><div class="card-head"><div><div class="card-title">카테고리별 출고 현황</div><div class="card-sub">카테고리별 수량 및 금액</div></div><span class="badge">${a.categoryKey || '카테고리 없음'}</span></div>
          ${renderProductRankChart(a.categoryRank, 8)}
        </article>

        <article class="card wide"><div class="card-head"><div><div class="card-title">쿠팡 판매 흐름</div><div class="card-sub">${basisLabel} / ${flowLabel} / 금액+수량 동시 표시</div></div><span class="badge">${a.basisKey || '기준 컬럼 없음'}</span></div>
          <div class="table-tools">
            <div class="tool-left">
              <select id="coupangFlowMode" onchange="setCoupangFlowMode(this.value)">
                <option value="daily" ${state.coupang.flowMode === 'daily' ? 'selected' : ''}>일별</option>
                <option value="weekly" ${state.coupang.flowMode === 'weekly' ? 'selected' : ''}>주간</option>
                <option value="monthly" ${state.coupang.flowMode === 'monthly' ? 'selected' : ''}>월간</option>
              </select>
              <div class="pill">파란 막대 = 판매금액</div>
              
              <div class="pill">미니멀 운영 분석형 차트</div>
            </div>
          </div>
          ${renderCoupangFlowChart(a.dated)}
        </article>

        <article class="card half"><div class="card-head"><div><div class="card-title">품목별 금액 순위</div><div class="card-sub">${basisLabel} / 선택 기간 기준 상위 10개 품목</div></div><span class="badge">금액 큰 순</span></div>${renderProductRankChart(a.productRank, 10)}</article>

        <article class="card side"><div class="card-head"><div><div class="card-title">쿠팡 기준 선택</div><div class="card-sub">날짜별 / 금액 기준 전환</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">📅</div><div><strong>날짜 선택</strong><span>${a.dateKey || '날짜열 감지 안됨'}</span></div><div></div></div>
          <select id="coupangDateSelect" onchange="setCoupangDate(this.value)">${dateOptions}</select>
          <div class="issue"><div class="issue-icon">₩</div><div><strong>금액 기준</strong><span>공급가 / 매입가 전환</span></div><div></div></div>
          <select id="coupangBasisSelect" onchange="setCoupangBasis(this.value)">
            <option value="supply" ${state.coupang.basis === 'supply' ? 'selected' : ''}>공급가 기준</option>
            <option value="purchase" ${state.coupang.basis === 'purchase' ? 'selected' : ''}>매입가 기준</option>
          </select>
          <div class="issue"><div class="issue-icon">🔎</div><div><strong>감지 컬럼</strong><span>수량: ${a.qtyKey || '-'} / 공급: ${a.supplyTotalKey || a.supplyUnitKey || '-'} / 매입: ${a.purchaseTotalKey || a.purchaseUnitKey || '-'}</span></div><div class="issue-num">확인</div></div>
          <div class="issue"><div class="issue-icon">🏷️</div><div><strong>카테고리</strong><span>${a.categoryKey || '카테고리 컬럼 감지 안됨'}</span></div><div class="issue-num">${fmt(a.categoryRank.length)}</div></div>
        </div></article>

        <article class="card full"><div class="card-head"><div><div class="card-title">쿠팡 원본 데이터 전체 보기</div><div class="card-sub">기간 내 ${fmt(a.periodObjects.length)}행 / 현재 표시 ${fmt(a.objects.length)}행 / 페이지당 ${fmt(state.coupang.pageSize)}행</div></div></div>
          <div class="table-tools">
            <div class="tool-left">
              <select id="coupangPageSize" onchange="setCoupangPageSize(this.value)">
                <option value="30" ${state.coupang.pageSize === 30 ? 'selected' : ''}>30개씩</option>
                <option value="50" ${state.coupang.pageSize === 50 ? 'selected' : ''}>50개씩</option>
                <option value="100" ${state.coupang.pageSize === 100 ? 'selected' : ''}>100개씩</option>
                <option value="999999" ${state.coupang.pageSize === 999999 ? 'selected' : ''}>전체 보기</option>
              </select>
              <div class="pill">${basisLabel}</div>
            </div>
            <div class="tool-right"><div class="pill">${document.getElementById('periodLabel').textContent}</div><div class="pill">${a.objects.length ? fmt(start + 1) : 0} - ${fmt(Math.min(start + state.coupang.pageSize, a.objects.length))} / ${fmt(a.objects.length)}</div></div>
          </div>
          <div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h || '-'}</th>`).join('')}</tr></thead><tbody>${table}</tbody></table></div>
          <div class="pagination">
            <button onclick="setCoupangPage(1)">처음</button>
            <button onclick="setCoupangPage(${state.coupang.page - 1})">이전</button>
            <span class="page-info">${fmt(state.coupang.page)} / ${fmt(totalPages)} 페이지</span>
            <button onclick="setCoupangPage(${state.coupang.page + 1})">다음</button>
            <button onclick="setCoupangPage(${totalPages})">마지막</button>
          </div>
        </article>
      `);
    }

    function setCoupangDate(value) {
      state.coupang.date = value;
      state.coupang.page = 1;
      renderCoupang();
    }

    function setCoupangBasis(value) {
      state.coupang.basis = value;
      renderCoupang();
    }

    function setCoupangPage(page) {
      state.coupang.page = Number(page);
      renderCoupang();
    }

    function setCoupangPageSize(value) {
      state.coupang.pageSize = Number(value);
      state.coupang.page = 1;
      renderCoupang();
    }

    function setCoupangFlowMode(value) {
      state.coupang.flowMode = value;
      renderCoupang();
    }

    function setPaymentVendorPeriod(value) {
      state.payment.vendorPeriod = value;
      renderPayment();
    }

    function setPaymentVendor(value) {
      state.payment.selectedVendor = value;
      renderPayment();
    }

    function setPaymentMonthRange(type, value) {
      if (type === 'start') state.payment.startMonth = value;
      if (type === 'end') state.payment.endMonth = value;
      state.payment.selectedFlowPeriod = '';
      renderPayment();
    }

    function setPaymentFlowPeriod(label) {
      state.payment.selectedFlowPeriod = label;
      renderPayment();
    }

    function paymentObjectsForVendorFlow(a, periodLabel) {
      const selected = state.payment.selectedVendor;
      return (a.paymentObjects || []).filter(o => {
        const d = toDate(o[a.dateKey]);
        if (!d) return false;
        const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const key = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(d);
        const vendor = a.vendorKey ? (o[a.vendorKey] || '거래처 미지정') : '거래처 미지정';
        return key === periodLabel && (selected === 'all' || vendor === selected);
      }).sort((x,y)=>toDate(x[a.dateKey])-toDate(y[a.dateKey]));
    }

    function normalizeProductionRows(rows) {
      const rawHeaders = rows[0] || [];
      const dateLabels = ['날짜','일자','제작일','생산일','작업일','등록일','date'];
      const blockStarts = rawHeaders.reduce((starts, header, index) => {
        const normalized = String(header || '').replaceAll(' ', '').toLowerCase();
        if (dateLabels.includes(normalized)) starts.push(index);
        return starts;
      }, []);

      // 일반적인 세로형 표는 기존 방식으로 읽고, 같은 헤더가 가로로 반복될 때만
      // 각 블록을 독립적인 행 데이터로 변환한다.
      if (blockStarts.length <= 1) {
        return {
          headers: rawHeaders.filter(h => String(h || '').trim()),
          objects: rowsToObjects(rows),
          blockCount: rawHeaders.length ? 1 : 0
        };
      }

      const headers = [];
      const objects = [];
      blockStarts.forEach((start, blockIndex) => {
        const nextStart = blockStarts[blockIndex + 1] ?? rawHeaders.length;
        let end = nextStart;
        while (end > start && !String(rawHeaders[end - 1] || '').trim()) end--;
        const blockHeaders = rawHeaders.slice(start, end).map(h => String(h || '').trim());
        blockHeaders.forEach(h => { if (h && !headers.includes(h)) headers.push(h); });

        rows.slice(1).forEach(row => {
          const object = {};
          let hasData = false;
          blockHeaders.forEach((header, offset) => {
            if (!header) return;
            const value = row[start + offset] ?? '';
            object[header] = value;
            if (String(value).trim()) hasData = true;
          });
          const hasIdentity = dateLabels.some(label => String(object[headers.find(h => String(h).replaceAll(' ', '').toLowerCase() === label)] || '').trim()) ||
            String(object['품목'] || object['제품명'] || object['상품명'] || '').trim();
          if (hasData && hasIdentity) objects.push(object);
        });
      });

      return { headers, objects, blockCount: blockStarts.length };
    }

    function getProductionAnalysis(scope = 'period', productFilter = state.production.selectedProduct || 'all') {
      const rows = state.raw.production || [];
      const normalized = normalizeProductionRows(rows);
      const headers = normalized.headers;
      const allObjects = normalized.objects;

      const dateKey = findHeader(headers, ['날짜','일자','제작일','생산일','작업일','등록일','date']);
      const productKey = findHeader(headers, ['상품명','제품명','품목명','품목','모델','옵션','sku','SKU','제품']);
      const workerKey = findHeader(headers, ['작업자','담당자','생산자','작업인원','직원']);
      const qtyKey = findHeader(headers, ['제작수량','생산수량','완성수량','완료수량','양품수량','수량']);
      const goodKey = findHeader(headers, ['양품수량','정상수량','완료수량','양품']);
      const defectKey = findHeader(headers, ['불량수량','불량량','NG수량','불량','NG'], ['폐기','사유','율']);
      const disposalKey = findHeader(headers, ['폐기수량','폐기량','폐기개수','폐기'], ['사유','율']);
      const reasonKey = findHeader(headers, ['불량사유','폐기사유','원인','이슈','비고','메모']);
      const targetKey = findHeader(headers, ['목표수량','목표','계획수량','계획']);

      const latestProductionDate = todayDate();

      const scopedObjects = dateKey
        ? (scope === 'year'
            ? allObjects.filter(o => {
                const d = toDate(o[dateKey]);
                return d && d.getFullYear() === latestProductionDate.getFullYear();
              })
            : scope === 'previousPeriod'
              ? (() => {
                  const currentRange = getCurrentPeriodRange();
                  const previousRange = getPreviousPeriodRange(currentRange.start, currentRange.end);
                  return allObjects.filter(o => {
                    const d = toDate(o[dateKey]);
                    if (!d) return false;
                    const compare = new Date(d);
                    compare.setHours(0,0,0,0);
                    return compare >= previousRange.start && compare <= previousRange.end;
                  });
                })()
              : filterObjectsByDate(allObjects, dateKey))
        : allObjects;

      const availableProducts = productKey
        ? [...new Set(allObjects.map(o => String(o[productKey] || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ko'))
        : [];
      if (productFilter !== 'all' && !availableProducts.includes(productFilter)) {
        productFilter = 'all';
      }
      const selectedProduct = productFilter || 'all';
      const objects = selectedProduct === 'all' || !productKey
        ? scopedObjects
        : scopedObjects.filter(o => String(o[productKey] || '').trim() === selectedProduct);

      function rowQty(o) {
        if (qtyKey) return toNum(o[qtyKey]);
        if (goodKey || defectKey) return toNum(o[goodKey]) + toNum(o[defectKey]);
        return 1;
      }

      function rowGood(o) {
        if (goodKey) return toNum(o[goodKey]);
        return Math.max(rowQty(o) - rowDefect(o), 0);
      }

      function rowDefect(o) {
        return (defectKey ? toNum(o[defectKey]) : 0) + (disposalKey ? toNum(o[disposalKey]) : 0);
      }

      function rowTarget(o) {
        return targetKey ? toNum(o[targetKey]) : 0;
      }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalGood = objects.reduce((s,o)=>s+rowGood(o),0);
      const totalDefect = objects.reduce((s,o)=>s+rowDefect(o),0);
      const totalTarget = objects.reduce((s,o)=>s+rowTarget(o),0);
      const goodRate = totalQty ? pct(totalGood, totalQty) : '0.00%';
      const defectRate = totalQty ? pct(totalDefect, totalQty) : '0.00%';
      const defectRateNumber = totalQty ? (totalDefect / totalQty) * 100 : 0;
      const defectGoalRates = targetKey
        ? objects.map(o => String(o[targetKey] || '').match(/(\d+(?:\.\d+)?)\s*%/)).filter(Boolean).map(match => Number(match[1]))
        : [];
      const defectGoalRate = defectGoalRates.length ? defectGoalRates[0] : null;
      const defectGoalText = defectGoalRate == null ? '목표 미설정' : `${defectGoalRate}% 미만`;
      const defectGoalPassed = defectGoalRate == null ? null : defectRateNumber < defectGoalRate;
      const defectGoalLabel = defectGoalPassed == null ? '목표 미설정' : (defectGoalPassed ? '목표 달성' : '관리 필요');
      const targetRate = defectGoalLabel;

      const dailyMap = {};
      objects.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!dailyMap[d]) dailyMap[d] = { label: d, date: toDate(o[dateKey]), qty: 0, good: 0, defect: 0, target: 0, value: 0 };
        dailyMap[d].qty += rowQty(o);
        dailyMap[d].good += rowGood(o);
        dailyMap[d].defect += rowDefect(o);
        dailyMap[d].target += rowTarget(o);
        dailyMap[d].value += rowQty(o);
      });
      const daily = Object.values(dailyMap).sort((a,b)=>a.date-b.date);

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty: 0, good: 0, defect: 0, value: 0 };
        productMap[name].qty += rowQty(o);
        productMap[name].good += rowGood(o);
        productMap[name].defect += rowDefect(o);
        productMap[name].value += rowQty(o);
      });
      const productRank = Object.values(productMap).sort((a,b)=>b.qty-a.qty);

      const workerMap = {};
      objects.forEach(o => {
        const name = workerKey ? (String(o[workerKey] || '').trim() || '작업자 미지정') : '작업자 미지정';
        if (!workerMap[name]) workerMap[name] = { name, qty: 0, defect: 0, value: 0 };
        workerMap[name].qty += rowQty(o);
        workerMap[name].defect += rowDefect(o);
        workerMap[name].value += rowQty(o);
      });
      const workerRank = Object.values(workerMap).sort((a,b)=>b.qty-a.qty);

      const reasonMap = {};
      objects.forEach(o => {
        const defect = rowDefect(o);
        if (!defect) return;
        const reason = reasonKey ? (String(o[reasonKey] || '').trim() || '사유 미기재') : '사유 미기재';
        if (!reasonMap[reason]) reasonMap[reason] = { name: reason, qty: 0, value: 0 };
        reasonMap[reason].qty += defect;
        reasonMap[reason].value += defect;
      });
      const reasonRank = Object.values(reasonMap).sort((a,b)=>b.qty-a.qty);

      return {
        headers,
        allObjects,
        objects,
        dateKey,
        productKey,
        workerKey,
        qtyKey,
        goodKey,
        defectKey,
        disposalKey,
        reasonKey,
        targetKey,
        blockCount: normalized.blockCount,
        availableProducts,
        selectedProduct,
        totalQty,
        totalGood,
        totalDefect,
        totalTarget,
        goodRate,
        defectRate,
        targetRate,
        defectRateNumber,
        defectGoalRate,
        defectGoalText,
        defectGoalPassed,
        defectGoalLabel,
        daily,
        productRank,
        workerRank,
        reasonRank
      };
    }

    function renderProductionRank(items, valueLabel = '개', limit = 8) {
      const top = (items || []).filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || r.qty || 0), 1);
      if (!top.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';
      return `<div class="rank-chart">${top.map((r, i) => {
        const value = r.value || r.qty || 0;
        return `<div class="rank-row">
          <div class="rank-name" title="${r.name}">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${fmt(value)}${valueLabel}</div>
          <div class="rank-qty">${r.defect ? `불량 ${fmt(r.defect)}` : ''}</div>
        </div>`;
      }).join('')}</div>`;
    }

    function getPaymentAnalysis() {
      const paymentRows = state.raw.payments || [];
      const poRows = state.raw.po || [];

      const paymentHeaders = paymentRows[0] || [];
      const paymentObjects = rowsToObjects(paymentRows);
      const poObjects = rowsToObjects(poRows);

      const dateKey = findHeader(paymentHeaders, ['결제일','예정일','결제예정일','날짜','일자']);
      const vendorKey = findHeader(paymentHeaders, ['거래처','업체','공급처']);
      const productKey = findHeader(paymentHeaders, ['상품명','품목명','제품명','품목','제품']);
      const typeKey = findHeader(paymentHeaders, ['결제유형','유형','선급금','잔금','구분']);
      const inboundKey = findHeader(paymentHeaders, ['입고일','입고예정일','도착일']);

      const usdKey = findHeader(paymentHeaders, ['USD','외화','달러','송금USD','결제외화','외화금액','외화결제액','결제액']) || paymentHeaders[7];
      const krwKey = findHeader(paymentHeaders, ['원화','KRW','결제원화','한화']);
      // 결제_예정 및 완료 탭 G열: 통화 구분 고정 사용
      const paymentCurrencyKey = paymentHeaders[6] || findHeader(paymentHeaders, ['통화','currency','curr','화폐']);
      function getPaymentCurrency(o) {
        return paymentCurrency(o, paymentCurrencyKey);
      }
      const poHeaders = poRows[0] || [];
      const poNumberKey = findHeader(poHeaders, ['PO번호','PO','발주번호','ORDER']);
      const poProductKey = findHeader(poHeaders, ['상품명','품목명','제품명','품목','제품']);
      const poTotalKey = findHeader(poHeaders, ['총PO금액(외화)','총PO금액','PO금액','총발주금액']);
      const poAdvanceKey = findHeader(poHeaders, ['총선급금(외화)','총선급금','선급금']);
      const poInboundPaidKey = findHeader(poHeaders, ['누적입고물품금액(외화)','누적입고물품금액','입고물품금액']);
      const poNotInboundKey = findHeader(poHeaders, ['미입고물품금액(외화)','미입고물품금액','미입고금액']);
      const poUnpaidBalanceKey = findHeader(poHeaders, ['물품미결제잔액(외화)','물품미결제잔액','미결제잔액','미지급잔액']);
      const poRemainQtyKey = findHeader(poHeaders, ['잔여수량','미입고수량','남은수량','잔량']) || poHeaders[16];
      const poCurrencyKey = findHeader(poHeaders, ['통화','currency','curr','화폐']);
      const poVendorKey = findHeader(poHeaders, ['거래처','업체','공급처']);
      const FX_RATES = { USD: 1500, RMB: 210, CNY: 210 };

      function getPoCurrency(o) {
        const raw = poCurrencyKey ? String(o[poCurrencyKey] || '').trim().toUpperCase() : 'USD';
        if (raw.includes('RMB') || raw.includes('CNY') || raw.includes('위안') || raw.includes('元') || raw.includes('¥')) return 'RMB';
        return 'USD';
      }

      function poFxRate(o) {
        const currency = getPoCurrency(o);
        return FX_RATES[currency] || FX_RATES.USD;
      }

      function poAmountToKrw(o, key) {
        return Math.round(toNum(o[key]) * poFxRate(o));
      }

      function formatForeignByCurrency(amount, currency) {
        if (currency === 'RMB') return `¥${fmt(Math.round(Number(amount || 0)))}`;
        return `$${fmt(Math.round(Number(amount || 0)))}`;
      }

      function getPoRemainQty(o) {
        const byHeader = poRemainQtyKey ? toNum(o[poRemainQtyKey]) : 0;
        const byQColumn = o._row ? toNum(o._row[16]) : 0;
        return byHeader || byQColumn;
      }

      const objects = dateKey ? filterObjectsByDate(paymentObjects, dateKey) : paymentObjects;

      const today = new Date();
      today.setHours(0,0,0,0);

      const upcomingPayments = paymentObjects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      }).sort((a,b) => toDate(a[dateKey]) - toDate(b[dateKey]));

      const upcomingUsd = upcomingPayments.filter(o => getPaymentCurrency(o) === 'USD').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const upcomingRmb = upcomingPayments.filter(o => getPaymentCurrency(o) === 'RMB').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const upcomingKrw = upcomingPayments.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const nearestPaymentDate = upcomingPayments.length ? dateStr(toDate(upcomingPayments[0][dateKey])) : '-';

      const upcomingDailyMap = {};
      upcomingPayments.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!upcomingDailyMap[d]) upcomingDailyMap[d] = { name: d, label: d, value: 0, usd: 0, qty: 0 };
        upcomingDailyMap[d].value += toNum(o[krwKey]);
        upcomingDailyMap[d].usd += toNum(o[usdKey]);
        upcomingDailyMap[d].qty += 1;
      });
      const upcomingDaily = Object.values(upcomingDailyMap).sort((a,b) => {
        const da = toDate(a.name);
        const db = toDate(b.name);
        return (da?.getTime() || 0) - (db?.getTime() || 0);
      });

      const scheduledPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      });

      const paidPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d < today;
      });

      const scheduledKrwInPeriod = scheduledPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const paidKrwInPeriod = paidPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);

      const totalUsd = objects.filter(o => getPaymentCurrency(o) === 'USD').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const totalRmb = objects.filter(o => getPaymentCurrency(o) === 'RMB').reduce((s,o)=>s+toNum(o[usdKey]),0);
      const totalKrw = objects.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const totalPoAmount = poObjects.reduce((s,o)=>s+toNum(o[poTotalKey]),0);
      const totalAdvance = poObjects.reduce((s,o)=>s+toNum(o[poAdvanceKey]),0);
      const totalInboundPaid = poObjects.reduce((s,o)=>s+toNum(o[poInboundPaidKey]),0);
      const totalNotInbound = poObjects.reduce((s,o)=>s+toNum(o[poNotInboundKey]),0);
      const totalPoAmountKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poTotalKey),0);
      const totalNotInboundKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poNotInboundKey),0);
      const totalAdvanceKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poAdvanceKey),0);
      const totalInboundPaidKrw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poInboundPaidKey),0);
      // 결제_PO관리 탭은 결제_예정 및 완료 탭에 미래 결제일이 적혀 있어도 결제 완료처럼 계산될 수 있으므로,
      // 대시보드에서는 오늘 포함 이후 결제 예정액을 물품미결제잔액에 다시 더해 보정한다.
      const poUnpaidBalanceKrwRaw = poObjects.reduce((s,o)=>s+poAmountToKrw(o, poUnpaidBalanceKey),0);
      const futureScheduledKrwForUnpaid = upcomingPayments.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const totalUnpaidBalanceKrw = poUnpaidBalanceKrwRaw + futureScheduledKrwForUnpaid;

      const vendorMap = {};
      const vendorFlowMap = {};
      const poMap = {};
      const productMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          poKrw: 0,
          advance: 0,
          advanceKrw: 0,
          inbound: 0,
          inboundKrw: 0,
          remaining: 0,
          remainingKrw: 0,
          currency: '',
            remainQty: 0,
          paymentRate: 0
        };
        vendorMap[name].value += toNum(o[krwKey]);
        vendorMap[name].usd += getPaymentCurrency(o) === 'USD' ? toNum(o[usdKey]) : 0;
        vendorMap[name].rmb = (vendorMap[name].rmb || 0) + (getPaymentCurrency(o) === 'RMB' ? toNum(o[usdKey]) : 0);
        vendorMap[name].qty += 1;
      });

      // 업체별 결제 흐름은 상단 전체 기간 필터가 아니라, 이 섹션의 월 선택 범위를 기준으로 별도 집계한다.
      paymentObjects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!name || name === '거래처 미지정') return;

        const paymentDate = toDate(o[dateKey]);
        if (!paymentDate) return;

        const monthKey = `${paymentDate.getFullYear()}-${String(paymentDate.getMonth()+1).padStart(2,'0')}`;
        const flowKey = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(paymentDate);

        if (!vendorFlowMap[flowKey]) vendorFlowMap[flowKey] = {};
        if (!vendorFlowMap[flowKey][name]) vendorFlowMap[flowKey][name] = 0;
        vendorFlowMap[flowKey][name] += toNum(o[krwKey]);
      });

      poObjects.forEach(o => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';

        if (poNo) {
          if (!poMap[poNo]) poMap[poNo] = {
            name: poNo,
            poName: poNo,
            productName: productName || poNo,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          poMap[poNo].currency = poMap[poNo].currency || getPoCurrency(o);
          poMap[poNo].po += toNum(o[poTotalKey]);
          poMap[poNo].poKrw += poAmountToKrw(o, poTotalKey);
          poMap[poNo].advance += toNum(o[poAdvanceKey]);
          poMap[poNo].advanceKrw += poAmountToKrw(o, poAdvanceKey);
          poMap[poNo].inbound += toNum(o[poInboundPaidKey]);
          poMap[poNo].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
          poMap[poNo].remaining += toNum(o[poNotInboundKey]);
          poMap[poNo].remainingKrw += poAmountToKrw(o, poNotInboundKey);
          poMap[poNo].remainQty += getPoRemainQty(o);
        }

        if (productName) {
          if (!productMap[productName]) productMap[productName] = {
            name: productName,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          productMap[productName].currency = productMap[productName].currency || getPoCurrency(o);
          productMap[productName].po += toNum(o[poTotalKey]);
          productMap[productName].poKrw += poAmountToKrw(o, poTotalKey);
          productMap[productName].advance += toNum(o[poAdvanceKey]);
          productMap[productName].advanceKrw += poAmountToKrw(o, poAdvanceKey);
          productMap[productName].inbound += toNum(o[poInboundPaidKey]);
          productMap[productName].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
          productMap[productName].remaining += toNum(o[poNotInboundKey]);
          productMap[productName].remainingKrw += poAmountToKrw(o, poNotInboundKey);
          productMap[productName].remainQty += getPoRemainQty(o);
        }
        const name = poVendorKey ? (o[poVendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          poKrw: 0,
          advance: 0,
          advanceKrw: 0,
          inbound: 0,
          inboundKrw: 0,
          remaining: 0,
          remainingKrw: 0,
          currency: '',
            remainQty: 0,
          paymentRate: 0
        };

        vendorMap[name].currency = vendorMap[name].currency || getPoCurrency(o);
        vendorMap[name].po += toNum(o[poTotalKey]);
        vendorMap[name].poKrw += poAmountToKrw(o, poTotalKey);
        vendorMap[name].advance += toNum(o[poAdvanceKey]);
        vendorMap[name].advanceKrw += poAmountToKrw(o, poAdvanceKey);
        vendorMap[name].inbound += toNum(o[poInboundPaidKey]);
        vendorMap[name].inboundKrw += poAmountToKrw(o, poInboundPaidKey);
        vendorMap[name].remaining += toNum(o[poNotInboundKey]);
        vendorMap[name].remainingKrw += poAmountToKrw(o, poNotInboundKey);
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      const paymentMonthValues = [...new Set(Object.keys(vendorFlowMap).map(k => k.slice(0,7)))].sort();
      if (!state.payment.startMonth && paymentMonthValues.length) state.payment.startMonth = paymentMonthValues[0];
      if (!state.payment.endMonth && paymentMonthValues.length) state.payment.endMonth = paymentMonthValues[paymentMonthValues.length - 1];

      const vendorFlowMapFiltered = {};
      Object.entries(vendorFlowMap).forEach(([period, vendors]) => {
        const monthKey = period.slice(0,7);
        const startOk = !state.payment.startMonth || monthKey >= state.payment.startMonth;
        const endOk = !state.payment.endMonth || monthKey <= state.payment.endMonth;
        if (startOk && endOk) vendorFlowMapFiltered[period] = vendors;
      });

      Object.values(poMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      Object.values(productMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.poKrw ? (v.advanceKrw / v.poKrw) * 100 : 0;
        v.value = v.poKrw || 0;
      });

      const typeMap = {};
      objects.forEach(o => {
        const name = typeKey ? (o[typeKey] || '유형 미지정') : '유형 미지정';
        if (!typeMap[name]) typeMap[name] = { name, value: 0, qty: 0 };
        typeMap[name].value += toNum(o[krwKey]);
        typeMap[name].qty += 1;
      });

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += toNum(o[krwKey]);
        dailyMap[key].qty += 1;
      });

      const poDetailRank = poObjects.map((o, idx) => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';
        const poAmount = toNum(o[poTotalKey]);
        const advanceAmount = toNum(o[poAdvanceKey]);
        const inboundAmount = toNum(o[poInboundPaidKey]);
        const notInboundAmount = toNum(o[poNotInboundKey]);
        const poAmountKrw = poAmountToKrw(o, poTotalKey);
        const advanceAmountKrw = poAmountToKrw(o, poAdvanceKey);
        const inboundAmountKrw = poAmountToKrw(o, poInboundPaidKey);
        const notInboundAmountKrw = poAmountToKrw(o, poNotInboundKey);
        const remainQty = getPoRemainQty(o);
        const paymentRate = poAmountKrw ? (advanceAmountKrw / poAmountKrw) * 100 : 0;
        const currency = getPoCurrency(o);

        return {
          name: poNo || `PO-${idx + 1}`,
          poName: poNo || `PO-${idx + 1}`,
          productName: productName || poNo || `PO-${idx + 1}`,
          po: poAmount,
          poKrw: poAmountKrw,
          advance: advanceAmount,
          advanceKrw: advanceAmountKrw,
          inbound: inboundAmount,
          inboundKrw: inboundAmountKrw,
          remaining: notInboundAmount,
          remainingKrw: notInboundAmountKrw,
          remainQty,
          paymentRate,
          currency,
          value: poAmountKrw
        };
      }).filter(r => r.po > 0 && r.paymentRate < 100);

      return {
        paymentHeaders,
        paymentObjects,
        objects,
        poObjects,
        dateKey,
        vendorKey,
        productKey,
        typeKey,
        inboundKey,
        usdKey,
        krwKey,
        poTotalKey,
        poAdvanceKey,
        poInboundPaidKey,
        poNotInboundKey,
        poNumberKey,
        poProductKey,
        poUnpaidBalanceKey,
        poRemainQtyKey,
        poVendorKey,
        poCurrencyKey,
        totalUsd,
        totalRmb,
        totalKrw,
        paymentCurrencyKey,
        scheduledPaymentsInPeriod,
        paidPaymentsInPeriod,
        scheduledKrwInPeriod,
        paidKrwInPeriod,
        upcomingPayments,
        upcomingUsd,
        upcomingRmb,
        upcomingKrw,
        nearestPaymentDate,
        upcomingDaily,
        totalPoAmount,
        totalAdvance,
        totalInboundPaid,
        totalNotInbound,
        totalPoAmountKrw,
        totalAdvanceKrw,
        totalInboundPaidKrw,
        totalNotInboundKrw,
        poUnpaidBalanceKrwRaw,
        futureScheduledKrwForUnpaid,
        totalUnpaidBalanceKrw,
        vendorRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        vendorPaymentRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        poRank: Object.values(poMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        poPaymentRank: poDetailRank.sort((a,b)=>b.paymentRate-a.paymentRate),
        productPaymentRank: Object.values(productMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        typeRank: Object.values(typeMap).sort((a,b)=>b.value-a.value),
        dailyFlow: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorFlowMap: vendorFlowMapFiltered,
        paymentMonthValues
      };
    }

    function renderPayment() {
      const a = getPaymentAnalysis();

      const poDetailModal = renderPaymentPoDetailModal(a);

      const previewRows = a.objects.slice(0, 40).map(o => `
        <tr>
          <td>${o[a.dateKey] || '-'}</td>
          <td>${o[a.productKey] || '-'}</td>
          <td>${o[a.vendorKey] || '-'}</td>
          <td>${o[a.typeKey] || '-'}</td>
          <td>${o[a.inboundKey] || '-'}</td>
          <td class="right">${paymentCurrency(o, a.paymentCurrencyKey) === 'RMB' ? '¥' : '$'}${fmt(toNum(o[a.usdKey]))}</td>
          <td class="right">${money(toNum(o[a.krwKey]))}</td>
          <td class="right">${(() => {
            const vendor = o[a.vendorKey] || '거래처 미지정';
            const found = a.vendorPaymentRank.find(v => v.name === vendor);
            return found ? found.paymentRate.toFixed(1) + '%' : '-';
          })()}</td>
          
        </tr>
      `).join('');

      grid(`
        ${sizedMetricCard(metricCard('외화 결제액','USD / RMB 기준 합계',`${fmt(a.totalUsd)} / ¥${fmt(a.totalRmb || 0)}`,`${a.usdKey || '외화금액 없음'} · 통화: ${a.paymentCurrencyKey || 'G열 없음'}`,'good',a.dailyFlow.map(r=>r.value)), 'double')}
        ${sizedMetricCard(metricCard('원화 결제액','KRW 기준 합계',money(a.totalKrw),a.krwKey || '원화 컬럼 없음','good',a.dailyFlow.map(r=>r.value)), 'double')}
        ${sizedMetricCard(clickableMetricCard('총 PO금액','통화별 환율 적용',money(a.totalPoAmountKrw),`통화열 기준 USD 1,500원 / RMB 210원 / 클릭 시 구성 상세`, 'good',[a.totalPoAmountKrw],`openPaymentPoDetail('po')`), 'third-kpi')}
        ${sizedMetricCard(clickableMetricCard('미입고 물품금액','통화별 환율 적용',money(a.totalNotInboundKrw),`입고되지 않은 물품금액 기준 / 클릭 시 구성 상세`,a.totalNotInboundKrw > 0 ? 'warn' : 'good',[a.totalNotInboundKrw],`openPaymentPoDetail('notInbound')`), 'third-kpi')}

    function renderProduction() {
      const a = getProductionAnalysis('year');
      const periodA = getProductionAnalysis('period');
      const previousPeriodA = getProductionAnalysis('previousPeriod');
      if (!a.headers.length) {
        grid(`<article class="card full"><div class="card-head"><div><div class="card-title">제작 현황</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">제작_일별 시트 데이터를 불러오지 못했습니다.</div></article>`);
        return;
      }

      const previewHeaders = a.headers;
      const latestProdDate = todayDate();
      const thisMonthProd = a.daily.filter(r => r.date.getFullYear() === latestProdDate.getFullYear() && r.date.getMonth() === latestProdDate.getMonth());
      const prevMonthDate = new Date(latestProdDate.getFullYear(), latestProdDate.getMonth() - 1, 1);
      const prevMonthProd = a.daily.filter(r => r.date.getFullYear() === prevMonthDate.getFullYear() && r.date.getMonth() === prevMonthDate.getMonth());
      const monthQty = thisMonthProd.reduce((s,r)=>s+r.qty,0);
      const prevMonthQty = prevMonthProd.reduce((s,r)=>s+r.qty,0);
      const monthDefect = thisMonthProd.reduce((s,r)=>s+r.defect,0);
      const prevMonthDefect = prevMonthProd.reduce((s,r)=>s+r.defect,0);
      const monthDefectRate = monthQty ? monthDefect / monthQty : 0;
      const prevMonthDefectRate = prevMonthQty ? prevMonthDefect / prevMonthQty : 0;
      const periodDefectRate = periodA.totalQty ? pct(periodA.totalDefect, periodA.totalQty) : '0.00%';
      const periodDefectRateNumber = periodA.totalQty ? periodA.totalDefect / periodA.totalQty : 0;
      const previousPeriodDefectRateNumber = previousPeriodA.totalQty ? previousPeriodA.totalDefect / previousPeriodA.totalQty : 0;
      const periodGoodRateNumber = periodA.totalQty ? periodA.totalGood / periodA.totalQty : 0;
      const previousPeriodGoodRateNumber = previousPeriodA.totalQty ? previousPeriodA.totalGood / previousPeriodA.totalQty : 0;
      const productionPeriodRange = getCurrentPeriodRange();
      const productionPreviousPeriodRange = getPreviousPeriodRange(productionPeriodRange.start, productionPeriodRange.end);
      const productionPeriodLabel = document.getElementById('periodLabel').textContent;
      const productionPreviousPeriodLabel = `${dateStr(productionPreviousPeriodRange.start)} ~ ${dateStr(productionPreviousPeriodRange.end)}`;
      const productionComparisonItems = [
        { label: '제작수량', current: periodA.totalQty, previous: previousPeriodA.totalQty, unit: '개', context: '맥세이프 + 프레임' },
        { label: '양품률', current: periodGoodRateNumber * 100, previous: previousPeriodGoodRateNumber * 100, type: 'rate', context: '양품 ÷ 생산수량' },
        { label: '불량·폐기율', current: periodDefectRateNumber * 100, previous: previousPeriodDefectRateNumber * 100, type: 'rate', lowerIsBetter: true, context: '낮을수록 양호' },
        { label: '불량 / 폐기', current: periodA.totalDefect, previous: previousPeriodA.totalDefect, unit: '개', lowerIsBetter: true, context: '발생 수량' }
      ];
      const productionScopeLabel = a.selectedProduct === 'all' ? '전체 제품군' : a.selectedProduct;
      const productOptions = a.availableProducts.map(product => `<option value="${safeHtml(product)}" ${a.selectedProduct === product ? 'selected' : ''}>${safeHtml(product)}</option>`).join('');
      const productionFilter = `<article class="card full" style="min-height:auto;padding:14px 18px;"><div class="table-tools" style="margin:0;"><div class="tool-left"><strong style="font-size:13px;">제품군</strong><select onchange="setProductionProduct(this.value)"><option value="all" ${a.selectedProduct === 'all' ? 'selected' : ''}>전체 제품군</option>${productOptions}</select><div class="pill">가로형 제작표 ${fmt(a.blockCount)}개를 통합 집계</div></div></div></article>`;
      const previewRows = a.objects.slice(0, 30).map(o => `<tr>${previewHeaders.map(h => `<td>${safeHtml(o[h] || '-')}</td>`).join('')}</tr>`).join('');

      const commonCards = `
        ${viewToggle('production')}
        ${productionFilter}
        ${metricCard('올해 누적 제작수량',`${productionScopeLabel} · 제작_일별 YTD`,fmt(a.totalQty),`${latestProdDate.getFullYear()}년 전체 / 이번달 ${fmt(monthQty)}개 / 불량·폐기율 ${a.defectRate}`,'good',a.daily.map(r=>r.qty))}
        ${metricCard('올해 누적 불량 / 폐기','YTD 품질 이슈',fmt(a.totalDefect),`올해 불량·폐기율 ${a.defectRate} / 목표 ${a.defectGoalText}`,a.totalDefect > 0 ? 'warn' : 'good',a.daily.map(r=>r.defect))}
        ${metricCard('이번달 제작수량','전월 대비',fmt(monthQty),`전월 ${fmt(prevMonthQty)}개 / ${changeRate(monthQty, prevMonthQty)}`,changeTone(monthQty, prevMonthQty),thisMonthProd.map(r=>r.qty))}
        ${metricCard('이번달 불량·폐기율','전월 대비',pct(monthDefect, monthQty),`전월 ${pct(prevMonthDefect, prevMonthQty)} / ${changeRate(monthDefectRate, prevMonthDefectRate)}`,changeTone(monthDefectRate, prevMonthDefectRate, true),thisMonthProd.map(r=>r.defect))}
        ${metricCard('선택기간 제작수량','상단 기간 선택 기준',fmt(periodA.totalQty),`${document.getElementById('periodLabel').textContent} / 불량·폐기율 ${periodDefectRate}`,periodA.totalDefect > 0 ? 'warn' : 'good',periodA.daily.map(r=>r.qty))}
      `;
      const summaryCards = `
        ${viewToggle('production')}
        ${productionFilter}
        ${metricCard('선택기간 제작수량','직전 동일 기간 대비',fmt(periodA.totalQty),`${productionPeriodLabel} / 직전 ${productionPreviousPeriodLabel} ${fmt(previousPeriodA.totalQty)}개 / ${changeRate(periodA.totalQty, previousPeriodA.totalQty)}`,changeTone(periodA.totalQty, previousPeriodA.totalQty),periodA.daily.map(r=>r.qty))}
        ${metricCard('선택기간 양품률','직전 동일 기간 대비',pct(periodA.totalGood, periodA.totalQty),`직전 ${pct(previousPeriodA.totalGood, previousPeriodA.totalQty)} / ${changeRate(periodGoodRateNumber, previousPeriodGoodRateNumber)}`,changeTone(periodGoodRateNumber, previousPeriodGoodRateNumber),periodA.daily.map(r=>r.good))}
        ${metricCard('선택기간 불량·폐기율','직전 동일 기간 대비',pct(periodA.totalDefect, periodA.totalQty),`직전 ${pct(previousPeriodA.totalDefect, previousPeriodA.totalQty)} / ${changeRate(periodDefectRateNumber, previousPeriodDefectRateNumber)}`,changeTone(periodDefectRateNumber, previousPeriodDefectRateNumber, true),periodA.daily.map(r=>r.defect))}
        ${metricCard('선택기간 불량/폐기','직전 동일 기간 대비',`${fmt(periodA.totalDefect)}개`,`직전 ${fmt(previousPeriodA.totalDefect)}개 / ${changeRate(periodA.totalDefect, previousPeriodA.totalDefect)}`,changeTone(periodA.totalDefect, previousPeriodA.totalDefect, true),periodA.daily.map(r=>r.defect))}
        <article class="card full"><div class="card-head"><div><div class="card-title">선택기간 vs 직전기간 비교</div><div class="card-sub">제작수량, 양품률, 불량·폐기율, 불량/폐기를 동일 길이 기간으로 비교</div></div><span class="badge">세로 막대 비교</span></div>${renderVerticalPeriodComparisonChart(productionComparisonItems, { current: productionPeriodLabel, previous: productionPreviousPeriodLabel })}</article>
      `;

    function getInboundAnalysis() {
      // 입고_예정 탭이 비어 있거나 gid 연결이 안 된 경우,
      // 현재 실제로 로드되고 있는 결제_PO관리 데이터를 기준으로 입고 예정 정보를 구성한다.
      const rows = state.raw.inbound || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['입고예정일','예정일','입고일','도착일','날짜','일자','납기일','도착예정일']);
      const vendorKey = findHeader(headers, ['거래처','업체','공급처','공장']);
      const productKey = findHeader(headers, ['상품명','품목명','제품명','품목','제품','모델','옵션']);
      const qtyKey = findHeader(headers, ['입고수량','예정수량','수량','입고예정수량','잔여수량','미입고수량','발주수량']) || headers[16];
      const statusKey = findHeader(headers, ['상태','진행상태','입고상태']);
      const reasonKey = findHeader(headers, ['지연사유','확인사유','사유','비고','메모','특이사항','이슈']);
      const poKey = findHeader(headers, ['PO번호','PO','발주번호','주문번호']);
      const amountKey = findHeader(headers, ['입고금액','예정금액','물품금액','금액','원화','KRW','미입고물품금액(외화)','미입고물품금액','총PO금액']);

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const today = new Date();
      today.setHours(0,0,0,0);

      function rowQty(o) {
        const byHeader = qtyKey ? toNum(o[qtyKey]) : 0;
        const byQColumn = o._row ? toNum(o._row[16]) : 0;
        return byHeader || byQColumn || 0;
      }
      function rowAmount(o) {
        const value = amountKey ? toNum(o[amountKey]) : 0;
        // PO관리의 외화 금액 컬럼을 입고 예정 금액으로 잡은 경우 1,500원 환산 적용
        const amountName = String(amountKey || '');
        if (amountName.includes('외화') || amountName.includes('PO')) return usdToKrw(value);
        return value;
      }
      function rowStatus(o) { return statusKey ? String(o[statusKey] || '').trim() : ''; }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalAmount = objects.reduce((s,o)=>s+rowAmount(o),0);
      const completed = objects.filter(o => rowStatus(o).includes('완료') || rowStatus(o).includes('입고완료'));
      const delayed = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d < today && !status.includes('완료');
      });
      const upcoming = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d >= today && !status.includes('완료');
      }).sort((a,b)=>toDate(a[dateKey])-toDate(b[dateKey]));

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += rowQty(o);
        dailyMap[key].qty += rowQty(o);
      });

      const vendorMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (String(o[vendorKey] || '').trim() || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = { name, qty:0, value:0 };
        vendorMap[name].qty += rowQty(o);
        vendorMap[name].value += rowAmount(o) || rowQty(o);
      });

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty:0, value:0 };
        productMap[name].qty += rowQty(o);
        productMap[name].value += rowQty(o);
      });

      const statusMap = {};
      objects.forEach(o => {
        const name = rowStatus(o) || '상태 미지정';
        if (!statusMap[name]) statusMap[name] = { name, qty:0, value:0 };
        statusMap[name].qty += 1;
        statusMap[name].value += rowQty(o);
      });

      return {
        headers, objects, dateKey, vendorKey, productKey, qtyKey, statusKey, reasonKey, poKey, amountKey,
        totalQty, totalAmount, completed, delayed, upcoming,
        daily: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorRank: Object.values(vendorMap).filter(v=>v.name !== '거래처 미지정').sort((a,b)=>b.value-a.value),
        productRank: Object.values(productMap).filter(v=>v.name !== '품목 미지정').sort((a,b)=>b.qty-a.qty),
        statusRank: Object.values(statusMap).sort((a,b)=>b.qty-a.qty)
      };
    }

        <article class="card wide"><div class="card-head"><div><div class="card-title">날짜별 입고 예정 흐름</div><div class="card-sub">입고 예정일 기준 수량 흐름</div></div><span class="badge">${a.dateKey || '날짜열 없음'}</span></div>${renderCoupangFlowChart(a.daily)}</article>

          <div class="table-wrap"><table><thead><tr><th>예정일</th><th>품목</th><th>거래처</th><th>PO</th><th class="right">수량</th><th>상태</th><th>사유</th></tr></thead><tbody>${rows}</tbody></table></div>

    function getInboundManageAnalysis() {
      const rows = state.raw.inboundManage || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['입고일','실입고일','처리일','검수일','날짜','일자']);
      const expectedDateKey = findHeader(headers, ['입고예정일','예정일','도착예정일']);
      const vendorKey = findHeader(headers, ['거래처','업체','공급처','공장']);
      const productKey = findHeader(headers, ['상품명','품목명','제품명','품목','제품','모델','옵션']);
      const poKey = findHeader(headers, ['PO번호','PO','발주번호','주문번호']);
      const expectedQtyKey = findHeader(headers, ['예정수량','입고예정수량','발주수량','예상수량']);
      const actualQtyKey = findHeader(headers, ['실입고수량','입고수량','실제입고','입고완료수량','완료수량']);
      const diffQtyKey = findHeader(headers, ['차이수량','수량차이','부족수량','과입고수량']);
      const defectQtyKey = findHeader(headers, ['불량수량','파손수량','검수불량','불량','파손']);
      const statusKey = findHeader(headers, ['상태','입고상태','검수상태','진행상태']);
      const memoKey = findHeader(headers, ['비고','메모','사유','특이사항','이슈']);
      const amountKey = headers[20]; // U열: 최종 입고금액 고정

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;

      function expectedQty(o) { return expectedQtyKey ? toNum(o[expectedQtyKey]) : 0; }
      function actualQty(o) { return actualQtyKey ? toNum(o[actualQtyKey]) : 0; }
      function defectQty(o) { return defectQtyKey ? toNum(o[defectQtyKey]) : 0; }
      function diffQty(o) {
        if (diffQtyKey) return toNum(o[diffQtyKey]);
        const e = expectedQty(o);
        const a = actualQty(o);
        return e || a ? e - a : 0;
      }
      function amount(o) {
        // 입고 금액은 반드시 입고_관리 탭 U열(21번째 열, index 20)의 최종 입고금액만 사용
        return o._row ? toNum(o._row[20]) : 0;
      }
      function status(o) { return statusKey ? String(o[statusKey] || '').trim() : ''; }

      const totalExpected = objects.reduce((s,o)=>s+expectedQty(o),0);
      const totalActual = objects.reduce((s,o)=>s+actualQty(o),0);
      const totalDiff = objects.reduce((s,o)=>s+diffQty(o),0);
      const totalDefect = objects.reduce((s,o)=>s+defectQty(o),0);
      const totalAmount = objects.reduce((s,o)=>s+amount(o),0);
      const completeRate = totalExpected ? pct(totalActual, totalExpected) : '0.00%';

      const issueRows = objects.filter(o => diffQty(o) !== 0 || defectQty(o) > 0 || String(status(o)).includes('확인') || String(status(o)).includes('지연'));

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += actualQty(o);
        dailyMap[key].qty += actualQty(o);
      });

      const vendorMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (String(o[vendorKey] || '').trim() || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = { name, value:0, qty:0 };
        vendorMap[name].value += amount(o) || actualQty(o);
        vendorMap[name].qty += actualQty(o);
      });

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, value:0, qty:0 };
        productMap[name].value += amount(o);
        productMap[name].qty += actualQty(o);
      });

      const statusMap = {};
      objects.forEach(o => {
        const name = status(o) || '상태 미지정';
        if (!statusMap[name]) statusMap[name] = { name, value:0, qty:0 };
        statusMap[name].value += actualQty(o) || 1;
        statusMap[name].qty += 1;
      });

      return {
        headers, objects, dateKey, expectedDateKey, vendorKey, productKey, poKey,
        expectedQtyKey, actualQtyKey, diffQtyKey, defectQtyKey, statusKey, memoKey, amountKey,
        totalExpected, totalActual, totalDiff, totalDefect, totalAmount, completeRate, issueRows,
        daily: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorRank: Object.values(vendorMap).filter(v=>v.name !== '거래처 미지정').sort((a,b)=>b.value-a.value),
