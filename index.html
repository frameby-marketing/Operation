<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRAMEBY 주간 운영 대시보드</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-line: rgba(255,255,255,.08);
      --text: #eef3ff;
      --text2: #dce5ff;
      --muted: #8f9bb7;
      --blue: #5b7cfa;
      --cyan: #22d3ee;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #fb7185;
      --radius: 22px;
      --modal-bg: #10172a;
      --bar-top: #65e4ff;
      --scheme: dark;
      --ov02: rgba(255,255,255,.02);
      --ov025: rgba(255,255,255,.025);
      --ov03: rgba(255,255,255,.03);
      --ov035: rgba(255,255,255,.035);
      --ov04: rgba(255,255,255,.04);
      --ov045: rgba(255,255,255,.045);
      --ov05: rgba(255,255,255,.05);
      --ov055: rgba(255,255,255,.055);
      --ov06: rgba(255,255,255,.06);
      --ov07: rgba(255,255,255,.07);
      --ov08: rgba(255,255,255,.08);
      --ov12: rgba(255,255,255,.12);
    }

    html[data-theme="light"] {
      --bg: #eef1f8;
      --panel: #ffffff;
      --panel-line: rgba(15,23,42,.12);
      --text: #10162a;
      --text2: #1f2a44;
      --muted: #667089;
      --blue: #3357d6;
      --cyan: #0891b2;
      --green: #15803d;
      --yellow: #a15c00;
      --red: #c02b3c;
      --modal-bg: #ffffff;
      --bar-top: #0ea5c0;
      --scheme: light;
      --ov02: rgba(15,23,42,.025);
      --ov025: rgba(15,23,42,.03);
      --ov03: rgba(15,23,42,.035);
      --ov035: rgba(15,23,42,.04);
      --ov04: rgba(15,23,42,.045);
      --ov045: rgba(15,23,42,.05);
      --ov05: rgba(15,23,42,.055);
      --ov055: rgba(15,23,42,.06);
      --ov06: rgba(15,23,42,.07);
      --ov07: rgba(15,23,42,.08);
      --ov08: rgba(15,23,42,.10);
      --ov12: rgba(15,23,42,.16);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); overflow-x: hidden; transition: background .2s ease; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background .2s ease, color .2s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 0%, rgba(91,124,250,.16), transparent 30%),
        radial-gradient(circle at 85% 5%, rgba(34,211,238,.10), transparent 25%),
        linear-gradient(180deg, var(--bg), var(--bg));
    }

    .app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; position: relative; z-index: 1; overflow-x: hidden; }
    .sidebar { padding: 28px 20px; border-right: 1px solid var(--panel-line); background: rgba(9,14,28,.84); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: grid; place-items: center; font-weight: 900; }
    .brand strong { display:block; font-size: 18px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .nav-title { font-size: 11px; color: var(--muted); letter-spacing: .12em; margin: 22px 12px 10px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; color: var(--text2); border-radius: 15px; margin-bottom: 8px; font-size: 14px; cursor: pointer; transition: .18s; }
    .nav-item:hover { background: var(--ov05); }
    .nav-item.active { background: linear-gradient(135deg, rgba(91,124,250,.24), rgba(34,211,238,.12)); border: 1px solid rgba(91,124,250,.42); color: #fff; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .active .dot { background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }

    main { padding: 28px; min-width: 0; overflow-x: hidden; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
    .title { min-width: 0; flex: 1 1 auto; }
    .title h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 2vw, 30px);
      letter-spacing: -0.04em;
      white-space: nowrap;
      line-height: 1.15;
    }
    .title p { margin: 0; color: var(--muted); font-size: 14px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .dashboard-actions { flex: 0 0 100%; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
    .pill, select, button, input[type="date"] { border: 1px solid var(--panel-line); background: var(--ov05); color: var(--text2); padding: 10px 14px; border-radius: 999px; font-size: 13px; }
    select, input[type="date"] { outline: none; color-scheme: var(--scheme); }
    .custom-date { display: none; gap: 8px; align-items: center; }
    .custom-date.show { display: flex; }
    button { cursor: pointer; background: linear-gradient(135deg, rgba(91,124,250,.55), rgba(34,211,238,.28)); }
    button.active-mode { background: linear-gradient(135deg, rgba(34,211,238,.45), rgba(52,211,153,.25)); border-color: rgba(52,211,153,.45); color: #fff; font-weight: 800; }

    .icon-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; font-size: 13px; background: var(--ov05); border: 1px solid var(--panel-line); color: var(--text2); flex-shrink: 0; white-space: nowrap; }
    .icon-btn:hover { background: var(--ov08); }
    .sheet-link { position: relative; flex-shrink: 0; }
    .sheet-menu-arrow { display: inline-block; font-size: 10px; transition: transform .18s ease; }
    .sheet-menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 280px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 6px; box-shadow: 0 20px 45px rgba(0,0,0,.35); z-index: 200; display: flex; flex-direction: column; gap: 2px; }
    .sheet-menu a { display: block; padding: 10px 12px; border-radius: 9px; color: var(--text2); font-size: 13px; text-decoration: none; white-space: nowrap; }
    .sheet-menu a:hover { background: var(--ov08); color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
    .card { background: linear-gradient(180deg, var(--ov055), var(--ov025)); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.22); position: relative; overflow: hidden; min-width: 0; }
    .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, var(--ov08), transparent 28%); pointer-events: none; }
    .kpi { grid-column: span 3; min-height: 146px; }
    .kpi.double { grid-column: span 6; }
    .kpi.third-kpi { grid-column: span 4; }
    .wide { grid-column: span 8; min-height: 370px; }
    .side { grid-column: span 4; min-height: 370px; }
    .three-quarter { grid-column: span 9; min-height: 370px; }
    .half { grid-column: span 6; min-height: 300px; }
    .third { grid-column: span 4; min-height: 280px; }
    .full { grid-column: span 12; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; z-index: 1; }
    .card-title { font-size: 14px; color: var(--text2); font-weight: 700; }
    .card-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .badge { font-size: 12px; padding: 7px 10px; border-radius: 999px; background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.24); white-space: nowrap; }
    .badge.warn { background: rgba(251,191,36,.12); color: var(--yellow); border-color: rgba(251,191,36,.24); }
    .badge.danger { background: rgba(251,113,133,.12); color: var(--red); border-color: rgba(251,113,133,.24); }
    .kpi-value { font-size: 34px; font-weight: 900; letter-spacing: -0.05em; margin: 10px 0 8px; position: relative; z-index: 1; }
    .kpi-caption { color: var(--muted); font-size: 13px; position: relative; z-index: 1; }
    .spark { display: flex; align-items: end; gap: 5px; height: 42px; margin-top: 18px; position: relative; z-index: 1; }
    .bar { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--cyan), var(--blue)); opacity: .8; min-height: 2px; }

    /* ── 대시보드 모션: 기존 레이아웃과 데이터 로직은 유지 ── */
    .card { transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease; }
    .card.card-enter { animation:dashboard-card-enter .72s cubic-bezier(.2,.8,.24,1) both; animation-delay:var(--enter-delay,0ms); }
    .card.data-updated::after { content:""; position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:inherit; animation:dashboard-data-flash 1.2s ease-out both; }
    .number-counting { color:var(--cyan) !important; transition:color .22s ease; }
    .dashboard-bar-animate { transform-origin:50% 100%; animation:dashboard-bar-grow .86s cubic-bezier(.2,.8,.24,1) both; animation-delay:var(--motion-delay,0ms); }
    .dashboard-progress-animate { transform-origin:0 50%; animation:dashboard-progress-grow .78s cubic-bezier(.2,.8,.24,1) both; animation-delay:var(--motion-delay,0ms); }
    .category-donut-ring.donut-animate { animation:dashboard-donut-enter .92s cubic-bezier(.2,.8,.24,1) both; animation-delay:160ms; }
    .category-donut-row.legend-enter { animation:dashboard-legend-enter .48s ease-out both; animation-delay:var(--motion-delay,0ms); }
    .badge.motion-alert { animation:dashboard-badge-pulse .78s ease-out 2; animation-delay:420ms; }

    @keyframes dashboard-card-enter {
      0% { opacity:0; transform:translateY(18px) scale(.985); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes dashboard-bar-grow {
      0% { opacity:.2; transform:scaleY(.02); }
      100% { opacity:1; transform:scaleY(1); }
    }
    @keyframes dashboard-progress-grow {
      0% { opacity:.3; transform:scaleX(.02); }
      100% { opacity:1; transform:scaleX(1); }
    }
    @keyframes dashboard-donut-enter {
      0% { opacity:0; transform:scale(.72) rotate(-24deg); }
      70% { opacity:1; transform:scale(1.035) rotate(2deg); }
      100% { opacity:1; transform:scale(1) rotate(0); }
    }
    @keyframes dashboard-legend-enter {
      0% { opacity:0; transform:translateX(10px); }
      100% { opacity:1; transform:translateX(0); }
    }
    @keyframes dashboard-data-flash {
      0% { box-shadow:inset 0 0 0 1px rgba(34,211,238,.72); background:rgba(34,211,238,.13); }
      100% { box-shadow:inset 0 0 0 1px rgba(34,211,238,0); background:rgba(34,211,238,0); }
    }
    @keyframes dashboard-badge-pulse {
      0% { box-shadow:0 0 0 0 currentColor; }
      70% { box-shadow:0 0 0 7px transparent; }
      100% { box-shadow:0 0 0 0 transparent; }
    }

    @media (hover:hover) and (pointer:fine) {
      .card.kpi:hover, .summary-kpi-card:hover, .inspection-kpi-card:hover { transform:translateY(-3px); border-color:rgba(34,211,238,.24); box-shadow:0 24px 66px rgba(0,0,0,.28); }
    }

    @media (prefers-reduced-motion:reduce) {
      .card, .card.card-enter, .dashboard-bar-animate, .dashboard-progress-animate, .category-donut-ring.donut-animate, .category-donut-row.legend-enter, .badge.motion-alert { animation:none !important; transition:none !important; transform:none !important; }
    }

    .chart-area { display: grid; grid-template-columns: 46px repeat(7, 1fr); grid-template-rows: repeat(5, 42px) 38px; gap: 0 10px; position: relative; z-index: 1; margin-top: 22px; }
    .y-label { color: var(--muted); font-size: 11px; text-align: right; padding-right: 8px; }
    .grid-line { border-top: 1px dashed var(--ov08); grid-column: 2 / -1; }
    .vbar-wrap { grid-row: 1 / 6; align-self: end; display: flex; align-items: end; height: 210px; background: var(--ov03); border-radius: 14px; overflow: hidden; }
    .vbar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, var(--bar-top), var(--blue)); min-height: 3px; }
    .x-label { color: var(--muted); font-size: 11px; text-align: center; align-self: center; line-height: 1.35; }

    .simple-bar-scroll { position: relative; z-index: 1; width: 100%; overflow-x: auto; padding-bottom: 4px; }
    .simple-bar-scroll::-webkit-scrollbar { height: 8px; }
    .simple-bar-scroll::-webkit-scrollbar-thumb { background: var(--ov12); border-radius: 999px; }
    .simple-bar-chart { position: relative; display: flex; align-items: end; gap: 14px; height: 280px; padding: 18px 0 58px; border-bottom: 1px dashed var(--ov08); min-width: 100%; }
    .simple-bar-chart.many { gap: 10px; min-width: max-content; }
    .simple-bar-col { flex: 1; min-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 8px; position: relative; }
    .simple-bar-chart.many .simple-bar-col { flex: 0 0 58px; min-width: 58px; }
    .simple-bar-wrap { width: 100%; height: 210px; display: flex; align-items: end; background: var(--ov03); border-radius: 14px; overflow: hidden; }
    .simple-bar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, var(--bar-top), var(--blue)); min-height: 4px; }
    .simple-bar.danger-threshold { background: linear-gradient(180deg, #fb7185, #dc2626); box-shadow: 0 8px 24px rgba(220,38,38,.24); }
    .simple-bar-wrap.has-issue { border: 1px solid rgba(251,191,36,.38); box-shadow: inset 0 0 0 1px rgba(251,191,36,.12); }
    .issue-marker { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(251,191,36,.18); color: var(--yellow); border: 1px solid rgba(251,191,36,.42); font-weight: 900; font-size: 12px; z-index: 2; }
    .simple-bar-issue { color: var(--yellow); font-size: 11px; font-weight: 800; margin-top: -4px; }
    .simple-bar-label { position: absolute; bottom: -46px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .simple-bar-value { color: var(--text2); font-size: 12px; font-weight: 800; }
    .period-compare { position: relative; z-index: 1; display: grid; gap: 16px; margin-top: 18px; }
    .period-compare-legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .period-compare-dot { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 6px; vertical-align: -1px; }
    .period-compare-dot.current { background: var(--cyan); }
    .period-compare-dot.previous { background: var(--yellow); }
    .period-compare-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 190px; gap: 14px; align-items: center; }
    .period-compare-label { color: var(--text2); font-size: 13px; font-weight: 800; }
    .period-compare-bars { display: grid; gap: 7px; min-width: 0; }
    .period-compare-track { height: 18px; border-radius: 999px; background: var(--ov06); overflow: hidden; }
    .period-compare-bar { height: 100%; border-radius: inherit; }
    .period-compare-bar.current { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .period-compare-bar.previous { background: linear-gradient(90deg, rgba(251,191,36,.48), rgba(251,191,36,.9)); }
    .period-compare-value { color: var(--text); font-size: 13px; font-weight: 900; text-align: right; }
    .period-compare-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .period-compare-delta { font-size: 11px; margin-top: 4px; font-weight: 800; }
    .period-compare-delta.good { color: var(--green); }
    .period-compare-delta.warn { color: var(--yellow); }
    .period-compare-delta.neutral { color: var(--muted); }

    .period-vertical { position: relative; z-index: 1; margin-top: 18px; }
    .period-vertical-legend { display:flex; align-items:center; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-bottom:18px; }
    .period-vertical-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:22px; }
    .period-vertical-facet { min-width:0; }
    .period-vertical-title { text-align:center; color:var(--text2); font-size:13px; font-weight:800; }
    .period-vertical-delta { min-height:32px; margin:5px 0 10px; text-align:center; font-size:11px; font-weight:800; line-height:1.35; }
    .period-vertical-delta.good { color:var(--green); }
    .period-vertical-delta.warn { color:var(--yellow); }
    .period-vertical-delta.neutral { color:var(--muted); }
    .period-vertical-plot { height:230px; display:grid; grid-template-columns:repeat(2,minmax(46px,74px)); justify-content:center; align-items:end; gap:14px; border-bottom:1px solid var(--panel-line); background:repeating-linear-gradient(to top, var(--ov055) 0, var(--ov055) 1px, transparent 1px, transparent 25%); }
    .period-vertical-column { height:100%; display:flex; flex-direction:column; justify-content:end; align-items:stretch; gap:7px; }
    .period-vertical-value { text-align:center; color:var(--text); font-size:12px; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .period-vertical-bar { min-height:4px; border-radius:9px 9px 0 0; background:linear-gradient(180deg,var(--cyan),var(--blue)); }
    .period-vertical-bar.previous { background:linear-gradient(180deg,rgba(251,191,36,.9),rgba(251,191,36,.48)); }
    .period-vertical-axis { display:grid; grid-template-columns:repeat(2,minmax(46px,74px)); justify-content:center; gap:14px; margin-top:8px; color:var(--muted); font-size:11px; text-align:center; }
    .period-vertical-context { color:var(--muted); font-size:11px; text-align:center; margin-top:7px; min-height:15px; }

    /* ── 요약 KPI: 현재값과 기간 비교를 분리 ── */
    .summary-kpi-card { min-height:182px; display:flex; flex-direction:column; }
    .summary-kpi-value { position:relative; z-index:1; color:var(--text); font-size:clamp(34px,3vw,46px); line-height:1; font-weight:950; letter-spacing:-.06em; margin:16px 0 12px; font-variant-numeric:tabular-nums; }
    .summary-kpi-value small { color:var(--text2); font-size:17px; font-weight:850; letter-spacing:-.03em; margin-left:6px; }
    .summary-kpi-caption { position:relative; z-index:1; color:var(--muted); font-size:12px; line-height:1.5; margin-top:auto; }
    .volume-compare-card { min-height:356px; }
    .volume-compare-layout { position:relative; z-index:1; display:grid; grid-template-columns:minmax(300px,.9fr) minmax(380px,1.1fr); gap:30px; align-items:stretch; }
    .volume-compare-overview { min-width:0; display:flex; flex-direction:column; justify-content:center; padding:6px 0; }
    .volume-compare-values { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; color:var(--muted); }
    .volume-compare-values strong { color:var(--text); font-size:clamp(42px,4.3vw,62px); line-height:1; font-weight:950; letter-spacing:-.07em; font-variant-numeric:tabular-nums; }
    .volume-compare-values b { color:var(--yellow); font-size:clamp(25px,2.6vw,36px); line-height:1; font-weight:900; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .volume-compare-values small { color:var(--text2); font-size:14px; font-weight:800; }
    .volume-compare-overview .shipping-delta { margin-top:14px; }
    .volume-compare-periods { display:grid; gap:9px; margin-top:20px; }
    .volume-compare-period { display:grid; grid-template-columns:70px minmax(0,1fr); gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--ov08); border-radius:13px; background:var(--ov035); }
    .volume-compare-period span { color:var(--muted); font-size:11px; font-weight:800; }
    .volume-compare-period strong { color:var(--text2); font-size:12px; line-height:1.45; font-variant-numeric:tabular-nums; }
    .volume-compare-period small { grid-column:2; color:var(--muted); font-size:10px; margin-top:-6px; }
    .volume-compare-chart-wrap { min-width:0; border:1px solid var(--ov08); border-radius:18px; background:var(--ov025); padding:18px 20px 14px; }
    .volume-compare-chart { height:230px; display:grid; grid-template-columns:repeat(2,minmax(92px,132px)); justify-content:center; align-items:end; gap:38px; border-bottom:1px solid var(--panel-line); background:repeating-linear-gradient(to top,var(--ov055) 0,var(--ov055) 1px,transparent 1px,transparent 25%); }
    .volume-compare-column { height:100%; display:flex; flex-direction:column; justify-content:end; align-items:stretch; gap:8px; min-width:0; }
    .volume-compare-value { color:var(--text); text-align:center; font-size:14px; font-weight:950; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .volume-compare-bar { min-height:4px; border-radius:12px 12px 0 0; background:linear-gradient(180deg,var(--cyan),var(--blue)); box-shadow:0 10px 28px rgba(34,211,238,.14); }
    .volume-compare-bar.previous { background:linear-gradient(180deg,rgba(251,191,36,.92),rgba(251,191,36,.46)); box-shadow:0 10px 28px rgba(251,191,36,.12); }
    .volume-compare-axis { display:grid; grid-template-columns:repeat(2,minmax(92px,132px)); justify-content:center; gap:38px; margin-top:10px; text-align:center; }
    .volume-compare-axis strong { display:block; color:var(--text2); font-size:12px; }
    .volume-compare-axis span { display:block; color:var(--muted); font-size:10px; margin-top:3px; }

    /* ── 택배 요약: 입력 상태를 반영한 기간 비교 ── */
    .shipping-hero { min-height: 330px; }
    .shipping-hero-grid { position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr); gap:18px; }
    .shipping-primary, .shipping-match { border:1px solid var(--ov08); border-radius:18px; background:var(--ov035); padding:20px; min-width:0; }
    .shipping-eyebrow { color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.02em; }
    .shipping-total { color:var(--text); font-size:clamp(44px,5vw,68px); line-height:1; font-weight:950; letter-spacing:-.07em; margin:14px 0 10px; font-variant-numeric:tabular-nums; }
    .shipping-total small { font-size:18px; margin-left:7px; letter-spacing:-.03em; color:var(--text2); }
    .shipping-period { color:var(--muted); font-size:13px; line-height:1.5; }
    .shipping-progress { margin-top:18px; }
    .shipping-progress-top { display:flex; justify-content:space-between; gap:12px; color:var(--text2); font-size:12px; font-weight:800; margin-bottom:8px; }
    .shipping-progress-track { height:9px; border-radius:999px; overflow:hidden; background:var(--ov08); }
    .shipping-progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--cyan)); }
    .shipping-match { display:flex; flex-direction:column; justify-content:center; }
    .shipping-match-title { color:var(--text2); font-size:13px; font-weight:900; }
    .shipping-match-sub { color:var(--muted); font-size:11px; margin-top:4px; }
    .shipping-match-values { display:flex; align-items:baseline; gap:9px; margin:22px 0 10px; color:var(--muted); font-size:14px; }
    .shipping-match-values strong { color:var(--text); font-size:34px; letter-spacing:-.05em; }
    .shipping-match-values b { color:var(--yellow); font-size:20px; }
    .shipping-match-result { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px; }
    .shipping-match-result .shipping-match-values { margin:0; }
    .shipping-match-result .shipping-delta { margin-bottom:3px; }
    .shipping-delta { display:inline-flex; width:max-content; max-width:100%; border-radius:999px; padding:7px 10px; font-size:12px; font-weight:900; }
    .shipping-delta.good { color:var(--green); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.22); }
    .shipping-delta.warn { color:var(--yellow); background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.22); }
    .shipping-delta.neutral { color:var(--muted); background:var(--ov05); border:1px solid var(--ov08); }
    .shipping-status-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:18px; }
    .shipping-status { display:flex; align-items:center; justify-content:space-between; gap:9px; padding:11px 13px; border:1px solid var(--ov08); border-radius:14px; background:var(--ov03); }
    .shipping-status span { color:var(--muted); font-size:11px; }
    .shipping-status strong { color:var(--text); font-size:17px; white-space:nowrap; }
    .shipping-status.complete strong { color:var(--green); }
    .shipping-status.pending strong { color:var(--yellow); }
    .shipping-quality-list { position:relative; z-index:1; display:grid; gap:11px; }
    .shipping-quality-row { padding:15px; border:1px solid var(--ov08); border-radius:16px; background:var(--ov035); }
    .shipping-quality-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
    .shipping-quality-top span { color:var(--muted); font-size:12px; font-weight:800; }
    .shipping-quality-top strong { color:var(--text); font-size:22px; letter-spacing:-.04em; }
    .shipping-quality-sub { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:11px; margin-top:7px; }
    .shipping-quality-sub b.good { color:var(--green); }
    .shipping-quality-sub b.warn { color:var(--yellow); }
    .shipping-quality-sub b.neutral { color:var(--muted); }
    .shipping-quality-note { position:relative; z-index:1; color:var(--muted); font-size:11px; line-height:1.55; margin-top:13px; padding:11px 13px; border-radius:13px; background:rgba(34,211,238,.06); border:1px solid rgba(34,211,238,.14); }

    .shipping-day-scroll { position:relative; z-index:1; overflow-x:auto; padding:4px 0 8px; }
    .shipping-day-scroll::-webkit-scrollbar { height:8px; }
    .shipping-day-scroll::-webkit-scrollbar-thumb { background:var(--ov12); border-radius:999px; }
    .shipping-day-grid { display:grid; gap:14px; min-width:max-content; }
    .shipping-day-group { width:auto; min-width:118px; border:1px solid var(--ov07); border-radius:16px; padding:12px 10px; background:var(--ov025); }
    .shipping-day-head { display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-bottom:10px; }
    .shipping-day-head strong { color:var(--text2); font-size:13px; }
    .shipping-day-head span { color:var(--muted); font-size:10px; }
    .shipping-day-plot { height:180px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:end; gap:8px; padding:8px 4px 0; border-bottom:1px solid var(--panel-line); background:repeating-linear-gradient(to top,var(--ov055) 0,var(--ov055) 1px,transparent 1px,transparent 25%); }
    .shipping-day-col { height:100%; display:flex; flex-direction:column; justify-content:end; align-items:stretch; gap:6px; min-width:0; }
    .shipping-day-value { text-align:center; color:var(--text2); font-size:10px; font-weight:900; white-space:nowrap; }
    .shipping-day-bar { min-height:3px; border-radius:7px 7px 0 0; background:linear-gradient(180deg,var(--cyan),var(--blue)); }
    .shipping-day-bar.previous { background:linear-gradient(180deg,rgba(251,191,36,.9),rgba(251,191,36,.46)); }
    .shipping-day-placeholder { height:62px; min-height:54px; display:grid; place-items:center; padding:5px; text-align:center; border-radius:9px 9px 0 0; color:var(--muted); font-size:9px; font-weight:900; line-height:1.35; background:var(--ov03); border:1px dashed var(--ov12); }
    .shipping-day-placeholder.pending { color:var(--yellow); background:rgba(251,191,36,.055); border-color:rgba(251,191,36,.32); }
    .shipping-day-placeholder.future { color:var(--cyan); background:rgba(34,211,238,.045); border-color:rgba(34,211,238,.22); }
    .shipping-day-axis { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; text-align:center; color:var(--muted); font-size:9px; margin-top:6px; }
    .shipping-day-status { margin-top:9px; border-radius:999px; padding:5px 7px; text-align:center; color:var(--muted); background:var(--ov05); border:1px solid var(--ov08); font-size:9px; font-weight:900; }
    .shipping-day-status.complete { color:var(--green); background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.2); }
    .shipping-day-status.pending { color:var(--yellow); background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.22); }
    .shipping-day-status.future { color:var(--cyan); background:rgba(34,211,238,.06); border-color:rgba(34,211,238,.18); }
    .shipping-day-prev { color:var(--muted); font-size:9px; text-align:center; margin-top:6px; }
    .production-day-issue { min-height:14px; color:var(--yellow); font-size:9px; font-weight:800; text-align:center; margin-top:5px; }
    .production-category-note { color:var(--muted); font-size:11px; line-height:1.5; margin-top:10px; }

    /* ── 생산 입고·검수: 관리번호로 연결된 로트 진행 현황 ── */
    .inspection-lot-list { position:relative; z-index:1; display:grid; gap:12px; }
    .inspection-lot { padding:16px; border:1px solid var(--ov08); border-radius:18px; background:var(--ov035); min-width:0; }
    .inspection-lot-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .inspection-lot-name { min-width:0; }
    .inspection-lot-name strong { display:block; color:var(--text); font-size:15px; line-height:1.35; word-break:break-word; }
    .inspection-lot-name span { display:block; color:var(--muted); font-size:11px; margin-top:4px; line-height:1.45; }
    .inspection-lot-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
    .inspection-lot-stat { padding:10px; border-radius:13px; background:var(--ov04); border:1px solid var(--ov06); min-width:0; }
    .inspection-lot-stat span { display:block; color:var(--muted); font-size:10px; margin-bottom:4px; }
    .inspection-lot-stat strong { display:block; color:var(--text2); font-size:15px; white-space:nowrap; }
    .inspection-lot-progress { height:9px; border-radius:999px; background:var(--ov08); overflow:hidden; }
    .inspection-lot-progress div { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--cyan)); }
    .inspection-lot-foot { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:10px; margin-top:9px; line-height:1.45; }
    .inspection-source-note { position:relative; z-index:1; padding:12px 14px; border-radius:14px; background:rgba(34,211,238,.055); border:1px solid rgba(34,211,238,.15); color:var(--muted); font-size:11px; line-height:1.55; }

    /* 생산 입고·검수: 다중 로트 선택 */
    .inspection-filter-toolbar { overflow:visible; z-index:80; }
    .inspection-lot-filter { position:relative; z-index:40; }
    .inspection-lot-trigger { display:inline-flex; align-items:center; justify-content:space-between; gap:12px; min-width:230px; background:var(--ov05); border-color:var(--panel-line); }
    .inspection-lot-trigger strong { color:var(--text); font-size:13px; }
    .inspection-lot-trigger span { color:var(--muted); font-size:11px; }
    .inspection-lot-trigger-arrow { color:var(--muted); font-size:10px; transition:transform .18s ease; }
    .inspection-lot-trigger[aria-expanded="true"] .inspection-lot-trigger-arrow { transform:rotate(180deg); }
    .inspection-lot-panel { position:absolute; top:calc(100% + 9px); left:0; width:min(420px,calc(100vw - 36px)); padding:12px; border:1px solid var(--panel-line); border-radius:18px; background:var(--panel); box-shadow:0 24px 70px rgba(0,0,0,.42); z-index:220; }
    .inspection-lot-panel-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .inspection-lot-panel-head strong { color:var(--text); font-size:13px; }
    .inspection-lot-actions { display:flex; gap:6px; }
    .inspection-lot-actions button { padding:7px 10px; font-size:11px; background:var(--ov05); }
    .inspection-lot-checks { display:grid; gap:6px; max-height:300px; overflow-y:auto; padding-right:3px; }
    .inspection-lot-checks::-webkit-scrollbar { width:7px; }
    .inspection-lot-checks::-webkit-scrollbar-thumb { background:var(--ov12); border-radius:999px; }
    .inspection-lot-check { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:10px; align-items:center; min-width:0; padding:10px 11px; border:1px solid var(--ov07); border-radius:13px; background:var(--ov035); cursor:pointer; }
    .inspection-lot-check:hover { border-color:rgba(34,211,238,.3); background:rgba(34,211,238,.055); }
    .inspection-lot-check input { width:16px; height:16px; margin:0; accent-color:var(--cyan); }
    .inspection-lot-check-copy { min-width:0; }
    .inspection-lot-check-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); font-size:12px; }
    .inspection-lot-check-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:10px; margin-top:3px; }
    .inspection-lot-check-qty { color:var(--text2); font-size:11px; white-space:nowrap; }
    .inspection-lot-selection-note { color:var(--muted); font-size:10px; line-height:1.45; margin-top:9px; }

    /* 생산 입고·검수: 의미가 보이는 대형 세로 막대 KPI */
    .inspection-kpi-card { min-height:380px; display:flex; flex-direction:column; }
    .inspection-kpi-card .card-head { margin-bottom:10px; }
    .inspection-kpi-card .kpi-value { font-size:38px; margin:8px 0 5px; }
    .inspection-kpi-card .kpi-caption { min-height:36px; line-height:1.45; }
    .inspection-chart-head { position:relative; z-index:1; display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:15px; color:var(--muted); font-size:10px; }
    .inspection-chart-key { display:inline-flex; align-items:center; gap:6px; min-width:0; }
    .inspection-chart-key::before { content:""; width:8px; height:8px; border-radius:999px; background:var(--inspection-tone,var(--cyan)); flex:0 0 auto; }
    .inspection-chart-scale { white-space:nowrap; }
    .inspection-lot-chart { --lot-gap:10px; --lot-label-height:38px; position:relative; z-index:1; display:flex; align-items:stretch; gap:var(--lot-gap); height:236px; margin-top:7px; padding:0 3px; }
    .inspection-lot-chart::before { content:""; position:absolute; inset:0 0 var(--lot-label-height); border-bottom:1px solid var(--panel-line); background:repeating-linear-gradient(to top,var(--ov055) 0,var(--ov055) 1px,transparent 1px,transparent 25%); pointer-events:none; }
    .inspection-lot-chart-col { position:relative; z-index:1; flex:1 1 0; min-width:0; display:grid; grid-template-rows:minmax(0,1fr) var(--lot-label-height); }
    .inspection-lot-chart-stack { min-width:0; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
    .inspection-lot-chart-value { width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; color:var(--text2); font-size:10px; font-weight:800; margin-bottom:6px; font-variant-numeric:tabular-nums; }
    .inspection-lot-chart-bar { width:clamp(3px,calc(100% - 4px),54px); height:var(--bar-height,0%); flex:0 0 auto; border-radius:8px 8px 0 0; background:linear-gradient(180deg,var(--inspection-tone,var(--cyan)),var(--blue)); opacity:.92; }
    .inspection-lot-chart-bar.has-value { min-height:4px; }
    .inspection-lot-chart-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-top:9px; text-align:center; color:var(--muted); font-size:9px; line-height:1.25; }
    .inspection-lot-chart.labels-full { --lot-label-height:58px; }
    .inspection-lot-chart.labels-full .inspection-lot-chart-label { display:-webkit-box; overflow:hidden; text-overflow:clip; white-space:normal; word-break:break-all; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; padding:9px 3px 0; font-size:10px; line-height:1.35; }
    .inspection-kpi-card.tone-inbound { --inspection-tone:var(--cyan); }
    .inspection-kpi-card.tone-complete { --inspection-tone:var(--green); }
    .inspection-kpi-card.tone-remaining { --inspection-tone:var(--yellow); }
    .inspection-kpi-card.tone-defect { --inspection-tone:var(--red); }
    .inspection-kpi-card.tone-complete .inspection-lot-chart-bar { background:linear-gradient(180deg,var(--green),rgba(52,211,153,.48)); }
    .inspection-kpi-card.tone-remaining .inspection-lot-chart-bar { background:linear-gradient(180deg,var(--yellow),rgba(251,191,36,.48)); }
    .inspection-kpi-card.tone-defect .inspection-lot-chart-bar { background:linear-gradient(180deg,var(--red),rgba(220,38,38,.58)); box-shadow:0 8px 20px rgba(220,38,38,.18); }
    .inspection-chart-empty { position:relative; z-index:1; min-height:218px; display:grid; place-items:center; text-align:center; color:var(--muted); font-size:12px; }
    .inspection-kpi-card.is-clickable { cursor:pointer; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    .inspection-kpi-card.is-clickable:hover { transform:translateY(-2px); border-color:rgba(251,113,133,.42); box-shadow:0 22px 64px rgba(220,38,38,.16); }
    .inspection-kpi-card.is-clickable:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
    .inspection-kpi-card.is-clickable .inspection-chart-scale { color:var(--red); font-weight:900; }
    .inspection-detail-card.is-collapsed .card-head { margin-bottom:0; }
    .inspection-detail-actions { display:flex; align-items:center; gap:8px; }
    .inspection-detail-toggle { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; background:var(--ov05); border-color:var(--panel-line); }
    .inspection-detail-toggle-arrow { display:inline-block; font-size:10px; transition:transform .18s ease; }
    .inspection-detail-toggle[aria-expanded="true"] .inspection-detail-toggle-arrow { transform:rotate(180deg); }
    .inspection-defect-backdrop { z-index:500; }
    .inspection-defect-modal { width:min(920px,100%); }
    .inspection-defect-summary { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .inspection-defect-note { color:var(--muted); font-size:11px; line-height:1.55; padding:11px 13px; border-radius:13px; background:rgba(251,113,133,.055); border:1px solid rgba(251,113,133,.16); margin-top:14px; }

    /* 생산 입고·검수: 불량 사진 갤러리 */
    .inspection-photo-card { overflow:hidden; }
    .inspection-photo-toolbar { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .inspection-photo-filters { display:flex; gap:7px; flex-wrap:wrap; min-width:0; }
    .inspection-photo-filter { padding:7px 11px; border-radius:999px; background:var(--ov04); border-color:var(--ov08); color:var(--muted); font-size:11px; }
    .inspection-photo-filter:hover { color:var(--text2); border-color:rgba(251,113,133,.34); }
    .inspection-photo-filter.active { color:#fff; background:rgba(251,113,133,.2); border-color:rgba(251,113,133,.48); box-shadow:0 8px 24px rgba(220,38,38,.12); }
    .inspection-photo-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:12px; }
    .inspection-photo-tile { display:block; min-width:0; padding:0; overflow:hidden; border-radius:17px; text-align:left; background:var(--ov035); border:1px solid var(--ov08); color:inherit; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    .inspection-photo-tile:hover { transform:translateY(-2px); border-color:rgba(251,113,133,.42); box-shadow:0 16px 36px rgba(0,0,0,.2); }
    .inspection-photo-tile:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
    .inspection-photo-media { position:relative; aspect-ratio:4/3; overflow:hidden; display:grid; place-items:center; background:linear-gradient(135deg,rgba(251,113,133,.09),var(--ov04)); }
    .inspection-photo-media img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .26s ease; }
    .inspection-photo-tile:hover .inspection-photo-media img { transform:scale(1.035); }
    .inspection-photo-fallback { width:100%; height:100%; display:grid; place-items:center; padding:18px; text-align:center; color:var(--muted); font-size:11px; line-height:1.55; }
    .inspection-photo-fallback strong { display:block; color:var(--text2); font-size:13px; margin-bottom:4px; }
    .inspection-photo-count { position:absolute; right:9px; bottom:9px; padding:5px 8px; border-radius:999px; color:#fff; background:rgba(8,15,31,.78); border:1px solid rgba(255,255,255,.16); font-size:9px; font-weight:900; backdrop-filter:blur(8px); }
    .inspection-photo-copy { min-width:0; padding:12px 13px 13px; }
    .inspection-photo-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-size:13px; }
    .inspection-photo-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:10px; margin-top:5px; }
    .inspection-photo-copy em { display:inline-flex; margin-top:8px; padding:4px 7px; border-radius:999px; color:var(--red); background:rgba(251,113,133,.08); border:1px solid rgba(251,113,133,.16); font-size:9px; font-style:normal; font-weight:900; }
    .inspection-photo-empty { position:relative; z-index:1; min-height:180px; display:grid; place-items:center; padding:24px; border:1px dashed var(--ov12); border-radius:17px; background:var(--ov025); text-align:center; color:var(--muted); font-size:12px; line-height:1.65; }
    .inspection-photo-empty strong { display:block; color:var(--text2); font-size:14px; margin-bottom:7px; }
    .inspection-photo-help { position:relative; z-index:1; margin-top:13px; padding:11px 13px; border-radius:13px; color:var(--muted); background:rgba(34,211,238,.055); border:1px solid rgba(34,211,238,.15); font-size:10px; line-height:1.55; }
    .inspection-photo-more { position:relative; z-index:1; display:flex; justify-content:center; margin-top:14px; }
    .inspection-photo-more button { background:var(--ov05); border-color:var(--panel-line); }
    .inspection-photo-table-button { padding:6px 9px; border-radius:999px; color:var(--red); background:rgba(251,113,133,.07); border-color:rgba(251,113,133,.22); white-space:nowrap; font-size:10px; }

    .inspection-photo-viewer-backdrop { position:fixed; inset:0; z-index:800; display:grid; place-items:center; padding:24px; background:rgba(0,0,0,.78); backdrop-filter:blur(8px); }
    .inspection-photo-viewer { width:min(1120px,100%); max-height:92vh; overflow:auto; border:1px solid var(--panel-line); border-radius:24px; background:var(--modal-bg); box-shadow:0 34px 110px rgba(0,0,0,.58); }

    };

    // ── 일반모드 / 다크모드 (나머지 대시보드와 동일한 방식: 메모리에만 유지, 기본값 다크) ──

    function applyTheme(theme) {

      const icon = document.getElementById('themeIcon');

    }
    function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

    // ── 연동된 스프레드시트 바로가기 (2개 이상이면 목록을 펼쳐서 선택) ──

    function csvUrl(gid) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }
    function csvUrlByName(sheetName) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`; }

    function parseCSV(text) {
      const rows = [];
      let row = [], value = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i], next = text[i + 1];
        if (char === '"' && inQuotes && next === '"') { value += '"'; i++; }
        else if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { row.push(value); value = ''; }
        else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (value || row.length) { row.push(value); rows.push(row); row = []; value = ''; }
          if (char === '\r' && next === '\n') i++;
        } else value += char;
      }
      if (value || row.length) { row.push(value); rows.push(row); }
      return rows.filter(r => r.some(c => String(c).trim() !== ''));
    }

    async function loadSheet(sheet) {
      const urls = typeof sheet === 'object'
        ? [
            ...(sheet.gid && /^[0-9]+$/.test(String(sheet.gid)) ? [csvUrl(sheet.gid)] : []),
            csvUrlByName(sheet.name)
          ]
        : [csvUrl(sheet)];

      let lastError = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`시트 로드 실패: ${res.status}`);
          const rows = parseCSV(await res.text());
          if (rows.length) return rows;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('시트 데이터를 불러오지 못했습니다.');
    }

    function toNum(v) {
      if (v === undefined || v === null || v === '') return 0;
      return Number(String(v).replace(/,/g, '').replace(/[^0-9.-]/g, '')) || 0;
    }

    function toDate(v) {
      if (v === undefined || v === null || v === '') return null;
      const raw = String(v).trim();

      const gvDate = raw.match(/Date[(]([0-9]{4}),[ ]*([0-9]{1,2}),[ ]*([0-9]{1,2})[)]/);
      if (gvDate) {
        return new Date(Number(gvDate[1]), Number(gvDate[2]), Number(gvDate[3]));
      }

      const krDate = raw.match(/([0-9]{4})[ ]*년[ ]*([0-9]{1,2})[ ]*월[ ]*([0-9]{1,2})[ ]*일/);
      if (krDate) {
        return new Date(Number(krDate[1]), Number(krDate[2]) - 1, Number(krDate[3]));
      }

      const shortKr = raw.match(/^(\d{2})년\s*(\d{1,2})월\s*(\d{1,2})일/);
      if (shortKr) {
        return new Date(2000 + Number(shortKr[1]), Number(shortKr[2]) - 1, Number(shortKr[3]));
      }

      const normal = raw.split(' ')[0].replaceAll('.', '-').replaceAll('/', '-');
      const direct = normal.match(/^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})$/);
      if (direct) {
        return new Date(Number(direct[1]), Number(direct[2]) - 1, Number(direct[3]));
      }

      if (/^[0-9]+([.][0-9]+)?$/.test(raw)) {
        const serial = Number(raw);
        if (serial > 20000 && serial < 80000) {
          const base = new Date(Date.UTC(1899, 11, 30));
          base.setUTCDate(base.getUTCDate() + Math.floor(serial));
          return new Date(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate());
        }
      }

      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
    function money(n) { return `${fmt(n)}원`; }
    function safeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    function usd(n) { return `$${fmt(Math.round(Number(n || 0)))}`; }
    function usdToKrw(n) { return Math.round(Number(n || 0) * 1500); }
    function pct(num, den) { return den ? `${((num / den) * 100).toFixed(2)}%` : '0.00%'; }
    function dateStr(d) {
      if (!d) return '-';
      const date = new Date(d);
      if (Number.isNaN(date.getTime())) return '-';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');

      const d = new Date();

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23,59,59,999);
      return x;
    }

    function endOfMonth(d) {
      return endOfDay(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    }

    const dashboardMotionState = {
      snapshots: new Map(),
      reduced: Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches),
      lastAnimatedTab: null
    };

    window.matchMedia?.('(prefers-reduced-motion: reduce)').addEventListener?.('change', event => {
      dashboardMotionState.reduced = event.matches;
    });

    function dashboardNumericTextNode(element) {
      if (!element) return null;
      const walker = document.createTreeWalker(element, window.NodeFilter?.SHOW_TEXT || 4);
      let node = walker.nextNode();
      while (node) {
        if (/[-+]?\d[\d,]*(?:\.\d+)?/.test(node.nodeValue || '')) return node;
        node = walker.nextNode();
      }
      return null;
    }

    function animateDashboardNumber(element, delay = 0) {
      const node = dashboardNumericTextNode(element);
      if (!node) return;
      const source = node.nodeValue || '';
      const match = source.match(/[-+]?\d[\d,]*(?:\.\d+)?/);
      if (!match) return;
      const target = Number(match[0].replaceAll(',', ''));
      if (!Number.isFinite(target) || target === 0) return;
      const decimals = (match[0].split('.')[1] || '').length;
      const prefix = source.slice(0, match.index);
      const suffix = source.slice((match.index || 0) + match[0].length);
      const format = value => Number(value).toLocaleString('ko-KR', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
      const duration = 760;
      const startedAt = performance.now() + delay;
      element.classList.add('number-counting');
      node.nodeValue = `${prefix}${format(0)}${suffix}`;

      const tick = now => {
        if (!node.isConnected) return;
        if (now < startedAt) {
          requestAnimationFrame(tick);
          return;
        }
        const progress = Math.min((now - startedAt) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = decimals ? target * eased : Math.round(target * eased);
        node.nodeValue = `${prefix}${format(current)}${suffix}`;
        if (progress < 1) requestAnimationFrame(tick);
        else {
          node.nodeValue = source;
          element.classList.remove('number-counting');
        }
      };
      requestAnimationFrame(tick);
    }

    function highlightDashboardUpdates(root) {
      const mode = state.viewMode?.[state.tab] || '';
      root.querySelectorAll('.card').forEach(card => {
        const title = card.querySelector('.card-title')?.textContent?.trim();
        const value = card.querySelector('.summary-kpi-value, .kpi-value, .shipping-total, .volume-compare-values')?.textContent?.trim();
        if (!title || !value) return;
        const key = `${state.tab}|${mode}|${title}`;
        const previous = dashboardMotionState.snapshots.get(key);
        dashboardMotionState.snapshots.set(key, value);
        if (previous !== undefined && previous !== value) {
          card.classList.add('data-updated');
          window.setTimeout(() => card.classList.remove('data-updated'), 1300);
        }
      });
    }

    function runDashboardAnimations(root) {
      if (!root || dashboardMotionState.reduced) return;
      highlightDashboardUpdates(root);

      Array.from(root.children).filter(node => node.classList?.contains('card')).forEach((card, index) => {
        card.style.setProperty('--enter-delay', `${Math.min(index, 12) * 48}ms`);
        card.classList.add('card-enter');
        card.addEventListener('animationend', event => {
          if (event.target === card && event.animationName === 'dashboard-card-enter') card.classList.remove('card-enter');
        });
      });

      root.querySelectorAll('.bar, .vbar, .simple-bar, .flow-bar, .period-vertical-bar, .shipping-day-bar, .volume-compare-bar, .inspection-lot-chart-bar').forEach((bar, index) => {
        bar.style.setProperty('--motion-delay', `${140 + Math.min(index, 14) * 28}ms`);
        bar.classList.add('dashboard-bar-animate');
      });

      root.querySelectorAll('.fill, .rank-fill, .period-compare-bar, .shipping-progress-fill, .inspection-lot-progress > div').forEach((bar, index) => {
        bar.style.setProperty('--motion-delay', `${150 + Math.min(index, 12) * 30}ms`);
        bar.classList.add('dashboard-progress-animate');
      });

      root.querySelectorAll('.summary-kpi-value, .kpi-value, .shipping-total, .volume-compare-values strong, .volume-compare-values b, .category-donut-center strong').forEach((element, index) => {
        animateDashboardNumber(element, 120 + Math.min(index, 8) * 38);
      });

      root.querySelectorAll('.category-donut-ring').forEach(ring => ring.classList.add('donut-animate'));
      root.querySelectorAll('.category-donut-row').forEach((row, index) => {
        row.style.setProperty('--motion-delay', `${360 + Math.min(index, 8) * 52}ms`);
        row.classList.add('legend-enter');
      });
      root.querySelectorAll('.badge.warn, .badge.danger').forEach(badge => badge.classList.add('motion-alert'));
    }

    function grid(html) {
      const root = document.getElementById('dashboardGrid');
      root.innerHTML = html;
      // 카드/사진/필터처럼 같은 탭 안에서 다시 렌더링될 때는 모션을 반복하지 않습니다.
      // 첫 데이터 표시와 실제 탭 전환 때만 현재 탭을 새 모션 대상으로 기록합니다.
      const shouldAnimate = state.loaded && dashboardMotionState.lastAnimatedTab !== state.tab;
      if (!shouldAnimate) return;
      dashboardMotionState.lastAnimatedTab = state.tab;
      requestAnimationFrame(() => runDashboardAnimations(root));
    }

    function rowsToObjects(rows) {
      const header = rows[0] || [];
      return rows.slice(1).map(r => {
        const obj = Object.fromEntries(header.map((h, i) => [h || `col${i}`, r[i] || '']));
        obj._row = r;
        return obj;
      });
    }

    function getCurrentPeriodRange() {
      const option = document.getElementById('periodSelect').value;
      const allDates = state.shipping.map(r => r.date).filter(Boolean);
      const minDate = allDates.length
        ? new Date(Math.min(...allDates.map(d => d.getTime())))
        : todayDate();
      let start;
      let end = endOfDay(todayDate());

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? endOfDay(new Date(endValue + 'T00:00:00')) : endOfDay(todayDate());
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        const today = todayDate();
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = endOfMonth(today);
      } else {
        start = todayDate();
        start.setDate(start.getDate() - Number(option) + 1);
      }

      return { start, end };
    }

    function filterObjectsByDate(objects, dateKey) {
      if (!dateKey) return objects;
      const { start, end } = getCurrentPeriodRange();
      if (!start || !end) return objects;

      return objects.filter(o => {
        const raw = o[dateKey];
        const d = toDate(raw);

        if (!d) return false;

        const compare = new Date(d);
        compare.setHours(0,0,0,0);

        const startDate = new Date(start);
        startDate.setHours(0,0,0,0);

        const endDate = new Date(end);
        endDate.setHours(23,59,59,999);

        return compare >= startDate && compare <= endDate;
      });
    }

    function getShippingData(rows) {
      const header = rows[0] || [];
      const statusIndex = header.findIndex(h => ['상태', '입력상태', '출고상태'].includes(String(h || '').trim()));
      const idx = {
        date: header.indexOf('날짜'),
        ship: header.indexOf('출고수량'),
        missing: header.indexOf('누락건수'),
        misdelivery: header.indexOf('오배송건수'),
        status: statusIndex
      };
      return rows.slice(1).map(r => ({
        date: toDate(r[idx.date]),
        dateText: r[idx.date],
        rawShipments: idx.ship >= 0 ? String(r[idx.ship] ?? '').trim() : '',
        shipments: toNum(r[idx.ship]),
        missing: toNum(r[idx.missing]),
        misdelivery: toNum(r[idx.misdelivery]),
        statusText: idx.status >= 0 ? String(r[idx.status] ?? '').trim() : ''
      })).filter(r => r.date);
    }

    function getLatestDate(data) {
      const dates = data.map(r => r.date).filter(Boolean);
      return dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : new Date();
    }

    function sameMonthData(data, baseDate, offset = 0) {
      const target = new Date(baseDate.getFullYear(), baseDate.getMonth() + offset, 1);
      return data.filter(r => r.date && r.date.getFullYear() === target.getFullYear() && r.date.getMonth() === target.getMonth());
    }

    function yearData(data, baseDate) {
      return data.filter(r => r.date && r.date.getFullYear() === baseDate.getFullYear());
    }

    function changeRate(current, previous) {
      if (!previous && !current) return '0.0%';
      if (!previous) return '+100.0%';
      const rate = ((current - previous) / previous) * 100;
      return `${rate >= 0 ? '+' : ''}${rate.toFixed(1)}%`;
    }

    function changeTone(current, previous, lowerIsBetter = false) {
      if (current === previous) return 'good';
      const up = current > previous;
      if (lowerIsBetter) return up ? 'warn' : 'good';
      return up ? 'good' : 'warn';
    }

    function filterByPeriod(data) {
      const option = document.getElementById('periodSelect').value;
      const customBox = document.getElementById('customDateBox');
      customBox.classList.toggle('show', option === 'custom');

      const allDates = data.map(r => r.date).filter(Boolean);
      const minDate = allDates.length
        ? new Date(Math.min(...allDates.map(d => d.getTime())))
        : todayDate();
      let start;
      let end = endOfDay(todayDate());

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? endOfDay(new Date(endValue + 'T00:00:00')) : endOfDay(todayDate());
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        const today = todayDate();
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = endOfMonth(today);
      } else {
        start = todayDate();
        start.setDate(start.getDate() - Number(option) + 1);
      }

      const filtered = data.filter(r => {
        if (!r.date) return false;
        const compare = new Date(r.date);
        compare.setHours(0,0,0,0);
        return compare >= start && compare <= end;
      });
      document.getElementById('periodLabel').textContent = `${dateStr(start)} ~ ${dateStr(end)}`;
      return filtered;
    }

    function getPreviousPeriodRange(start, end) {
      const startDate = new Date(start);
      startDate.setHours(0,0,0,0);
      const endDate = new Date(end);
      endDate.setHours(23,59,59,999);
      const days = Math.max(1, Math.floor((endOfDay(endDate) - startDate) / 86400000) + 1);
      const previousEnd = new Date(startDate);
      previousEnd.setDate(previousEnd.getDate() - 1);
      previousEnd.setHours(23,59,59,999);
      const previousStart = new Date(previousEnd);
      previousStart.setDate(previousStart.getDate() - days + 1);
      previousStart.setHours(0,0,0,0);
      return { start: previousStart, end: previousEnd, days };
    }

    function filterShippingByRange(data, range) {
      if (!range || !range.start || !range.end) return [];
      return data.filter(r => {
        if (!r.date) return false;
        const compare = new Date(r.date);
        compare.setHours(0,0,0,0);
        return compare >= range.start && compare <= range.end;
      });
    }

    function shippingShortDate(date) {
      return date ? `${date.getMonth()+1}/${date.getDate()}` : '-';
    }

    function shippingDayName(date) {
      return date ? ['일','월','화','수','목','금','토'][date.getDay()] : '-';
    }

    function getShippingDayStatus(date, row) {
      const explicit = String(row?.statusText || '').replaceAll(' ', '');
      if (explicit.includes('휴무') || explicit.includes('미운영')) return 'closed';
      const day = date.getDay();
      if (day === 0 || day === 6 || SHIPPING_CLOSED_DATES.has(dateStr(date))) return 'closed';
      if (explicit.includes('미입력') || explicit.includes('입력대기')) return 'pending';
      if (explicit.includes('입력완료') || explicit.includes('완료')) return 'complete';
      if (date > todayDate()) return 'future';
      if (!row) return 'pending';

      // 현재 시트는 미입력일도 0으로 내려오므로, 평일의 전 항목 0은 미입력으로 분리합니다.
      return row.shipments > 0 || row.missing > 0 || row.misdelivery > 0 ? 'complete' : 'pending';
    }

    function buildShippingPeriodComparison(periodRange, previousRange, currentData, previousData) {
      const currentMap = new Map(currentData.map(row => [dateStr(row.date), row]));
      const previousMap = new Map(previousData.map(row => [dateStr(row.date), row]));
      const days = Math.max(1, previousRange.days || 1);
      const pairs = [];

      for (let index = 0; index < days; index++) {
        const currentDate = new Date(periodRange.start);
        currentDate.setHours(0,0,0,0);
        currentDate.setDate(currentDate.getDate() + index);
        const previousDate = new Date(previousRange.start);
        previousDate.setHours(0,0,0,0);
        previousDate.setDate(previousDate.getDate() + index);
        const current = currentMap.get(dateStr(currentDate)) || null;
        const previous = previousMap.get(dateStr(previousDate)) || null;
        pairs.push({
          currentDate,
          previousDate,
          current,
          previous,
          currentStatus: getShippingDayStatus(currentDate, current),
          previousStatus: getShippingDayStatus(previousDate, previous)
        });
      }

      const completedCurrent = pairs.filter(pair => pair.currentStatus === 'complete');
      const completedPrevious = pairs.filter(pair => pair.previousStatus === 'complete');
      const pendingCount = pairs.filter(pair => pair.currentStatus === 'pending').length;
      const closedCount = pairs.filter(pair => pair.currentStatus === 'closed').length;
      const futureCount = pairs.filter(pair => pair.currentStatus === 'future').length;
      const requiredDays = completedCurrent.length + pendingCount;
      const sumKey = (items, side, key) => items.reduce((sum, pair) => sum + Number(pair[side]?.[key] || 0), 0);

      return {
        pairs,
        days,
        completedCount: completedCurrent.length,
        previousCompletedCount: completedPrevious.length,
        pendingCount,
        closedCount,
        futureCount,
        requiredDays,
        currentShip: sumKey(completedCurrent, 'current', 'shipments'),
        currentMissing: sumKey(completedCurrent, 'current', 'missing'),
        currentMis: sumKey(completedCurrent, 'current', 'misdelivery'),
        previousShip: sumKey(completedPrevious, 'previous', 'shipments'),
        previousMissing: sumKey(completedPrevious, 'previous', 'missing'),
        previousMis: sumKey(completedPrevious, 'previous', 'misdelivery')
      };
    }

    function renderSummaryKpiCard({ title, sub, value, unit = '', caption = '', tone = 'good', badge = '선택기간', extraClass = '', onclick = '' }) {
      const cls = tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : '';

      return `

          <div class="summary-kpi-value">${value}${unit ? `<small>${unit}</small>` : ''}</div>
          <div class="summary-kpi-caption">${caption}</div>

    function renderVolumeComparisonCard({ title, subtitle, current, previous, unit, labels, currentMeta = '', previousMeta = '', badge = '세로 막대', badgeTone = '', statusItems = [] }) {
      const currentValue = Number(current || 0);
      const previousValue = Number(previous || 0);

      const maxBarHeight = 182;

      const previousHeight = previousValue > 0 ? Math.max((previousValue / max) * maxBarHeight, 4) : 0;

      const deltaTone = delta > 0 ? 'good' : delta < 0 ? 'warn' : 'neutral';
      const deltaText = delta === 0
        ? '직전 대비 변화 없음'

        <div class="shipping-status ${item.tone || ''}"><span>${item.label}</span><strong>${item.value}</strong></div>`).join('')}</div>` : '';

      return `
        <article class="card full volume-compare-card">

              <div class="volume-compare-periods">
                <div class="volume-compare-period"><span>선택기간</span><strong>${labels.current}</strong>${currentMeta ? `<small>${currentMeta}</small>` : ''}</div>
                <div class="volume-compare-period"><span>직전기간</span><strong>${labels.previous}</strong>${previousMeta ? `<small>${previousMeta}</small>` : ''}</div>
              </div>

              <div class="volume-compare-chart">
                <div class="volume-compare-column"><div class="volume-compare-value">${fmt(currentValue)}${unit}</div><div class="volume-compare-bar" style="height:${currentHeight}px"></div></div>
                <div class="volume-compare-column"><div class="volume-compare-value">${fmt(previousValue)}${unit}</div><div class="volume-compare-bar previous" style="height:${previousHeight}px"></div></div>
              </div>
              <div class="volume-compare-axis"><div><strong>선택기간</strong><span>${labels.current}</span></div><div><strong>직전기간</strong><span>${labels.previous}</span></div></div>

      const hasPending = comparison.pendingCount > 0 || comparison.futureCount > 0;
      const progress = comparison.requiredDays ? Math.min((comparison.completedCount / comparison.requiredDays) * 100, 100) : 100;
      const delta = comparison.currentShip - comparison.previousShip;
      const deltaTone = delta > 0 ? 'good' : delta < 0 ? 'warn' : 'neutral';
      const deltaText = `${delta > 0 ? '+' : delta < 0 ? '-' : ''}${fmt(Math.abs(delta))}건 · ${changeRate(comparison.currentShip, comparison.previousShip)}`;

              <div class="shipping-match-result">

    function renderShippingQualitySummary(comparison) {
      const currentIssues = comparison.currentMissing + comparison.currentMis;
      const previousIssues = comparison.previousMissing + comparison.previousMis;
      const qualityTone = (now, before) => now === before ? 'neutral' : now < before ? 'good' : 'warn';
      const currentMissingRate = comparison.currentShip ? comparison.currentMissing / comparison.currentShip : 0;
      const previousMissingRate = comparison.previousShip ? comparison.previousMissing / comparison.previousShip : 0;
      const currentMisRate = comparison.currentShip ? comparison.currentMis / comparison.currentShip : 0;
      const previousMisRate = comparison.previousShip ? comparison.previousMis / comparison.previousShip : 0;
      const currentIssueRate = comparison.currentShip ? currentIssues / comparison.currentShip : 0;
      const previousIssueRate = comparison.previousShip ? previousIssues / comparison.previousShip : 0;
      const qualityRows = [
        { label:'누락률', current:`${fmt(comparison.currentMissing)}건 · ${pct(comparison.currentMissing, comparison.currentShip)}`, previous:`${fmt(comparison.previousMissing)}건 · ${pct(comparison.previousMissing, comparison.previousShip)}`, delta:changeRate(currentMissingRate, previousMissingRate), tone:qualityTone(currentMissingRate, previousMissingRate) },
        { label:'오배송률', current:`${fmt(comparison.currentMis)}건 · ${pct(comparison.currentMis, comparison.currentShip)}`, previous:`${fmt(comparison.previousMis)}건 · ${pct(comparison.previousMis, comparison.previousShip)}`, delta:changeRate(currentMisRate, previousMisRate), tone:qualityTone(currentMisRate, previousMisRate) },
        { label:'전체 이슈', current:`${fmt(currentIssues)}건 · ${pct(currentIssues, comparison.currentShip)}`, previous:`${fmt(previousIssues)}건 · ${pct(previousIssues, comparison.previousShip)}`, delta:changeRate(currentIssueRate, previousIssueRate), tone:qualityTone(currentIssueRate, previousIssueRate) }
      ];
      return `
        <article class="card side">
          <div class="card-head"><div><div class="card-title">출고 품질 요약</div><div class="card-sub">선택기간과 직전 동일 길이 기간 비교</div></div><span class="badge">품질</span></div>
          <div class="shipping-quality-list">${qualityRows.map(row => `
            <div class="shipping-quality-row">
              <div class="shipping-quality-top"><span>${row.label}</span><strong>${row.current}</strong></div>
              <div class="shipping-quality-sub"><span>직전 ${row.previous}</span><b class="${row.tone}">${row.delta}</b></div>
            </div>`).join('')}
          </div>
          <div class="shipping-quality-note">제작 현황과 동일하게 선택기간과 직전 동일 길이 기간의 합계를 비교합니다. 미입력일은 0건으로 간주하지 않으며, 휴무일과 주말은 운영일에서 제외합니다.</div>
        </article>`;
    }

    function renderShippingDailyComparison(comparison, labels) {
      const values = comparison.pairs.flatMap(pair => [
        pair.currentStatus === 'complete' ? Number(pair.current?.shipments || 0) : 0,
        pair.previousStatus === 'complete' ? Number(pair.previous?.shipments || 0) : 0
      ]);
      const max = Math.max(...values, 1);
      const statusLabel = { complete:'입력 완료', pending:'미입력', closed:'휴무', future:'예정' };
      const chartMinWidth = Math.max(comparison.pairs.length * 118 + Math.max(comparison.pairs.length - 1, 0) * 14, 1);

      return `
        <article class="card full">
          <div class="card-head"><div><div class="card-title">일별 출고량 비교</div><div class="card-sub">선택기간과 직전 동일 길이 기간의 출고량을 날짜 순서대로 비교</div></div><span class="badge">세로 막대</span></div>
          <div class="period-vertical-legend">
            <span><i class="period-compare-dot current"></i>선택기간 · ${labels.current}</span>
            <span><i class="period-compare-dot previous"></i>직전기간 · ${labels.previous}</span>
            <span>데이터가 없는 날은 미입력·휴무로 구분</span>
          </div>
          <div class="shipping-day-scroll"><div class="shipping-day-grid" style="grid-template-columns:repeat(${comparison.pairs.length},minmax(118px,1fr));min-width:max(100%,${chartMinWidth}px);">
            ${comparison.pairs.map(pair => {
              const currentValue = Number(pair.current?.shipments || 0);
              const previousValue = Number(pair.previous?.shipments || 0);
              const currentHeight = pair.currentStatus === 'complete' && currentValue > 0 ? Math.max((currentValue / max) * 100, 3) : 0;
              const previousHeight = pair.previousStatus === 'complete' && previousValue > 0 ? Math.max((previousValue / max) * 100, 3) : 0;
              const currentVisual = pair.currentStatus === 'complete'
                ? `<span class="shipping-day-value">${fmt(currentValue)}</span><div class="shipping-day-bar" style="height:${currentHeight}%"></div>`
                : `<div class="shipping-day-placeholder ${pair.currentStatus}">${statusLabel[pair.currentStatus]}</div>`;
              const previousVisual = pair.previousStatus === 'complete'
                ? `<span class="shipping-day-value">${fmt(previousValue)}</span><div class="shipping-day-bar previous" style="height:${previousHeight}%"></div>`
                : `<div class="shipping-day-placeholder ${pair.previousStatus}">${statusLabel[pair.previousStatus]}</div>`;
              return `<div class="shipping-day-group">
                <div class="shipping-day-head"><strong>${shippingShortDate(pair.currentDate)}</strong><span>${shippingDayName(pair.currentDate)}요일</span></div>
                <div class="shipping-day-plot"><div class="shipping-day-col">${currentVisual}</div><div class="shipping-day-col">${previousVisual}</div></div>
                <div class="shipping-day-axis"><span>선택</span><span>직전</span></div>
                <div class="shipping-day-status ${pair.currentStatus}">${statusLabel[pair.currentStatus]}</div>
                <div class="shipping-day-prev">직전 ${shippingShortDate(pair.previousDate)}</div>
              </div>`;
            }).join('')}
          </div></div>
        </article>`;
    }

    function metricCard(title, sub, value, caption, tone = 'good', spark = []) {
      const cls = tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : '';
      const max = Math.max(...spark, 1);
      const bars = spark.map(v => `<div class="bar" style="height:${Math.max((v / max) * 100, 3)}%"></div>`).join('');
      return `<article class="card kpi"><div class="card-head"><div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div><span class="badge ${cls}">${tone === 'danger' ? '즉시 확인' : tone === 'warn' ? '관리 필요' : '운영 KPI'}</span></div><div class="kpi-value">${value}</div><div class="kpi-caption">${caption}</div><div class="spark">${bars}</div></article>`;
    }

        notInbound: { title: '미입고 물품금액 구성 상세', key: a.poNotInboundKey, desc: '결제_PO관리 탭의 미입고 물품금액 기준' },
        unpaid: { title: '물품 미결제 잔액 구성 상세', key: a.poUnpaidBalanceKey, desc: '결제_PO관리 탭의 물품미결제잔액(외화) 기준' }

            product: a.productKey ? (o[a.productKey] || '품목 미지정') : '품목 미지정',
            currency,
            rate,
            foreign,
            krw,
            remainQty: 0
          };
        }).filter(r => r.krw !== 0 || r.foreign !== 0);
        rows = rows.concat(scheduledRows);
      }

      rows = rows.sort((x,y)=>y.krw-x.krw);

      const total = rows.reduce((s,r)=>s+r.krw,0);
      const vendorSummary = Object.values(rows.reduce((m,r)=>{
        if (!m[r.vendor]) m[r.vendor] = { name:r.vendor, value:0, qty:0 };
        m[r.vendor].value += r.krw;
        m[r.vendor].qty += 1;
        return m;
      }, {})).sort((a,b)=>b.value-a.value);

      return `
        <div class="modal-backdrop" onclick="closePaymentPoDetail()">

              <div class="pill">구성 행 ${fmt(rows.length)}건</div>
              <div class="pill">${type === 'unpaid' ? 'PO잔액 + 오늘포함 예정 포함' : '클릭한 카드 기준 상세'}</div>
            </div>
            <article class="card full" style="margin-bottom:16px;">
              <div class="card-head"><div><div class="card-title">거래처별 구성</div><div class="card-sub">금액 큰 순</div></div></div>

                <tbody>${rows.map(r=>`
                  <tr>
                    <td>${r.source || '-'}</td>
                    <td>${r.vendor}</td>
                    <td>${r.product}</td>
                    <td>${r.po || '-'}</td>
                    <td>${r.currency}</td>
                    <td class="right">${r.currency === 'RMB' ? '¥' : '$'}${fmt(r.foreign)}</td>

                    <td class="right">${fmt(r.remainQty)}</td>

                `).join('') || '<tr><td colspan="9" class="muted">표시할 상세 데이터가 없습니다.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
